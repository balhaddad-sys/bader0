<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Ataxia has more than one route</title><desc>Use limb, stance, eye and sensory findings together.. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker></defs><rect width="720" height="560" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Ataxia has more than one route</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Use limb, stance, eye and sensory findings together.</text><path d="M357 185C299 115 126 145 114 265C107 364 272 388 333 312C342 334 367 334 384 311C446 388 613 362 607 265C598 145 421 114 357 185Z" fill="#dfebda" stroke="#278278" stroke-width="3"/><ellipse cx="359" cy="254" rx="34" ry="91" fill="#e3c791"/><path d="M137 237C198 204 271 206 316 234" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M136 268C202 237 274 248 315 271" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 300C212 280 268 285 302 303" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 234C445 206 518 204 583 237" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 271C447 248 518 237 583 268" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 303C449 285 511 280 574 300" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="169" y="113" font-size="20" fill="#278278" text-anchor="start">Hemisphere</text><path d="M246 122L222 178" fill="none" stroke="#278278" stroke-width="2" /><text x="456" y="113" font-size="20" fill="#b17b30" text-anchor="start">Midline / vermis</text><path d="M472 122L365 177" fill="none" stroke="#b17b30" stroke-width="2" /><text x="35" y="412" font-size="18" fill="#278278" text-anchor="start">Limb dysmetria often points</text><text x="35" y="437" font-size="18" fill="#278278" text-anchor="start">to the same-side cerebellum</text><text x="35" y="462" font-size="18" fill="#278278" text-anchor="start">or its connected pathways.</text><text x="384" y="412" font-size="18" fill="#b17b30" text-anchor="start">Midline dysfunction may</text><text x="384" y="437" font-size="18" fill="#b17b30" text-anchor="start">affect stance and gait more</text><text x="384" y="462" font-size="18" fill="#b17b30" text-anchor="start">than isolated limb testing.</text><text x="35" y="502" font-size="17" fill="#64736c" text-anchor="start">Impaired position sense can cause sensory ataxia: test it directly.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>