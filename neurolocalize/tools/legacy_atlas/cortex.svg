<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Cortical clues form networks</title><desc>Lateral hemisphere schematic; anterior is on the left.. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker></defs><rect width="720" height="560" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Cortical clues form networks</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Lateral hemisphere schematic; anterior is on the left.</text><path d="M112 327C58 306 47 232 87 173C114 119 205 98 283 124C355 91 463 113 527 162C588 183 628 254 591 310C561 350 508 358 451 347C412 414 315 426 247 381C200 389 145 371 112 327Z" fill="#e5ece0" stroke="#173e39" stroke-width="3"/><path d="M301 128C291 183 274 212 271 260" fill="none" stroke="#278278" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 126C321 181 306 218 299 260" fill="none" stroke="#527da2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 284C281 253 400 273 464 324" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="192" cy="282" r="23" fill="#b17b30"/><circle cx="421" cy="279" r="23" fill="#b17b30"/><path d="M214 278C281 229 353 233 399 273" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="553" cy="263" r="27" fill="#527da2"/><text x="30" y="439" font-size="19" fill="#278278" text-anchor="start">Motor strip</text><text x="221" y="439" font-size="19" fill="#527da2" text-anchor="start">Sensory strip</text><text x="423" y="439" font-size="19" fill="#b17b30" text-anchor="start">Language network</text><path d="M109 417L292 173" fill="none" stroke="#278278" stroke-width="1" /><path d="M306 417L319 192" fill="none" stroke="#527da2" stroke-width="1" /><path d="M510 417L420 290" fill="none" stroke="#b17b30" stroke-width="1" /><text x="494" y="114" font-size="18" fill="#527da2" text-anchor="start">Visual cortex</text><path d="M555 123L555 230" fill="none" stroke="#527da2" stroke-width="2" /><text x="30" y="476" font-size="16" fill="#64736c" text-anchor="start">Language is usually left dominant; attention is a distributed network.</text><text x="30" y="501" font-size="16" fill="#64736c" text-anchor="start">Aphasia, neglect and cortical sensory signs need careful bedside testing.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>