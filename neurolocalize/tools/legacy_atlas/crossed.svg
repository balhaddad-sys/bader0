<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>A crossed face–body pattern</title><desc>Example: LEFT lateral medullary involvement; pathways simplified.. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker></defs><rect width="720" height="560" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">A crossed face–body pattern</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Example: LEFT lateral medullary involvement; pathways simplified.</text><rect x="32" y="112" width="291" height="87" rx="13" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="48" y="142" font-size="20" fill="#b17b30" text-anchor="start">Left face</text><text x="48" y="168" font-size="16" fill="#64736c" text-anchor="start">Pain / temperature reduction</text><rect x="405" y="112" width="281" height="87" rx="13" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="421" y="142" font-size="20" fill="#527da2" text-anchor="start">Right body</text><text x="421" y="168" font-size="16" fill="#64736c" text-anchor="start">Pain / temperature reduction</text><rect x="258" y="229" width="202" height="191" rx="75" fill="#e5ece0" stroke="#173e39" stroke-width="3"/><text x="309" y="266" font-size="15" fill="#64736c" text-anchor="start">MEDULLA</text><ellipse cx="295" cy="326" rx="46" ry="66" fill="#e6c78c" fill-opacity=".6" stroke="#b17b30" stroke-width="2"/><circle cx="287" cy="300" r="9" fill="#b17b30"/><circle cx="310" cy="352" r="9" fill="#527da2"/><path d="M155 199V237L280 295" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M680 199V449H398L312 358" fill="none" stroke="#527da2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="31" y="341" font-size="17" fill="#b17b30" text-anchor="start">Trigeminal pathway</text><text x="31" y="366" font-size="17" fill="#b17b30" text-anchor="start">before its crossing</text><path d="M205 332L278 306" fill="none" stroke="#b17b30" stroke-width="2" /><text x="487" y="324" font-size="17" fill="#527da2" text-anchor="start">Body pain pathway</text><text x="487" y="349" font-size="17" fill="#527da2" text-anchor="start">already crossed</text><text x="487" y="374" font-size="17" fill="#527da2" text-anchor="start">in the spinal cord</text><path d="M461 344L320 353" fill="none" stroke="#527da2" stroke-width="2" /><text x="32" y="486" font-size="17" fill="#64736c" text-anchor="start">Crossed signs are useful clues; not every brainstem lesion has them.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>