<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>A map from brain to muscle</title><desc>Start with distribution; then look for the finding that separates levels.. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker></defs><rect width="720" height="560" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">A map from brain to muscle</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Start with distribution; then look for the finding that separates levels.</text><rect x="30" y="94" width="278" height="76" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="46" y="124" font-size="20" fill="#278278" text-anchor="start">Cerebral cortex</text><text x="46" y="150" font-size="16" fill="#64736c" text-anchor="start">Language · attention · fields</text><rect x="30" y="194" width="278" height="76" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="46" y="224" font-size="20" fill="#278278" text-anchor="start">Deep brain / brainstem</text><text x="46" y="250" font-size="16" fill="#64736c" text-anchor="start">Compact tracts · cranial signs</text><rect x="30" y="294" width="278" height="76" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="46" y="324" font-size="20" fill="#278278" text-anchor="start">Spinal cord</text><text x="46" y="350" font-size="16" fill="#64736c" text-anchor="start">Sensory level · long tracts</text><rect x="412" y="94" width="278" height="76" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="428" y="124" font-size="20" fill="#278278" text-anchor="start">Root / plexus</text><text x="428" y="150" font-size="16" fill="#64736c" text-anchor="start">Myotome · several nerves</text><rect x="412" y="194" width="278" height="76" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="428" y="224" font-size="20" fill="#278278" text-anchor="start">Peripheral nerve</text><text x="428" y="250" font-size="16" fill="#64736c" text-anchor="start">A named nerve distribution</text><rect x="412" y="294" width="278" height="76" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="428" y="324" font-size="20" fill="#278278" text-anchor="start">Junction / muscle</text><text x="428" y="350" font-size="16" fill="#64736c" text-anchor="start">Motor pattern; sensation spared</text><path d="M169 170L169 190" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><path d="M169 270L169 290" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><path d="M308 332H353V132H408" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M551 170L551 190" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><path d="M551 270L551 290" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="404" width="660" height="92" rx="13" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="46" y="434" font-size="20" fill="#b17b30" text-anchor="start">One clue rarely fixes one location.</text><text x="46" y="460" font-size="16" fill="#64736c" text-anchor="start">Combine motor, sensory, reflex, cranial and higher cortical findings.</text><text x="46" y="485" font-size="16" fill="#64736c" text-anchor="start">A pattern can narrow the level without proving a specific disease.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>