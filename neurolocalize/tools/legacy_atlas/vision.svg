<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>A hemifield travels to the opposite brain</title><desc>LEFT visual field example · simplified top-down pathway map.. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker></defs><rect width="720" height="560" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">A hemifield travels to the opposite brain</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">LEFT visual field example · simplified top-down pathway map.</text><text x="97" y="104" font-size="15" fill="#64736c" text-anchor="start">LEFT EYE</text><text x="502" y="104" font-size="15" fill="#64736c" text-anchor="start">RIGHT EYE</text><ellipse cx="151" cy="155" rx="49" ry="34" fill="#fff" stroke="#173e39" stroke-width="2"/><ellipse cx="551" cy="155" rx="49" ry="34" fill="#fff" stroke="#173e39" stroke-width="2"/><circle cx="176" cy="160" r="7" fill="#b17b30"/><circle cx="574" cy="160" r="7" fill="#b17b30"/><path d="M176 169L304 261L463 344" fill="none" stroke="#b17b30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M574 169L463 344" fill="none" stroke="#b17b30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 169L228 344" fill="none" stroke="#527da2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M527 169L399 261L228 344" fill="none" stroke="#527da2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="134" y="349" width="183" height="65" rx="13" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="150" y="379" font-size="20" fill="#527da2" text-anchor="start">Left LGN</text><rect x="378" y="349" width="183" height="65" rx="13" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="394" y="379" font-size="20" fill="#b17b30" text-anchor="start">Right LGN</text><path d="M229 414L229 453" fill="none" stroke="#527da2" stroke-width="3" /><path d="M468 414L468 453" fill="none" stroke="#b17b30" stroke-width="4" /><rect x="121" y="456" width="208" height="52" rx="13" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="137" y="486" font-size="20" fill="#527da2" text-anchor="start">Left visual cortex</text><rect x="363" y="456" width="214" height="52" rx="13" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="379" y="486" font-size="20" fill="#b17b30" text-anchor="start">Right visual cortex</text><text x="38" y="280" font-size="17" fill="#64736c" text-anchor="start">Nasal retinal</text><text x="38" y="305" font-size="17" fill="#64736c" text-anchor="start">fibers cross.</text><text x="570" y="273" font-size="15" fill="#64736c" text-anchor="start">Temporal fibers</text><text x="570" y="298" font-size="15" fill="#64736c" text-anchor="start">stay on the</text><text x="570" y="323" font-size="15" fill="#64736c" text-anchor="start">same side.</text><text x="298" y="225" font-size="14" fill="#64736c" text-anchor="start">CHIASM</text><text x="269" y="432" font-size="14" fill="#64736c" text-anchor="start">LGN = thalamic relay</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>