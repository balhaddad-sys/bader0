<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>Sorting an aphasia at the bedside</title><desc>Fluency, comprehension and repetition classify the classic syndromes. Original simplified teaching diagram; not to scale.</desc><defs></defs><rect width="720" height="600" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Sorting an aphasia at the bedside</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Fluency, comprehension and repetition classify the classic syndromes.</text><rect x="270.0" y="92" width="180" height="40" rx="20" fill="#ffffff" stroke="#173e39" stroke-width="2"/><text x="360" y="118" font-size="15" fill="#173e39" text-anchor="middle">Fluent speech?</text><path d="M360 132C360 162 180 156 180 186" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="262.0" y="163.0" font-size="12" fill="#64736c" text-anchor="end">no</text><rect x="100.0" y="186" width="160" height="40" rx="20" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="180" y="212" font-size="15" fill="#278278" text-anchor="middle">Comprehends?</text><path d="M360 132C360 162 540 156 540 186" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="458.0" y="163.0" font-size="12" fill="#64736c" text-anchor="start">yes</text><rect x="460.0" y="186" width="160" height="40" rx="20" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="540" y="212" font-size="15" fill="#278278" text-anchor="middle">Comprehends?</text><path d="M180 226C180 256 90 250 90 280" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="127.0" y="257.0" font-size="12" fill="#64736c" text-anchor="end">yes</text><rect x="32.0" y="280" width="116" height="40" rx="20" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="90" y="306" font-size="15" fill="#527da2" text-anchor="middle">Repeats?</text><path d="M180 226C180 256 270 250 270 280" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="233.0" y="257.0" font-size="12" fill="#64736c" text-anchor="start">no</text><rect x="212.0" y="280" width="116" height="40" rx="20" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="270" y="306" font-size="15" fill="#527da2" text-anchor="middle">Repeats?</text><path d="M540 226C540 256 450 250 450 280" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="487.0" y="257.0" font-size="12" fill="#64736c" text-anchor="end">yes</text><rect x="392.0" y="280" width="116" height="40" rx="20" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="450" y="306" font-size="15" fill="#527da2" text-anchor="middle">Repeats?</text><path d="M540 226C540 256 630 250 630 280" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="593.0" y="257.0" font-size="12" fill="#64736c" text-anchor="start">no</text><rect x="572.0" y="280" width="116" height="40" rx="20" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="630" y="306" font-size="15" fill="#527da2" text-anchor="middle">Repeats?</text><path d="M90 320C90 350 52 350 52 380" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="63.0" y="354.0" font-size="12" fill="#64736c" text-anchor="end">no</text><rect x="14" y="382" width="76" height="40" rx="8" fill="#e3cfb1" stroke="#b17b30" stroke-width="2"/><text x="52" y="407" font-size="12" fill="#173e39" text-anchor="middle">Broca</text><path d="M90 320C90 350 132 350 132 380" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="119.0" y="354.0" font-size="12" fill="#64736c" text-anchor="start">yes</text><rect x="94" y="382" width="76" height="40" rx="8" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="132" y="407" font-size="12" fill="#173e39" text-anchor="middle">TC motor</text><path d="M270 320C270 350 222 350 222 380" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="238.0" y="354.0" font-size="12" fill="#64736c" text-anchor="end">no</text><rect x="184" y="382" width="76" height="40" rx="8" fill="#e3cfb1" stroke="#b17b30" stroke-width="2"/><text x="222" y="407" font-size="12" fill="#173e39" text-anchor="middle">Global</text><path d="M270 320C270 350 302 350 302 380" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="294.0" y="354.0" font-size="12" fill="#64736c" text-anchor="start">yes</text><rect x="264" y="382" width="76" height="40" rx="8" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="302" y="407" font-size="12" fill="#173e39" text-anchor="middle">Mixed TC</text><path d="M450 320C450 350 418 350 418 380" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="426.0" y="354.0" font-size="12" fill="#64736c" text-anchor="end">no</text><rect x="380" y="382" width="76" height="40" rx="8" fill="#e3cfb1" stroke="#b17b30" stroke-width="2"/><text x="418" y="407" font-size="12" fill="#173e39" text-anchor="middle">Conduction</text><path d="M450 320C450 350 498 350 498 380" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="482.0" y="354.0" font-size="12" fill="#64736c" text-anchor="start">yes</text><rect x="460" y="382" width="76" height="40" rx="8" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="498" y="407" font-size="12" fill="#173e39" text-anchor="middle">Anomic</text><path d="M630 320C630 350 588 350 588 380" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="601.0" y="354.0" font-size="12" fill="#64736c" text-anchor="end">no</text><rect x="550" y="382" width="76" height="40" rx="8" fill="#e3cfb1" stroke="#b17b30" stroke-width="2"/><text x="588" y="407" font-size="12" fill="#173e39" text-anchor="middle">Wernicke</text><path d="M630 320C630 350 668 350 668 380" fill="none" stroke="#b3c5b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="657.0" y="354.0" font-size="12" fill="#64736c" text-anchor="start">yes</text><rect x="630" y="382" width="76" height="40" rx="8" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="668" y="407" font-size="12" fill="#173e39" text-anchor="middle">TC sensory</text><text x="360" y="446" font-size="12" fill="#64736c" text-anchor="middle">Shaded = repetition impaired (perisylvian loop involved) · TC = transcortical</text><rect x="30" y="462" width="660" height="88" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="44" y="488" font-size="18" fill="#b17b30" text-anchor="start">Approximate correlates</text><text x="44" y="514" font-size="15" fill="#64736c" text-anchor="start">Broca: inferior frontal · Wernicke: posterior superior temporal ·</text><text x="44" y="534" font-size="15" fill="#64736c" text-anchor="start">Conduction: links between them. Syndromes overlap; describe first.</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>