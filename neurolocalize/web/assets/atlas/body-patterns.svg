height="70" rx="7"/><rect x="571" y="466" width="21" height="78" rx="9"/><rect x="598" y="466" width="21" height="78" rx="9"/></g><g fill="#b17b30" opacity=".75" clip-path="url(#clip6)"><rect x="545" y="392" width="100" height="30"/><rect x="570" y="454" width="50" height="40"/></g><g fill="none" stroke="#173e39" stroke-width="2"><circle cx="595" cy="370" r="17"/><rect x="570" y="392" width="50" height="72" rx="10"/><rect x="554" y="394" width="14" height="70" rx="7"/><rect x="622" y="394" width="14" height="70" rx="7"/><rect x="571" y="466" width="21" height="78" rx="9"/><rect x="598" y="466" width="21" height="78" rx="9"/></g><text x="595" y="564" font-size="15" fill="#173e39" text-anchor="middle">Shoulders and hips</text><text x="595" y="584" font-size="13" fill="#278278" text-anchor="middle">Muscle or junction (motor)</text><text x="40" y="612" font-size="13" fill="#b17b30" text-anchor="start">Figures face you. Shading shows where findings cluster, not exact borders.</text><path d="M28 624L692 624" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="647" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>