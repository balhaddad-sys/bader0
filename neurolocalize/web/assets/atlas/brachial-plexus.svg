<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>The brachial plexus in five columns</title><desc>Roots → trunks → divisions → cords → terminal nerves. Original simplified teaching diagram; not to scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter></defs><rect width="720" height="620" rx="14" fill="#fcfcf9"/><rect x=".5" y=".5" width="719" height="619" rx="13.5" fill="none" stroke="#dde3d8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="25" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.3">The brachial plexus in five columns</text><text x="28" y="66" font-size="14" fill="#64736c" text-anchor="start">Roots → trunks → divisions → cords → terminal nerves.</text><text x="66" y="100" font-size="12" fill="#64736c" text-anchor="middle" font-weight="700" letter-spacing=".9">ROOTS</text><text x="196" y="100" font-size="12" fill="#64736c" text-anchor="middle" font-weight="700" letter-spacing=".9">TRUNKS</text><text x="310" y="100" font-size="12" fill="#64736c" text-anchor="middle" font-weight="700" letter-spacing=".9">DIVISIONS</text><text x="430" y="100" font-size="12" fill="#64736c" text-anchor="middle" font-weight="700" letter-spacing=".9">CORDS</text><te