<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>The brachial plexus in five columns</title><desc>Roots → trunks → divisions → cords → terminal nerves. Original simplified teaching diagram; not to scale.</desc><defs></defs><rect width="720" height="620" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">The brachial plexus in five columns</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Roots → trunks → divisions → cords → terminal nerves.</text><text x="66" y="100" font-size="12" fill="#64736c" text-anchor="middle" font-weight="700">ROOTS</text><text x="196" y="100" font-size="12" fill="#64736c" text-anchor="middle" font-weight="700">TRUNKS</text><text x="310" y="100" font-size="12" fill="#64736c" text-anchor="middle" font-weight="700">DIVISIONS</text><text x="430" y="100" font-size="12" fill="#64736c" text-anchor="middle" font-weight="700">CORDS</text><text x="590" y="100" font-size="12" fill="#64736c" text-anchor="middle" font-weight="700">NERVES</text><path d="M86 128C130 128 140 155 180 155" fill="none" stroke="#173e39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 182C130 182 140 155 180 155" fill="none" stroke="#173e39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 236C130 236 140 236 180 236" fill="none" stroke="#173e39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 290C130 290 140 317 180 317" fill="none" stroke="#173e39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 344C130 344 140 317 180 317" fill="none" stroke="#173e39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M212 155C300 147 330 150 414 150" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M212 155C300 163 330 236 414 236" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M212 236C300 228 330 150 414 150" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M212 236C300 244 330 236 414 236" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M212 317C300 309 330 322 414 322" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M212 317C300 325 330 236 414 236" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M446 150C500 150 510 128 556 128" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M446 150C500 150 510 312 556 312" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M446 322C500 322 510 312 556 312" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M446 322C500 322 510 372 556 372" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M446 236C500 236 510 190 556 190" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M446 236C500 236 510 250 556 250" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="46" y="113" width="40" height="30" rx="15" fill="#173e39"/><text x="66" y="133" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">C5</text><rect x="46" y="167" width="40" height="30" rx="15" fill="#173e39"/><text x="66" y="187" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">C6</text><rect x="46" y="221" width="40" height="30" rx="15" fill="#173e39"/><text x="66" y="241" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">C7</text><rect x="46" y="275" width="40" height="30" rx="15" fill="#173e39"/><text x="66" y="295" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">C8</text><rect x="46" y="329" width="40" height="30" rx="15" fill="#173e39"/><text x="66" y="349" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">T1</text><circle cx="196" cy="155" r="16" fill="#ffffff" stroke="#173e39" stroke-width="2.5"/><text x="196" y="189" font-size="12" fill="#173e39" text-anchor="middle">Upper</text><circle cx="196" cy="236" r="16" fill="#ffffff" stroke="#173e39" stroke-width="2.5"/><text x="196" y="270" font-size="12" fill="#173e39" text-anchor="middle">Middle</text><circle cx="196" cy="317" r="16" fill="#ffffff" stroke="#173e39" stroke-width="2.5"/><text x="196" y="351" font-size="12" fill="#173e39" text-anchor="middle">Lower</text><circle cx="430" cy="150" r="16" fill="#ffffff" stroke="#278278" stroke-width="3"/><text x="430" y="184" font-size="12" fill="#173e39" text-anchor="middle">Lateral</text><circle cx="430" cy="236" r="16" fill="#ffffff" stroke="#b17b30" stroke-width="3"/><text x="430" y="270" font-size="12" fill="#173e39" text-anchor="middle">Posterior</text><circle cx="430" cy="322" r="16" fill="#ffffff" stroke="#278278" stroke-width="3"/><text x="430" y="356" font-size="12" fill="#173e39" text-anchor="middle">Medial</text><circle cx="560" cy="128" r="6" fill="#173e39"/><text x="572" y="133" font-size="14" fill="#173e39" text-anchor="start">Musculocutaneous</text><circle cx="560" cy="190" r="6" fill="#173e39"/><text x="572" y="195" font-size="14" fill="#173e39" text-anchor="start">Axillary</text><circle cx="560" cy="250" r="6" fill="#173e39"/><text x="572" y="255" font-size="14" fill="#173e39" text-anchor="start">Radial</text><circle cx="560" cy="312" r="6" fill="#173e39"/><text x="572" y="317" font-size="14" fill="#173e39" text-anchor="start">Median</text><circle cx="560" cy="372" r="6" fill="#173e39"/><text x="572" y="377" font-size="14" fill="#173e39" text-anchor="start">Ulnar</text><path d="M260 400L290 400" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="298" y="405" font-size="12" fill="#64736c" text-anchor="start">anterior divisions (flexor side)</text><path d="M260 422L290 422" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="298" y="427" font-size="12" fill="#64736c" text-anchor="start">posterior divisions (extensor side)</text><rect x="30" y="448" width="322" height="116" rx="12" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="44" y="474" font-size="17" fill="#278278" text-anchor="start">Upper trunk (C5–C6)</text><text x="44" y="499" font-size="14" fill="#64736c" text-anchor="start">Shoulder abduction, external</text><text x="44" y="518" font-size="14" fill="#64736c" text-anchor="start">rotation and elbow flexion weak;</text><text x="44" y="537" font-size="14" fill="#64736c" text-anchor="start">lateral arm sensory change.</text><rect x="368" y="448" width="322" height="116" rx="12" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="382" y="474" font-size="17" fill="#527da2" text-anchor="start">Lower trunk (C8–T1)</text><text x="382" y="499" font-size="14" fill="#64736c" text-anchor="start">Hand muscles weak across</text><text x="382" y="518" font-size="14" fill="#64736c" text-anchor="start">median and ulnar territories;</text><text x="382" y="537" font-size="14" fill="#64736c" text-anchor="start">medial forearm/hand sensory loss.</text><path d="M28 584L692 584" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="607" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>