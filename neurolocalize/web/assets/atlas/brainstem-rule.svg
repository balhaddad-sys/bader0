<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>Medial and lateral brainstem clues</title><desc>The 'rule of 4': a teaching shortcut for brainstem syndromes. Original simplified teaching diagram; not to scale.</desc><defs></defs><rect width="720" height="600" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Medial and lateral brainstem clues</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">The 'rule of 4': a teaching shortcut for brainstem syndromes.</text><path d="M70 100L170 100L178 190L196 210L200 300L182 330L172 420L160 470L80 470L68 420L58 330L40 300L44 210L62 190Z" fill="#e5ece0" stroke="#173e39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="96" y="100" width="48" height="370" fill="#dcebe6"/><path d="M120 92L120 478" fill="none" stroke="#278278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M44 190L196 190" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 330L196 330" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="128" font-size="12" fill="#173e39" text-anchor="middle" font-weight="700">MIDBRAIN</text><text x="120" y="160" font-size="18" fill="#278278" text-anchor="middle">III  IV</text><text x="120" y="232" font-size="12" fill="#173e39" text-anchor="middle" font-weight="700">PONS</text><text x="120" y="264" font-size="16" fill="#278278" text-anchor="middle">V VI VII VIII</text><text x="120" y="360" font-size="12" fill="#173e39" text-anchor="middle" font-weight="700">MEDULLA</text><text x="120" y="392" font-size="16" fill="#278278" text-anchor="middle">IX X XI XII</text><text x="120" y="496" font-size="11" fill="#64736c" text-anchor="middle">XI arises mainly from</text><text x="120" y="511" font-size="11" fill="#64736c" text-anchor="middle">the upper cervical cord</text><text x="48" y="548" font-size="11" fill="#278278" text-anchor="start">Shaded strip = medial</text><rect x="232" y="96" width="458" height="184" rx="12" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="246" y="122" font-size="17" fill="#278278" text-anchor="start">MEDIAL: the four 'M's</text><text x="248" y="152" font-size="15" fill="#173e39" text-anchor="start">Motor pathway</text><text x="476" y="152" font-size="13" fill="#64736c" text-anchor="start">opposite arm and leg weak</text><text x="248" y="185" font-size="15" fill="#173e39" text-anchor="start">Medial lemniscus</text><text x="476" y="185" font-size="13" fill="#64736c" text-anchor="start">opposite vibration and position loss</text><text x="248" y="218" font-size="15" fill="#173e39" text-anchor="start">MLF</text><text x="476" y="218" font-size="13" fill="#64736c" text-anchor="start">same-side INO (adduction lag)</text><text x="248" y="251" font-size="15" fill="#173e39" text-anchor="start">Motor nuclei III, IV, VI, XII</text><text x="476" y="251" font-size="13" fill="#64736c" text-anchor="start">same-side cranial nerve signs</text><rect x="232" y="296" width="458" height="184" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="246" y="322" font-size="17" fill="#b17b30" text-anchor="start">LATERAL: the four 'S's</text><text x="248" y="352" font-size="15" fill="#173e39" text-anchor="start">Spinocerebellar links</text><text x="476" y="352" font-size="13" fill="#64736c" text-anchor="start">same-side limb ataxia</text><text x="248" y="385" font-size="15" fill="#173e39" text-anchor="start">Spinothalamic tract</text><text x="476" y="385" font-size="13" fill="#64736c" text-anchor="start">opposite body pain, temperature</text><text x="248" y="418" font-size="15" fill="#173e39" text-anchor="start">Sensory nucleus of V</text><text x="476" y="418" font-size="13" fill="#64736c" text-anchor="start">same-side facial pain, temperature</text><text x="248" y="451" font-size="15" fill="#173e39" text-anchor="start">Sympathetic pathway</text><text x="476" y="451" font-size="13" fill="#64736c" text-anchor="start">same-side Horner syndrome</text><rect x="232" y="494" width="458" height="56" rx="12" fill="#ffffff" stroke="#d6dfd3" stroke-width="2"/><text x="248" y="516" font-size="13" fill="#64736c" text-anchor="start">Medial motor nuclei divide 12 evenly (3, 4, 6, 12); V, VII, IX, X</text><text x="248" y="534" font-size="13" fill="#64736c" text-anchor="start">are lateral. Real lesions are rarely this tidy; IV fibers cross.</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>