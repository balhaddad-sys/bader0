<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>Medial and lateral brainstem clues</title><desc>The 'rule of 4': a teaching shortcut for brainstem syndromes. Original simplified teaching diagram; not to scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><radialGradient id="rf1f5eed4e0cf" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f1f5ee"/><stop offset="1" stop-color="#d4e0cf"/></radialGradient><clipPath id="clip1"><path d="M60 96C80 106 98 110 120 110C142 110 160 106 180 96L178 188C196 198 206 224 206 258C206 294 196 318 180 332L176 360C188 372 188 398 176 410L166 440C164 456 162 468 160 480L80 480C78 468 76 456 74 440L64 410C52 398 52 372 64 360L60 332C44 318 34 294 34 258C34 224 44 198 62 188Z"/></clipPath></defs><rect width="720" height="600" rx="14" fill="#fcfcf9"/><rect x=".5" y=".5" width="719" height="599" rx="13.5" fill="none" stroke="#dde3d8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="25" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.3">Medial and lateral brainstem clues</text><text x="28" y="66" font-size="14" fill="#64736c" text-anchor="start">The 'rule of 4': a teaching shortcut for brainstem syndromes.</text><path d="M60 96C80 106 98 110 120 110C142 110 160 106 180 96L178 188C196 198 206 224 206 258C206 294 196 318 180 332L176 360C188 372 188 398 176 410L166 440C164 456 162 468 160 480L80 480C78 468 76 456 74 440L64 410C52 398 52 372 64 360L60 332C44 318 34 294 34 258C34 224 44 198 62 188Z" fill="url(#rf1f5eed4e0cf)"/><g clip-path="url(#clip1)"><rect x="96" y="90" width="48" height="400" fill="#278278" opacity=".13"/><path d="M30 212Q120 226 210 212" fill="none" stroke="#b3c5b5" stroke-width="1.2" opacity=".7"/><path d="M30 228Q120 242 210 228" fill="none" stroke="#b3c5b5" stroke-width="1.2" opacity=".7"/><path d="M30 244Q120 258 210 244" fill="none" stroke="#b3c5b5" stroke-width="1.2" opacity=".7"/><path d="M30 260Q120 274 210 260" fill="none" stroke="#b3c5b5" stroke-width="1.2" opacity=".7"/><path d="M30 276Q120 290 210 276" fill="none" stroke="#b3c5b5" stroke-width="1.2" opacity=".7"/><path d="M30 292Q120 306 210 292" fill="none" stroke="#b3c5b5" stroke-width="1.2" opacity=".7"/><path d="M30 308Q120 322 210 308" fill="none" stroke="#b3c5b5" stroke-width="1.2" opacity=".7"/><path d="M106 344L104 480M134 344L136 480" fill="none" stroke="#b3c5b5" stroke-width="1.4"/><ellipse cx="62" cy="384" rx="9" ry="20" fill="none" stroke="#b3c5b5" stroke-width="1.4"/><ellipse cx="178" cy="384" rx="9" ry="20" fill="none" stroke="#b3c5b5" stroke-width="1.4"/></g><path d="M60 96C80 106 98 110 120 110C142 110 160 106 180 96L178 188C196 198 206 224 206 258C206 294 196 318 180 332L176 360C188 372 188 398 176 410L166 440C164 456 162 468 160 480L80 480C78 468 76 456 74 440L64 410C52 398 52 372 64 360L60 332C44 318 34 294 34 258C34 224 44 198 62 188Z" fill="none" stroke="#173e39" stroke-width="2.4" stroke-linejoin="round"/><path d="M120 92L120 478" fill="none" stroke="#278278" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M44 190L196 190" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 330L196 330" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="128" font-size="12" fill="#173e39" text-anchor="middle" font-weight="700" letter-spacing=".9">MIDBRAIN</text><text x="120" y="160" font-size="18" fill="#278278" text-anchor="middle">III  IV</text><text x="120" y="232" font-size="12" fill="#173e39" text-anchor="middle" font-weight="700" letter-spacing=".9">PONS</text><text x="120" y="264" font-size="16" fill="#278278" text-anchor="middle">V VI VII VIII</text><text x="120" y="360" font-size="12" fill="#173e39" text-anchor="middle" font-weight="700" letter-spacing=".9">MEDULLA</text><text x="120" y="392" font-size="16" fill="#278278" text-anchor="middle">IX X XI XII</text><text x="120" y="496" font-size="11" fill="#64736c" text-anchor="middle">XI arises mainly from</text><text x="120" y="511" font-size="11" fill="#64736c" text-anchor="middle">the upper cervical cord</text><text x="48" y="548" font-size="11" fill="#278278" text-anchor="start">Shaded strip = medial</text><rect x="232" y="96" width="458" height="184" rx="8" fill="#ffffff" stroke="#9ec7c2" stroke-width="1"/><path d="M240 96.6L682 96.6" stroke="#278278" stroke-width="2.4" stroke-linecap="round"/><text x="246" y="120" font-size="12" fill="#278278" font-weight="700" letter-spacing="1.1">MEDIAL: THE FOUR 'M'S</text><text x="248" y="152" font-size="15" fill="#173e39" text-anchor="start">Motor pathway</text><text x="476" y="152" font-size="13" fill="#64736c" text-anchor="start">opposite arm and leg weak</text><text x="248" y="185" font-size="15" fill="#173e39" text-anchor="start">Medial lemniscus</text><text x="476" y="185" font-size="13" fill="#64736c" text-anchor="start">opposite vibration and position loss</text><text x="248" y="218" font-size="15" fill="#173e39" text-anchor="start">MLF</text><text x="476" y="218" font-size="13" fill="#64736c" text-anchor="start">same-side INO (adduction lag)</text><text x="248" y="251" font-size="15" fill="#173e39" text-anchor="start">Motor nuclei III, IV, VI, XII</text><text x="476" y="251" font-size="13" fill="#64736c" text-anchor="start">same-side cranial nerve signs</text><rect x="232" y="296" width="458" height="184" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M240 296.6L682 296.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="246" y="320" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">LATERAL: THE FOUR 'S'S</text><text x="248" y="352" font-size="15" fill="#173e39" text-anchor="start">Spinocerebellar links</text><text x="476" y="352" font-size="13" fill="#64736c" text-anchor="start">same-side limb ataxia</text><text x="248" y="385" font-size="15" fill="#173e39" text-anchor="start">Spinothalamic tract</text><text x="476" y="385" font-size="13" fill="#64736c" text-anchor="start">opposite body pain, temperature</text><text x="248" y="418" font-size="15" fill="#173e39" text-anchor="start">Sensory nucleus of V</text><text x="476" y="418" font-size="13" fill="#64736c" text-anchor="start">same-side facial pain, temperature</text><text x="248" y="451" font-size="15" fill="#173e39" text-anchor="start">Sympathetic pathway</text><text x="476" y="451" font-size="13" fill="#64736c" text-anchor="start">same-side Horner syndrome</text><rect x="232" y="494" width="458" height="56" rx="12" fill="#ffffff" stroke="#d6dfd3" stroke-width="1.2"/><text x="248" y="516" font-size="13" fill="#64736c" text-anchor="start">Medial motor nuclei divide 12 evenly (3, 4, 6, 12); V, VII, IX, X</text><text x="248" y="534" font-size="13" fill="#64736c" text-anchor="start">are lateral. Real lesions are rarely this tidy; IV fibers cross.</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="587" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 17</text></g></svg>