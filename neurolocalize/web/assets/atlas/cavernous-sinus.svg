<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>Inside the cavernous sinus</title><desc>A coronal schematic: several cranial nerves share one small space. Original simplified teaching diagram; not to scale.</desc><defs></defs><rect width="720" height="600" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Inside the cavernous sinus</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">A coronal schematic: several cranial nerves share one small space.</text><rect x="290" y="300" width="140" height="74" rx="10" fill="#e3eaf0" stroke="#b3c5b5" stroke-width="2"/><text x="360" y="342" font-size="12" fill="#527da2" text-anchor="middle">sphenoid sinus</text><ellipse cx="360" cy="248" rx="52" ry="36" fill="#e3cfb1" stroke="#b17b30" stroke-width="2"/><text x="360" y="253" font-size="12" fill="#173e39" text-anchor="middle">pituitary</text><path d="M160 180C160 150 300 150 300 180L300 296C300 330 160 330 160 296Z" fill="#e5ece0" stroke="#b3c5b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="252" cy="230" r="24" fill="#f3dcd8" stroke="#a34040" stroke-width="2.5"/><circle cx="212" cy="262" r="9" fill="#527da2"/><circle cx="172" cy="186" r="10" fill="#278278"/><path d="M160 186L110 186" fill="none" stroke="#d6dfd3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="191" font-size="14" fill="#278278" text-anchor="end" font-weight="700">III</text><circle cx="172" cy="218" r="10" fill="#b17b30"/><path d="M160 218L110 218" fill="none" stroke="#d6dfd3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="223" font-size="14" fill="#b17b30" text-anchor="end" font-weight="700">IV</text><circle cx="172" cy="250" r="10" fill="#173e39"/><path d="M160 250L110 250" fill="none" stroke="#d6dfd3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="255" font-size="14" fill="#173e39" text-anchor="end" font-weight="700">V1</text><circle cx="172" cy="282" r="10" fill="#173e39"/><path d="M160 282L110 282" fill="none" stroke="#d6dfd3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="287" font-size="14" fill="#173e39" text-anchor="end" font-weight="700">V2</text><text x="252" y="235" font-size="11" fill="#a34040" text-anchor="middle" font-weight="700">ICA</text><path d="M212 268L110 330" fill="none" stroke="#d6dfd3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="335" font-size="14" fill="#527da2" text-anchor="end" font-weight="700">VI</text><path d="M420 180C420 150 560 150 560 180L560 296C560 330 420 330 420 296Z" fill="#e5ece0" stroke="#b3c5b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="468" cy="230" r="24" fill="#f3dcd8" stroke="#a34040" stroke-width="2.5"/><circle cx="508" cy="262" r="9" fill="#527da2"/><circle cx="548" cy="186" r="10" fill="#278278"/><circle cx="548" cy="218" r="10" fill="#b17b30"/><circle cx="548" cy="250" r="10" fill="#173e39"/><circle cx="548" cy="282" r="10" fill="#173e39"/><text x="40" y="404" font-size="13" fill="#64736c" text-anchor="start">lateral wall: III, IV, V1, V2 · free in the sinus: VI beside the carotid (ICA)</text><rect x="30" y="420" width="322" height="130" rx="12" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="44" y="446" font-size="17" fill="#278278" text-anchor="start">A combination localizes</text><text x="44" y="471" font-size="14" fill="#64736c" text-anchor="start">Several of III, IV, V1, V2 and</text><text x="44" y="490" font-size="14" fill="#64736c" text-anchor="start">VI on one side, sometimes with</text><text x="44" y="509" font-size="14" fill="#64736c" text-anchor="start">Horner, suggests the sinus or</text><text x="44" y="528" font-size="14" fill="#64736c" text-anchor="start">nearby orbital apex.</text><rect x="368" y="420" width="322" height="130" rx="12" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="382" y="446" font-size="17" fill="#527da2" text-anchor="start">VI can be first</text><text x="382" y="471" font-size="14" fill="#64736c" text-anchor="start">The abducens nerve lies beside</text><text x="382" y="490" font-size="14" fill="#64736c" text-anchor="start">the carotid, so an isolated VI</text><text x="382" y="509" font-size="14" fill="#64736c" text-anchor="start">palsy can be an early sign.</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>