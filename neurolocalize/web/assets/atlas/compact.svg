<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Many functions, a small space</title><desc>Conceptual connections through the internal capsule.. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker></defs><rect width="720" height="560" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Many functions, a small space</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Conceptual connections through the internal capsule.</text><rect x="28" y="108" width="194" height="69" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="44" y="138" font-size="20" fill="#278278" text-anchor="start">Motor cortex</text><rect x="263" y="108" width="194" height="69" rx="13" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="279" y="138" font-size="20" fill="#527da2" text-anchor="start">Sensory cortex</text><rect x="498" y="108" width="194" height="69" rx="13" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="514" y="138" font-size="20" fill="#b17b30" text-anchor="start">Frontal networks</text><path d="M125 177L320 263" fill="none" stroke="#278278" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 177V263" fill="none" stroke="#527da2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M595 177L400 263" fill="none" stroke="#b17b30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="231" y="266" width="258" height="85" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="247" y="296" font-size="20" fill="#278278" text-anchor="start">Internal capsule</text><text x="247" y="322" font-size="16" fill="#64736c" text-anchor="start">Densely packed fibers</text><path d="M320 351L141 421" fill="none" stroke="#278278" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M365 351L550 421" fill="none" stroke="#527da2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="29" y="424" width="237" height="70" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="45" y="454" font-size="20" fill="#278278" text-anchor="start">Brainstem / cord</text><rect x="445" y="424" width="247" height="70" rx="13" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="461" y="454" font-size="20" fill="#527da2" text-anchor="start">Thalamic relays</text><text x="38" y="222" font-size="17" fill="#64736c" text-anchor="start">Convergence</text><text x="500" y="298" font-size="17" fill="#64736c" text-anchor="start">Small lesions can</text><text x="500" y="323" font-size="17" fill="#64736c" text-anchor="start">affect several</text><text x="500" y="348" font-size="17" fill="#64736c" text-anchor="start">functions.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>