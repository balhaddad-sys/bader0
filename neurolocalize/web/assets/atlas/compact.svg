<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>Compact pathways in the internal capsule</title><desc>Axial section of one hemisphere; anterior is at the top. Original simplified teaching diagram; not to scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><radialGradient id="reef2eacfd9ca" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#eef2ea"/><stop offset="1" stop-color="#cfd9ca"/></radialGradient><radialGradient id="rece4d2d1c19f" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ece4d2"/><stop offset="1" stop-color="#d1c19f"/></radialGradient><radialGradient id="rece4d2cbbb98" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ece4d2"/><stop offset="1" stop-color="#cbbb98"/></radialGradient><radialGradient id="rece4d2cfbf9c" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ece4d2"/><stop offset="1" stop-color="#cfbf9c"/></radialGradient></defs><rect width="720" height="620" rx="14" fill="#fcfcf9"/><rect x=".5" y=".5" width="719" height="619" rx="13.5" fill="none" stroke="#dde3d8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="25" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.3">Compact pathways in the internal capsule</text><text x="28" y="66" font-size="14" fill="#64736c" text-anchor="start">Axial section of one hemisphere; anterior is at the top.</text><path d="M452 92C360 92 250 124 228 220C214 290 230 380 288 430C330 468 400 482 452 482Z" fill="url(#reef2eacfd9ca)" stroke="#173e39" stroke-width="2"/><path d="M452 112C370 112 270 140 252 224C240 290 254 372 304 414C342 446 404 460 452 460Z" fill="#fbfcf8"/><path d="M452 86L452 488" fill="none" stroke="#b3c5b5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="460" y="104" font-size="11" fill="#64736c" text-anchor="start">midline</text><path d="M438 158C438 140 416 132 404 146C392 160 392 196 402 214C410 226 428 222 434 210Z" fill="#dde7ea" stroke="#b3c5b5"/><path d="M402 150C380 152 370 176 372 200C374 222 388 232 400 226C396 206 394 172 402 150Z" fill="url(#rece4d2d1c19f)" stroke="#b3c5b5"/><path d="M318 176C298 210 296 290 316 330L372 262C376 240 362 200 318 176Z" fill="url(#rece4d2cbbb98)" stroke="#b3c5b5"/><path d="M352 238L372 262L330 316" fill="none" stroke="#b3c5b5" stroke-dasharray="3 3"/><path d="M444 262C420 256 398 270 394 300C390 334 406 362 430 366C446 368 452 352 452 340L452 268Z" fill="url(#rece4d2cfbf9c)" stroke="#b3c5b5"/><text x="424" y="340" font-size="11" fill="#173e39" text-anchor="middle">thalamus</text><text x="388" y="134" font-size="11" fill="#173e39" text-anchor="middle">caudate</text><text x="326" y="262" font-size="11" fill="#173e39" text-anchor="middle">lentiform</text><path d="M396 168L370 238" fill="none" stroke="#cca978" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M370 240L376 254" fill="none" stroke="#b17b30" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M378 258L392 300" fill="none" stroke="#278278" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M392 302L402 332" fill="none" stroke="#527da2" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 338C360 352 372 372 380 392" fill="none" stroke="#bf7979" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="384" cy="200" r="2.6" fill="#173e39"/><path d="M384 200L520 160" stroke="#173e39" stroke-width=".9" fill="none"/><text x="525" y="164" font-size="13" fill="#173e39" text-anchor="start" font-weight="700" letter-spacing=".9">Anterior limb</text><text x="525" y="178" font-size="12" fill="#64736c" text-anchor="start">frontal–pontine and thalamic links</text><circle cx="373" cy="247" r="2.6" fill="#173e39"/><path d="M373 247L520 226" stroke="#173e39" stroke-width=".9" fill="none"/><text x="525" y="230" font-size="13" fill="#b17b30" text-anchor="start" font-weight="700" letter-spacing=".9">Genu</text><text x="525" y="244" font-size="12" fill="#64736c" text-anchor="start">corticobulbar: face and tongue</text><circle cx="385" cy="280" r="2.6" fill="#173e39"/><path d="M385 280L520 290" stroke="#173e39" stroke-width=".9" fill="none"/><text x="525" y="294" font-size="13" fill="#278278" text-anchor="start" font-weight="700" letter-spacing=".9">Posterior limb</text><text x="525" y="308" font-size="12" fill="#64736c" text-anchor="start">corticospinal: arm, then leg</text><circle cx="397" cy="318" r="2.6" fill="#173e39"/><path d="M397 318L520 350" stroke="#173e39" stroke-width=".9" fill="none"/><text x="525" y="354" font-size="13" fill="#527da2" text-anchor="start" font-weight="700" letter-spacing=".9">Thalamocortical sensory</text><text x="525" y="368" font-size="12" fill="#64736c" text-anchor="start">opposite face and body</text><circle cx="366" cy="376" r="2.6" fill="#173e39"/><path d="M366 376L520 414" stroke="#173e39" stroke-width=".9" fill="none"/><text x="525" y="418" font-size="13" fill="#a34040" text-anchor="start" font-weight="700" letter-spacing=".9">Retrolenticular</text><text x="525" y="432" font-size="12" fill="#64736c" text-anchor="start">optic radiation</text><rect x="30" y="500" width="660" height="84" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M38 500.6L682 500.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="524" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">WHY SMALL LESIONS MATTER HERE</text><text x="44" y="550" font-size="14" fill="#3b4c46" text-anchor="start">Fibres for face, arm and leg converge, so a small deep lesion can weaken all three</text><text x="44" y="569" font-size="14" fill="#3b4c46" text-anchor="start">equally without cortical signs. Positions are approximate.</text><path d="M28 584L692 584" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="607" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="607" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 04</text></g></svg>