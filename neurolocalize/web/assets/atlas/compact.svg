<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Many functions, a small space</title><desc>Conceptual connections through the internal capsule.. Original simplified teaching diagram; not to scale.</desc><defs><radialGradient id="tissue" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f7f9f4"/><stop offset="1" stop-color="#d9e4d4"/></radialGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><linearGradient id="g173e39" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6865"/><stop offset="1" stop-color="#173e39"/></linearGradient><linearGradient id="g278278" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#579e96"/><stop offset="1" stop-color="#257a70"/></linearGradient><linearGradient id="g527da2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#789ab6"/><stop offset="1" stop-color="#4b7595"/></linearGradient><linearGradient id="ga34040" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b76a6a"/><stop offset="1" stop-color="#92403f"/></linearGradient><linearGradient id="gb17b30" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2985e"/><stop offset="1" stop-color="#9f7431"/></linearGradient><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto"><path d="M2 2.5L13 8L2 13.5L5 8Z" fill="#278278"/></marker></defs><rect width="720" height="560" rx="18" fill="url(#bg)"/><rect width="720" height="560" rx="18" fill="url(#dots)" opacity=".55"/><rect x=".5" y=".5" width="719" height="559" rx="17.5" fill="none" stroke="#dfe5da"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="26" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.4">Many functions, a small space</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Conceptual connections through the internal capsule.</text><rect x="28" y="108" width="194" height="69" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="44" y="138" font-size="20" fill="#278278" text-anchor="start">Motor cortex</text><rect x="263" y="108" width="194" height="69" rx="13" fill="url(#card)" stroke="#527da2" stroke-width="2" filter="url(#shadow)"/><text x="279" y="138" font-size="20" fill="#527da2" text-anchor="start">Sensory cortex</text><rect x="498" y="108" width="194" height="69" rx="13" fill="url(#card)" stroke="#b17b30" stroke-width="2" filter="url(#shadow)"/><text x="514" y="138" font-size="20" fill="#b17b30" text-anchor="start">Frontal networks</text><path d="M125 177L320 263" fill="none" stroke="#278278" stroke-width="12" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 177L320 263" fill="none" stroke="#278278" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 177V263" fill="none" stroke="#527da2" stroke-width="12" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 177V263" fill="none" stroke="#527da2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M595 177L400 263" fill="none" stroke="#b17b30" stroke-width="12" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M595 177L400 263" fill="none" stroke="#b17b30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="231" y="266" width="258" height="85" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="247" y="296" font-size="20" fill="#278278" text-anchor="start">Internal capsule</text><text x="247" y="322" font-size="16" fill="#64736c" text-anchor="start">Densely packed fibers</text><path d="M320 351L141 421" fill="none" stroke="#278278" stroke-width="12" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 351L141 421" fill="none" stroke="#278278" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M365 351L550 421" fill="none" stroke="#527da2" stroke-width="12" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M365 351L550 421" fill="none" stroke="#527da2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="29" y="424" width="237" height="70" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="45" y="454" font-size="20" fill="#278278" text-anchor="start">Brainstem / cord</text><rect x="445" y="424" width="247" height="70" rx="13" fill="url(#card)" stroke="#527da2" stroke-width="2" filter="url(#shadow)"/><text x="461" y="454" font-size="20" fill="#527da2" text-anchor="start">Thalamic relays</text><text x="38" y="222" font-size="17" fill="#64736c" text-anchor="start">Convergence</text><text x="500" y="298" font-size="17" fill="#64736c" text-anchor="start">Small lesions can</text><text x="500" y="323" font-size="17" fill="#64736c" text-anchor="start">affect several</text><text x="500" y="348" font-size="17" fill="#64736c" text-anchor="start">functions.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE  ·  ORIGINAL SCHEMATIC  ·  NOT TO SCALE</text><text x="692" y="547" font-size="11" f