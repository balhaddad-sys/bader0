<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>Conus medullaris or cauda equina?</title><desc>The cord ends near L1–L2; below it only roots descend. Original simplified teaching diagram; not to scale.</desc><defs></defs><rect width="720" height="620" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Conus medullaris or cauda equina?</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">The cord ends near L1–L2; below it only roots descend.</text><rect x="40" y="96" width="56" height="42" rx="8" fill="#ffffff" stroke="#b3c5b5" stroke-width="2"/><text x="68" y="122" font-size="12" fill="#64736c" text-anchor="middle">T11</text><rect x="40" y="148" width="56" height="42" rx="8" fill="#ffffff" stroke="#b3c5b5" stroke-width="2"/><text x="68" y="174" font-size="12" fill="#64736c" text-anchor="middle">T12</text><rect x="40" y="200" width="56" height="42" rx="8" fill="#ffffff" stroke="#b3c5b5" stroke-width="2"/><text x="68" y="226" font-size="12" fill="#64736c" text-anchor="middle">L1</text><rect x="40" y="252" width="56" height="42" rx="8" fill="#ffffff" stroke="#b3c5b5" stroke-width="2"/><text x="68" y="278" font-size="12" fill="#64736c" text-anchor="middle">L2</text><rect x="40" y="304" width="56" height="42" rx="8" fill="#ffffff" stroke="#b3c5b5" stroke-width="2"/><text x="68" y="330" font-size="12" fill="#64736c" text-anchor="middle">L3</text><rect x="40" y="356" width="56" height="42" rx="8" fill="#ffffff" stroke="#b3c5b5" stroke-width="2"/><text x="68" y="382" font-size="12" fill="#64736c" text-anchor="middle">L4</text><rect x="40" y="408" width="56" height="42" rx="8" fill="#ffffff" stroke="#b3c5b5" stroke-width="2"/><text x="68" y="434" font-size="12" fill="#64736c" text-anchor="middle">L5</text><rect x="40" y="460" width="56" height="42" rx="8" fill="#ffffff" stroke="#b3c5b5" stroke-width="2"/><text x="68" y="486" font-size="12" fill="#64736c" text-anchor="middle">S</text><path d="M128 90L128 210C128 228 136 236 140 246C144 236 152 228 152 210L152 90Z" fill="#dcebe6" stroke="#173e39" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M137.0 244C130 300 124.0 380 120 500" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M138.8 244C136 300 133.6 380 132 500" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M140.6 244C142 300 143.2 380 144 500" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M142.4 244C148 300 152.8 380 156 500" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M144.2 244C154 300 162.4 380 168 500" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="162" y="240" font-size="12" fill="#278278" text-anchor="start">conus</text><text x="162" y="360" font-size="12" fill="#b17b30" text-anchor="start">cauda</text><text x="162" y="376" font-size="12" fill="#b17b30" text-anchor="start">equina</text><text x="386" y="100" font-size="12" fill="#278278" text-anchor="start" font-weight="700">CONUS</text><text x="546" y="100" font-size="12" fill="#b17b30" text-anchor="start" font-weight="700">CAUDA EQUINA</text><rect x="226" y="112" width="464" height="56" rx="8" fill="#ffffff"/><text x="236" y="144" font-size="14" fill="#173e39" text-anchor="start" font-weight="700">Onset</text><text x="386" y="135" font-size="14" fill="#278278" text-anchor="start">Often sudden,</text><text x="386" y="154" font-size="14" fill="#278278" text-anchor="start">bilateral</text><text x="546" y="135" font-size="14" fill="#b17b30" text-anchor="start">Often gradual,</text><text x="546" y="154" font-size="14" fill="#b17b30" text-anchor="start">asymmetric</text><rect x="226" y="174" width="464" height="56" rx="8" fill="#e5ece0"/><text x="236" y="206" font-size="14" fill="#173e39" text-anchor="start" font-weight="700">Pain</text><text x="386" y="207" font-size="14" fill="#278278" text-anchor="start">Less prominent</text><text x="546" y="197" font-size="14" fill="#b17b30" text-anchor="start">Radicular pain</text><text x="546" y="216" font-size="14" fill="#b17b30" text-anchor="start">prominent</text><rect x="226" y="236" width="464" height="56" rx="8" fill="#ffffff"/><text x="236" y="268" font-size="14" fill="#173e39" text-anchor="start" font-weight="700">Saddle numbness</text><text x="386" y="269" font-size="14" fill="#278278" text-anchor="start">Early, symmetric</text><text x="546" y="269" font-size="14" fill="#b17b30" text-anchor="start">Asymmetric</text><rect x="226" y="298" width="464" height="56" rx="8" fill="#e5ece0"/><text x="236" y="330" font-size="14" fill="#173e39" text-anchor="start" font-weight="700">Bladder, bowel</text><text x="386" y="331" font-size="14" fill="#278278" text-anchor="start">Early</text><text x="546" y="331" font-size="14" fill="#b17b30" text-anchor="start">Often later</text><rect x="226" y="360" width="464" height="56" rx="8" fill="#ffffff"/><text x="236" y="392" font-size="14" fill="#173e39" text-anchor="start" font-weight="700">Reflexes</text><text x="386" y="383" font-size="14" fill="#278278" text-anchor="start">Ankle lost; knee</text><text x="386" y="402" font-size="14" fill="#278278" text-anchor="start">often kept</text><text x="546" y="383" font-size="14" fill="#b17b30" text-anchor="start">Knee and ankle</text><text x="546" y="402" font-size="14" fill="#b17b30" text-anchor="start">may be reduced</text><rect x="226" y="422" width="464" height="56" rx="8" fill="#e5ece0"/><text x="236" y="454" font-size="14" fill="#173e39" text-anchor="start" font-weight="700">Motor signs</text><text x="386" y="445" font-size="14" fill="#278278" text-anchor="start">May mix UMN</text><text x="386" y="464" font-size="14" fill="#278278" text-anchor="start">and LMN</text><text x="546" y="455" font-size="14" fill="#b17b30" text-anchor="start">LMN only</text><text x="40" y="556" font-size="13" fill="#b17b30" text-anchor="start">New saddle numbness or sphincter change needs urgent assessment;</text><text x="40" y="574" font-size="13" fill="#b17b30" text-anchor="start">real lesions often overlap both patterns.</text><path d="M28 584L692 584" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="607" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>