<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Ataxia has more than one route</title><desc>Use limb, stance, eye and sensory findings together.. Original simplified teaching diagram; not to scale.</desc><defs><radialGradient id="tissue" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f7f9f4"/><stop offset="1" stop-color="#d9e4d4"/></radialGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><linearGradient id="g173e39" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6865"/><stop offset="1" stop-color="#173e39"/></linearGradient><linearGradient id="g278278" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#579e96"/><stop offset="1" stop-color="#257a70"/></linearGradient><linearGradient id="g527da2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#789ab6"/><stop offset="1" stop-color="#4b7595"/></linearGradient><linearGradient id="ga34040" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b76a6a"/><stop offset="1" stop-color="#92403f"/></linearGradient><linearGradient id="gb17b30" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2985e"/><stop offset="1" stop-color="#9f7431"/></linearGradient><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto"><path d="M2 2.5L13 8L2 13.5L5 8Z" fill="#278278"/></marker></defs><rect width="720" height="560" rx="18" fill="url(#bg)"/><rect width="720" height="560" rx="18" fill="url(#dots)" opacity=".55"/><rect x=".5" y=".5" width="719" height="559" rx="17.5" fill="none" stroke="#dfe5da"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="26" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.4">Ataxia has more than one route</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Use limb, stance, eye and sensory findings together.</text><path d="M357 185C299 115 126 145 114 265C107 364 272 388 333 312C342 334 367 334 384 311C446 388 613 362 607 265C598 145 421 114 357 185Z" fill="#dfebda" stroke="#278278" stroke-width="3"/><ellipse cx="359" cy="254" rx="34" ry="91" fill="#e3c791"/><path d="M137 237C198 204 271 206 316 234" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M136 268C202 237 274 248 315 271" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 300C212 280 268 285 302 303" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 234C445 206 518 204 583 237" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 271C447 248 518 237 583 268" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 303C449 285 511 280 574 300" fill="none" stroke="#278278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="169" y="113" font-size="20" fill="#278278" text-anchor="start">Hemisphere</text><path d="M246 122L222 178" fill="none" stroke="#278278" stroke-width="2" /><text x="456" y="113" font-size="20" fill="#b17b30" text-anchor="start">Midline / vermis</text><path d="M472 122L365 177" fill="none" stroke="#b17b30" stroke-width="2" /><text x="35" y="412" font-size="18" fill="#278278" text-anchor="start">Limb dysmetria often points</text><text x="35" y="437" font-size="18" fill="#278278" text-anchor="start">to the same-side cerebellum</text><text x="35" y="462" font-size="18" fill="#278278" text-anchor="start">or its connected pathways.</text><text x="384" y="412" font-size="18" fill="#b17b30" text-anchor="start">Midline dysfunction may</text><text x="384" y="437" font-size="18" fill="#b17b30" text-anchor="start">affect stance and gait more</text><text x="384" y="462" font-size="18" fill="#b17b30" text-anchor="start">than isolated limb testing.</text><text x="35" y="502" font-size="17" fill="#64736c" text-anchor="start">Impaired position sense can cause sensory ataxia: test it directly.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE  ·  ORIGINAL SCHEMATIC  ·  NOT TO SCALE</text><text x="692" y="547" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 10</text></g></svg>