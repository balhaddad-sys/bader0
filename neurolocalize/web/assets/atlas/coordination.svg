0 276C380 280 470 294 520 332"/><path d="M310 290C380 296 470 310 520 350"/><path d="M310 304C380 312 470 326 520 368"/><path d="M310 318C380 328 470 342 520 386"/><path d="M310 332C380 344 470 358 520 404"/><path d="M310 346C380 360 470 374 520 422"/><path d="M310 360C380 376 470 390 520 440"/></g><path d="M278 156C270 200 270 340 286 378L314 378C330 340 330 200 322 156Z" fill="url(#rf8efdde6cfa6)" stroke="#173e39" stroke-width="1.8"/><path d="M276 170Q300 176 324 170" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 184Q300 190 324 184" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 198Q300 204 324 198" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 212Q300 218 324 212" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 226Q300 232 324 226" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 240Q300 246 324 240" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 254Q300 260 324 254" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 268Q300 274 324 268" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 282Q300 288 324 282" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 296Q300 302 324 296" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 310Q300 316 324 310" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 324Q300 330 324 324" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 338Q300 344 324 338" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 352Q300 358 324 352" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 366Q300 372 324 366" fill="none" stroke="#b17b30" stroke-opacity=".5"/><path d="M276 380Q300 386 324 380" fill="none" stroke="#b17b30" stroke-opacity=".5"/><circle cx="300" cy="270" r="2.6" fill="#173e39"/><path d="M300 270L540 150" stroke="#173e39" stroke-width=".9" fill="none"/><text x="545" y="154" font-size="13" fill="#b17b30" text-anchor="start" font-weight="700" letter-spacing=".9">Vermis (midline)</text><text x="545" y="168" font-size="12" fill="#3b4c46" text-anchor="start">stance and gait ataxia,</text><text x="545" y="184" font-size="12" fill="#3b4c46" text-anchor="start">truncal sway</text><circle cx="420" cy="280" r="2.6" fill="#173e39"/><path d="M420 280L540 280" stroke="#173e39" stroke-width=".9" fill="none"/><text x="545" y="284" font-size="13" fill="#278278" text-anchor="start" font-weight="700" letter-spacing=".9">Hemisphere</text><text x="545" y="298" font-size="12" fill="#3b4c46" text-anchor="start">same-side limb ataxia:</text><text x="545" y="314" font-size="12" fill="#3b4c46" text-anchor="start">dysmetria, intention tremor,</text><text x="545" y="330" font-size="12" fill="#3b4c46" text-anchor="start">dysdiadochokinesia</text><circle cx="180" cy="280" r="2.6" fill="#173e39"/><path d="M180 280L120 380" stroke="#173e39" stroke-width=".9" fill="none"/><text x="115" y="384" font-size="13" fill="#278278" text-anchor="end">Left hemisphere</text><text x="115" y="398" font-size="12" fill="#64736c" text-anchor="end">left limbs</text><rect x="30" y="474" width="660" height="88" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M38 474.6L682 474.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="498" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">BEFORE YOU CALL IT CEREBELLAR</text><text x="44" y="524" font-size="14" fill="#3b4c46" text-anchor="start">Check position sense and whether ataxia worsens with eyes closed (sensory ataxia), and</text><text x="44" y="543" font-size="14" fill="#3b4c46" text-anchor="start">examine eye movements and vestibular signs. Connected pathways can mimic these signs.</text><path d="M28 584L692 584" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="607" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="607" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 10</text></g></svg>