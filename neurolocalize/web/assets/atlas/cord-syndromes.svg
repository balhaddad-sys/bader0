" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="245" cy="431.24" r="2.5900000000000003" fill="#173e39"/><text x="245" y="354" font-size="11" fill="#64736c" text-anchor="middle">dorsal</text><text x="245" y="522" font-size="18" fill="#173e39" text-anchor="middle">Posterior</text><text x="245" y="546" font-size="13" fill="#64736c" text-anchor="middle">Vibration/position loss and</text><text x="245" y="564" font-size="13" fill="#64736c" text-anchor="middle">sensory ataxia; strength kept</text><path d="M438.0 380.4C408.4 364.9 393.6 371.1 380.3 374.2" fill="none" stroke="#c8a36e" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M445.4 480.8C415.8 495.1 397.3 492.0 382.5 487.0" fill="none" stroke="#68a8a0" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="399.52" cy="368.62" rx="9.620000000000001" ry="6.2" fill="#e3cfb1" stroke="#b17b30" stroke-width="1"/><path d="M512.0 380.4C541.6 364.9 556.4 371.1 569.7 374.2" fill="none" stroke="#c8a36e" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M504.6 480.8C534.2 495.1 552.7 492.0 567.5 487.0" fill="none" stroke="#68a8a0" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="550.48" cy="368.62" rx="9.620000000000001" ry="6.2" fill="#e3cfb1" stroke="#b17b30" stroke-width="1"/><ellipse cx="475" cy="430" rx="74" ry="62" fill="url(#rf7f9f4d9e4d4)"/><path d="M288 203C278 224 297 242 312 249C289 271 272 305 287 326L322 290L337 290L370 326C382 306 365 273 344 249C359 237 375 222 366 203L337 235L320 235Z" fill="url(#rc6d4c894aa9c)" transform="translate(475 430) scale(0.4933 0.4593) translate(-327 -264)"/><g fill="#a34040" opacity=".4" clip-path="url(#clip5)"><rect x="401" y="368" width="74" height="124"/></g><ellipse cx="475" cy="430" rx="74" ry="62" fill="none" stroke="#173e39" stroke-width="2.4"/><path d="M469.8 493.0L475 473.4L480.2 493.0" fill="#f4f5ee" stroke="#173e39" stroke-width="1.6" stroke-linejoin="round"/><path d="M475 368L475 391.6" fill="none" stroke="#173e39" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="475" cy="431.24" r="2.5900000000000003" fill="#173e39"/><text x="475" y="354" font-size="11" fill="#64736c" text-anchor="middle">dorsal</text><text x="475" y="522" font-size="18" fill="#173e39" text-anchor="middle">Hemicord</text><text x="475" y="546" font-size="13" fill="#64736c" text-anchor="middle">Same-side weakness + vibration</text><text x="475" y="564" font-size="13" fill="#64736c" text-anchor="middle">loss; opposite pain loss</text><text x="389" y="435" font-size="11" fill="#a34040" text-anchor="end" font-weight="700" letter-spacing=".9">lesion</text><text x="40" y="590" font-size="13" fill="#b17b30" text-anchor="start">Patterns are idealized; real lesions are often partial.</text><path d="M28 604L692 604" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="627" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="627" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 21</text></g></svg>