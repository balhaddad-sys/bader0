<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img"><title>Five cord syndromes in cross-section</title><desc>Dorsal is at the top. Shading marks the damaged region. Original simplified teaching diagram; not to scale.</desc><defs><clipPath id="clip1"><ellipse cx="130" cy="190" rx="74" ry="62"/></clipPath><clipPath id="clip2"><ellipse cx="360" cy="190" rx="74" ry="62"/></clipPath><clipPath id="clip3"><ellipse cx="590" cy="190" rx="74" ry="62"/></clipPath><clipPath id="clip4"><ellipse cx="245" cy="430" rx="74" ry="62"/></clipPath><clipPath id="clip5"><ellipse cx="475" cy="430" rx="74" ry="62"/></clipPath></defs><rect width="720" height="640" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Five cord syndromes in cross-section</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Dorsal is at the top. Shading marks the damaged region.</text><ellipse cx="130" cy="190" rx="74" ry="62" fill="#e5ece0"/><path d="M288 203C278 224 297 242 312 249C289 271 272 305 287 326L322 290L337 290L370 326C382 306 365 273 344 249C359 237 375 222 366 203L337 235L320 235Z" fill="#b3c5b5" transform="translate(130 190) scale(0.4933) translate(-327 -264)"/><g fill="#a34040" opacity=".42" clip-path="url(#clip1)"><rect x="56" y="128" width="148" height="124"/></g><ellipse cx="130" cy="190" rx="74" ry="62" fill="none" stroke="#173e39" stroke-width="2.5"/><text x="130" y="118" font-size="11" fill="#64736c" text-anchor="middle">dorsal</text><text x="130" y="282" font-size="18" fill="#173e39" text-anchor="middle">Complete</text><text x="130" y="306" font-size="13" fill="#64736c" text-anchor="middle">All modalities lost below</text><text x="130" y="324" font-size="13" fill="#64736c" text-anchor="middle">the level; both sides weak</text><ellipse cx="360" cy="190" rx="74" ry="62" fill="#e5ece0"/><path d="M288 203C278 224 297 242 312 249C289 271 272 305 287 326L322 290L337 290L370 326C382 306 365 273 344 249C359 237 375 222 366 203L337 235L320 235Z" fill="#b3c5b5" transform="translate(360 190) scale(0.4933) translate(-327 -264)"/><g fill="#a34040" opacity=".42" clip-path="url(#clip2)"><ellipse cx="360" cy="192" rx="37" ry="31"/></g><ellipse cx="360" cy="190" rx="74" ry="62" fill="none" stroke="#173e39" stroke-width="2.5"/><text x="360" y="118" font-size="11" fill="#64736c" text-anchor="middle">dorsal</text><text x="360" y="282" font-size="18" fill="#173e39" text-anchor="middle">Central</text><text x="360" y="306" font-size="13" fill="#64736c" text-anchor="middle">Arms often weaker than legs;</text><text x="360" y="324" font-size="13" fill="#64736c" text-anchor="middle">cape-like pain loss possible</text><ellipse cx="590" cy="190" rx="74" ry="62" fill="#e5ece0"/><path d="M288 203C278 224 297 242 312 249C289 271 272 305 287 326L322 290L337 290L370 326C382 306 365 273 344 249C359 237 375 222 366 203L337 235L320 235Z" fill="#b3c5b5" transform="translate(590 190) scale(0.4933) translate(-327 -264)"/><g fill="#a34040" opacity=".42" clip-path="url(#clip3)"><rect x="516" y="169" width="148" height="85"/></g><ellipse cx="590" cy="190" rx="74" ry="62" fill="none" stroke="#173e39" stroke-width="2.5"/><text x="590" y="118" font-size="11" fill="#64736c" text-anchor="middle">dorsal</text><text x="590" y="282" font-size="18" fill="#173e39" text-anchor="middle">Anterior</text><text x="590" y="306" font-size="13" fill="#64736c" text-anchor="middle">Weakness and pain loss;</text><text x="590" y="324" font-size="13" fill="#64736c" text-anchor="middle">vibration/position spared</text><ellipse cx="245" cy="430" rx="74" ry="62" fill="#e5ece0"/><path d="M288 203C278 224 297 242 312 249C289 271 272 305 287 326L322 290L337 290L370 326C382 306 365 273 344 249C359 237 375 222 366 203L337 235L320 235Z" fill="#b3c5b5" transform="translate(245 430) scale(0.4933) translate(-327 -264)"/><g fill="#a34040" opacity=".42" clip-path="url(#clip4)"><path d="M219 368L271 368L251 426L239 426Z"/></g><ellipse cx="245" cy="430" rx="74" ry="62" fill="none" stroke="#173e39" stroke-width="2.5"/><text x="245" y="358" font-size="11" fill="#64736c" text-anchor="middle">dorsal</text><text x="245" y="522" font-size="18" fill="#173e39" text-anchor="middle">Posterior</text><text x="245" y="546" font-size="13" fill="#64736c" text-anchor="middle">Vibration/position loss and</text><text x="245" y="564" font-size="13" fill="#64736c" text-anchor="middle">sensory ataxia; strength kept</text><ellipse cx="475" cy="430" rx="74" ry="62" fill="#e5ece0"/><path d="M288 203C278 224 297 242 312 249C289 271 272 305 287 326L322 290L337 290L370 326C382 306 365 273 344 249C359 237 375 222 366 203L337 235L320 235Z" fill="#b3c5b5" transform="translate(475 430) scale(0.4933) translate(-327 -264)"/><g fill="#a34040" opacity=".42" clip-path="url(#clip5)"><rect x="401" y="368" width="74" height="124"/></g><ellipse cx="475" cy="430" rx="74" ry="62" fill="none" stroke="#173e39" stroke-width="2.5"/><text x="475" y="358" font-size="11" fill="#64736c" text-anchor="middle">dorsal</text><text x="475" y="522" font-size="18" fill="#173e39" text-anchor="middle">Hemicord</text><text x="475" y="546" font-size="13" fill="#64736c" text-anchor="middle">Same-side weakness + vibration</text><text x="475" y="564" font-size="13" fill="#64736c" text-anchor="middle">loss; opposite pain loss</text><text x="397" y="435" font-size="11" fill="#a34040" text-anchor="end">lesion</text><text x="40" y="590" font-size="13" fill="#b17b30" text-anchor="start">Patterns are idealized; real lesions are often partial.</text><path d="M28 604L692 604" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="627" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>