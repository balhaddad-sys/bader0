30" y="282" font-size="18" fill="#173e39" text-anchor="middle">Complete</text><text x="130" y="306" font-size="13" fill="#64736c" text-anchor="middle">All modalities lost below</text><text x="130" y="324" font-size="13" fill="#64736c" text-anchor="middle">the level; both sides weak</text><path d="M323.0 140.4C293.4 124.9 278.6 131.1 265.3 134.2" fill="none" stroke="#c8a36e" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M330.4 240.8C300.8 255.1 282.3 252.0 267.5 247.0" fill="none" stroke="#68a8a0" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="284.52" cy="128.62" rx="9.620000000000001" ry="6.2" fill="#e3cfb1" stroke="#b17b30" stroke-width="1"/><path d="M397.0 140.4C426.6 124.9 441.4 131.1 454.7 134.2" fill="none" stroke="#c8a36e" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M389.6 240.8C419.2 255.1 437.7 252.0 452.5 247.0" fill="none" stroke="#68a8a0" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="435.48" cy="128.62" rx="9.620000000000001" ry="6.2" fill="#e3cfb1" stroke="#b17b30" stroke-width="1"/><ellipse cx="360" cy="190" rx="74" ry="62" fill="url(#rf7f9f4d9e4d4)"/><path d="M288 203C278 224 297 242 312 249C289 271 272 305 287 326L322 290L337 290L370 326C382 306 365 273 344 249C359 237 375 222 366 203L337 235L320 235Z" fill="url(#rc6d4c894aa9c)" transform="translate(360 190) scale(0.4933 0.4593) translate(-327 -264)"/><g fill="#a34040" opacity=".4" clip-path="url(#clip2)"><ellipse cx="360" cy="192" rx="37" ry="31"/></g><ellipse cx="360" cy="190" rx="74" ry="62" fill="none" stroke="#173e39" stroke-width="2.4"/><path d="M354.8 253.0L360 233.4L365.2 253.0" fill="#f4f5ee" stroke="#173e39" stroke-width="1.6" stroke-linejoin="round"/><path d="M360 128L360 151.6" fill="none" stroke="#173e39" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="191.24" r="2.5900000000000003" fill="#173e39"/><text x="360" y="114" fo