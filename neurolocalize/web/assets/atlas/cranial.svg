<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Use the neighbors of a cranial sign</title><desc>Selected brainstem nuclear levels; a map, not an exit-point chart.. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker></defs><rect width="720" height="560" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Use the neighbors of a cranial sign</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Selected brainstem nuclear levels; a map, not an exit-point chart.</text><rect x="38" y="108" width="212" height="96" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="54" y="138" font-size="20" fill="#278278" text-anchor="start">Midbrain</text><text x="54" y="164" font-size="16" fill="#64736c" text-anchor="start">III · IV</text><rect x="38" y="235" width="212" height="96" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="54" y="265" font-size="20" fill="#278278" text-anchor="start">Pons</text><text x="54" y="291" font-size="16" fill="#64736c" text-anchor="start">V · VI · VII</text><rect x="38" y="362" width="212" height="105" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="54" y="392" font-size="20" fill="#278278" text-anchor="start">Medulla</text><text x="54" y="418" font-size="16" fill="#64736c" text-anchor="start">IX · X · XII</text><path d="M144 204L144 231" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><path d="M144 331L144 357" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><text x="291" y="139" font-size="21" fill="#173e39" text-anchor="start">Eye position, pupils</text><text x="291" y="164" font-size="21" fill="#173e39" text-anchor="start">and eye movements</text><text x="291" y="268" font-size="19" fill="#173e39" text-anchor="start">Facial sensation, facial movement</text><text x="291" y="293" font-size="19" fill="#173e39" text-anchor="start">and horizontal gaze</text><text x="291" y="390" font-size="21" fill="#173e39" text-anchor="start">Swallowing, voice</text><text x="291" y="415" font-size="21" fill="#173e39" text-anchor="start">and tongue movement</text><path d="M250 156L279 156" fill="none" stroke="#278278" stroke-width="2" /><path d="M250 283L279 283" fill="none" stroke="#278278" stroke-width="2" /><path d="M250 414L279 414" fill="none" stroke="#278278" stroke-width="2" /><text x="38" y="501" font-size="16" fill="#64736c" text-anchor="start">VIII spans the pontomedullary region; XI has major cervical cord origin.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>