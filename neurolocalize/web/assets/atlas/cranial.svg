<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Use the neighbors of a cranial sign</title><desc>Selected brainstem nuclear levels; a map, not an exit-point chart.. Original simplified teaching diagram; not to scale.</desc><defs><radialGradient id="tissue" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f7f9f4"/><stop offset="1" stop-color="#d9e4d4"/></radialGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><linearGradient id="g173e39" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6865"/><stop offset="1" stop-color="#173e39"/></linearGradient><linearGradient id="g278278" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#579e96"/><stop offset="1" stop-color="#257a70"/></linearGradient><linearGradient id="g527da2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#789ab6"/><stop offset="1" stop-color="#4b7595"/></linearGradient><linearGradient id="ga34040" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b76a6a"/><stop offset="1" stop-color="#92403f"/></linearGradient><linearGradient id="gb17b30" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2985e"/><stop offset="1" stop-color="#9f7431"/></linearGradient><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto"><path d="M2 2.5L13 8L2 13.5L5 8Z" fill="#278278"/></marker></defs><rect width="720" height="560" rx="18" fill="url(#bg)"/><rect width="720" height="560" rx="18" fill="url(#dots)" opacity=".55"/><rect x=".5" y=".5" width="719" height="559" rx="17.5" fill="none" stroke="#dfe5da"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="26" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.4">Use the neighbors of a cranial sign</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Selected brainstem nuclear levels; a map, not an exit-point chart.</text><rect x="38" y="108" width="212" height="96" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="54" y="138" font-size="20" fill="#278278" text-anchor="start">Midbrain</text><text x="54" y="164" font-size="16" fill="#64736c" text-anchor="start">III · IV</text><rect x="38" y="235" width="212" height="96" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="54" y="265" font-size="20" fill="#278278" text-anchor="start">Pons</text><text x="54" y="291" font-size="16" fill="#64736c" text-anchor="start">V · VI · VII</text><rect x="38" y="362" width="212" height="105" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="54" y="392" font-size="20" fill="#278278" text-anchor="start">Medulla</text><text x="54" y="418" font-size="16" fill="#64736c" text-anchor="start">IX · X · XII</text><path d="M144 204L144 231" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13"/><path d="M144 204L144 231" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><path d="M144 331L144 357" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13"/><path d="M144 331L144 357" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><text x="291" y="139" font-size="21" fill="#173e39" text-anchor="start">Eye position, pupils</text><text x="291" y="164" font-size="21" fill="#173e39" text-anchor="start">and eye movements</text><text x="291" y="268" font-size="19" fill="#173e39" text-anchor="start">Facial sensation, facial movement</text><text x="291" y="293" font-size="19" fill="#173e39" text-anchor="start">and horizontal gaze</text><text x="291" y="390" font-size="21" fill="#173e39" text-anchor="start">Swallowing, voice</text><text x="291" y="415" font-size="21" fill="#173e39" text-anchor="start">and tongue movement</text><path d="M250 156L279 156" fill="none" stroke="#278278" stroke-width="2" /><path d="M250 283L279 283" fill="none" stroke="#278278" stroke-width="2" /><path d="M250 414L279 414" fill="none" stroke="#278278" stroke-width="2" /><text x="38" y="501" font-size="16" fill="#64736c" text-anchor="start">VIII spans the pontomedullary region; XI has major cervical cord origin.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE  ·  ORIGINAL SCHEMATIC  ·  NOT TO SCALE</text><text x="692" y="547" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 06</text></g></svg>