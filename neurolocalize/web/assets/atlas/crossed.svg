<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img"><title>Crossed face and body findings</title><desc>Open medulla in cross-section, dorsal up; a left lateral lesion is shaded. Original simplified teaching diagram; not to scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><radialGradient id="rf6f8f3d8e2d3" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f6f8f3"/><stop offset="1" stop-color="#d8e2d3"/></radialGradient><clipPath id="clip1"><path d="M212 208C212 158 252 140 292 148L340 198L384 198L432 148C472 140 512 158 512 208C518 278 482 352 422 380C392 394 332 394 302 380C242 352 206 278 212 208Z"/></clipPath></defs><rect width="720" height="650" rx="14" fill="#fcfcf9"/><rect x=".5" y=".5" width="719" height="649" rx="13.5" fill="none" stroke="#dde3d8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="25" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.3">Crossed face and body findings</text><text x="28" y="66" font-size="14" fill="#64736c" text-anchor="start">Open medulla in cross-section, dorsal up; a left lateral lesion is shaded.</text><path d="M212 208C212 158 252 140 292 148L340 198L384 198L432 148C472 140 512 158 512 208C518 278 482 352 422 380C392 394 332 394 302 380C242 352 206 278 212 208Z" fill="url(#rf6f8f3d8e2d3)"/><g clip-path="url(#clip1)" stroke-width="1"><ellipse cx="338" cy="360" rx="20" ry="18" fill="#a9d1c9"/><path d="M312 308C272 298 266 348 302 354C280 338 284 314 312 320Z" fill="#e2d6bd" stroke="#b3c5b5"/><rect x="344" y="238" width="12" height="96" rx="6" fill="#e6cfa6"/><circle cx="348" cy="212" r="9" fill="#cfc4dd"/><ellipse cx="250" cy="222" rx="22" ry="30" fill="#b4c8db"/><ellipse cx="242" cy="298" rx="16" ry="22" fill="#f3dcd8"/><ellipse cx="232" cy="170" rx="20" ry="16" fill="#d9e4cf"/><circle cx="276" cy="268" r="8" fill="#d6c7a8"/><ellipse cx="386" cy="360" rx="20" ry="18" fill="#a9d1c9"/><path d="M412 308C452 298 458 348 422 354C444 338 440 314 412 320Z" fill="#e2d6bd" stroke="#b3c5b5"/><rect x="368" y="238" width="12" height="96" rx="6" fill="#e6cfa6"/><circle cx="376" cy="212" r="9" fill="#cfc4dd"/><ellipse cx="474" cy="222" rx="22" ry="30" fill="#b4c8db"/><ellipse cx="482" cy="298" rx="16" ry="22" fill="#f3dcd8"/><ellipse cx="492" cy="170" rx="20" ry="16" fill="#d9e4cf"/><circle cx="448" cy="268" r="8" fill="#d6c7a8"/></g><path d="M202 138L292 138C286 228 290 288 262 348L192 348Z" fill="#a34040" opacity=".18" clip-path="url(#clip1)"/><path d="M202 138L292 138C286 228 290 288 262 348L192 348Z" fill="none" stroke="#a34040" stroke-width="1.6" stroke-dasharray="5 4" clip-path="url(#clip1)"/><path d="M212 208C212 158 252 140 292 148L340 198L384 198L432 148C472 140 512 158 512 208C518 278 482 352 422 380C392 394 332 394 302 380C242 352 206 278 212 208Z" fill="none" stroke="#173e39" stroke-width="2.2"/><text x="362" y="176" font-size="11" fill="#64736c" text-anchor="middle">fourth ventricle</text><text x="362" y="128" font-size="11" fill="#64736c" text-anchor="middle" font-weight="700" letter-spacing=".9">DORSAL</text><text x="197" y="128" font-size="11" fill="#a34040" text-anchor="start" font-weight="700" letter-spacing=".9">LEFT</text><circle cx="250" cy="222" r="2.6" fill="#173e39"/><path d="M250 222L196 160" stroke="#173e39" stroke-width=".9" fill="none"/><text x="191" y="164" font-size="13" fill="#527da2" text-anchor="end" font-weight="700" letter-spacing=".9">Spinal trigeminal nucleus</text><text x="191" y="178" font-size="12" fill="#64736c" text-anchor="end">same-side face pain,</text><text x="191" y="194" font-size="12" fill="#64736c" text-anchor="end">temperature</text><circle cx="242" cy="298" r="2.6" fill="#173e39"/><path d="M242 298L196 326" stroke="#173e39" stroke-width=".9" fill="none"/><text x="191" y="330" font-size="13" fill="#a34040" text-anchor="end" font-weight="700" letter-spacing=".9">Spinothalamic tract</text><text x="191" y="344" font-size="12" fill="#64736c" text-anchor="end">opposite body pain,</text><text x="191" y="360" font-size="12" fill="#64736c" text-anchor="end">temperature</text><circle cx="232" cy="170" r="2.6" fill="#173e39"/><path d="M232 170L196 108" stroke="#173e39" stroke-width=".9" fill="none"/><text x="191" y="112" font-size="13" fill="#3b4c46" text-anchor="end">Cerebellar peduncle</text><circle cx="276" cy="268" r="2.6" fill="#173e39"/><path d="M276 268L196 264" stroke="#173e39" stroke-width=".9" fill="none"/><text x="191" y="268" font-size="13" fill="#3b4c46" text-anchor="end">Nucleus ambiguus</text><text x="191" y="282" font-size="12" fill="#64736c" text-anchor="end">hoarseness, dysphagia</text><circle cx="270" cy="330" r="2.6" fill="#173e39"/><path d="M270 330L196 392" stroke="#173e39" stroke-width=".9" fill="none"/><text x="191" y="396" font-size="13" fill="#3b4c46" text-anchor="end">Sympathetic fibres</text><circle cx="386" cy="360" r="2.6" fill="#173e39"/><path d="M386 360L540 388" stroke="#173e39" stroke-width=".9" fill="none"/><text x="545" y="392" font-size="13" fill="#278278" text-anchor="start">Pyramid (spared)</text><circle cx="374" cy="278" r="2.6" fill="#173e39"/><path d="M374 278L540 238" stroke="#173e39" stroke-width=".9" fill="none"/><text x="545" y="242" font-size="13" fill="#b17b30" text-anchor="start">Medial lemniscus</text><circle cx="432" cy="330" r="2.6" fill="#173e39"/><path d="M432 330L540 328" stroke="#173e39" stroke-width=".9" fill="none"/><text x="545" y="332" font-size="13" fill="#3b4c46" text-anchor="start">Inferior olive</text><text x="545" y="256" font-size="12" fill="#64736c" text-anchor="start">(spared)</text><rect x="30" y="448" width="250" height="150" rx="8" fill="#ffffff" stroke="#d6a9a9" stroke-width="1"/><path d="M38 448.6L272 448.6" stroke="#a34040" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="472" font-size="12" fill="#a34040" font-weight="700" letter-spacing="1.1">SAME SIDE AS LESION</text><text x="44" y="497" font-size="13" fill="#3b4c46" text-anchor="start">Face pain/temperature loss,</text><text x="44" y="515" font-size="13" fill="#3b4c46" text-anchor="start">Horner syndrome, limb ataxia,</text><text x="44" y="533" font-size="13" fill="#3b4c46" text-anchor="start">hoarseness, dysphagia</text><rect x="296" y="448" width="394" height="150" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M304 448.6L682 448.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="310" y="472" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">WHY THE SIDES DIFFER</text><text x="310" y="497" font-size="13" fill="#3b4c46" text-anchor="start">Facial pain fibres descend in the spinal</text><text x="310" y="515" font-size="13" fill="#3b4c46" text-anchor="start">trigeminal tract before crossing; body pain</text><text x="310" y="533" font-size="13" fill="#3b4c46" text-anchor="start">fibres crossed in the cord. So: same-side face,</text><text x="310" y="551" font-size="13" fill="#3b4c46" text-anchor="start">opposite-side body. Lesions are often partial.</text><path d="M28 614L692 614" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="637" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="637" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 05</text></g></svg>