<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>A crossed face–body pattern</title><desc>Example: LEFT lateral medullary involvement; pathways simplified.. Original simplified teaching diagram; not to scale.</desc><defs><radialGradient id="tissue" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f7f9f4"/><stop offset="1" stop-color="#d9e4d4"/></radialGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><linearGradient id="g173e39" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6865"/><stop offset="1" stop-color="#173e39"/></linearGradient><linearGradient id="g278278" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#579e96"/><stop offset="1" stop-color="#257a70"/></linearGradient><linearGradient id="g527da2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#789ab6"/><stop offset="1" stop-color="#4b7595"/></linearGradient><linearGradient id="ga34040" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b76a6a"/><stop offset="1" stop-color="#92403f"/></linearGradient><linearGradient id="gb17b30" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2985e"/><stop offset="1" stop-color="#9f7431"/></linearGradient><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto"><path d="M2 2.5L13 8L2 13.5L5 8Z" fill="#278278"/></marker></defs><rect width="720" height="560" rx="18" fill="url(#bg)"/><rect width="720" height="560" rx="18" fill="url(#dots)" opacity=".55"/><rect x=".5" y=".5" width="719" height="559" rx="17.5" fill="none" stroke="#dfe5da"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="26" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.4">A crossed face–body pattern</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Example: LEFT lateral medullary involvement; pathways simplified.</text><rect x="32" y="112" width="291" height="87" rx="13" fill="url(#card)" stroke="#b17b30" stroke-width="2" filter="url(#shadow)"/><text x="48" y="142" font-size="20" fill="#b17b30" text-anchor="start">Left face</text><text x="48" y="168" font-size="16" fill="#64736c" text-anchor="start">Pain / temperature reduction</text><rect x="405" y="112" width="281" height="87" rx="13" fill="url(#card)" stroke="#527da2" stroke-width="2" filter="url(#shadow)"/><text x="421" y="142" font-size="20" fill="#527da2" text-anchor="start">Right body</text><text x="421" y="168" font-size="16" fill="#64736c" text-anchor="start">Pain / temperature reduction</text><rect x="258" y="229" width="202" height="191" rx="75" fill="#e5ece0" stroke="#173e39" stroke-width="3"/><text x="309" y="266" font-size="15" fill="#64736c" text-anchor="start">MEDULLA</text><ellipse cx="295" cy="326" rx="46" ry="66" fill="#e6c78c" fill-opacity=".6" stroke="#b17b30" stroke-width="2"/><circle cx="287" cy="300" r="9" fill="url(#gb17b30)" filter="url(#lift)"/><circle cx="310" cy="352" r="9" fill="url(#g527da2)" filter="url(#lift)"/><path d="M155 199V237L280 295" fill="none" stroke="#b17b30" stroke-width="11" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M155 199V237L280 295" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M680 199V449H398L312 358" fill="none" stroke="#527da2" stroke-width="11" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M680 199V449H398L312 358" fill="none" stroke="#527da2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="31" y="341" font-size="17" fill="#b17b30" text-anchor="start">Trigeminal pathway</text><text x="31" y="366" font-size="17" fill="#b17b30" text-anchor="start">before its crossing</text><path d="M205 332L278 306" fill="none" stroke="#b17b30" stroke-width="2" /><text x="487" y="324" font-size="17" fill="#527da2" text-anchor="start">Body pain pathway</text><text x="487" y="349" font-size="17" fill="#527da2" text-anchor="start">already crossed</text><text x="487" y="374" font-size="17" fill="#527da2" text-anchor="start">in the spinal cord</text><path d="M461 344L320 353" fill="none" stroke="#527da2" stroke-width="2" /><text x="32" y="486" font-size="17" fill="#64736c" text-anchor="start">Crossed signs are useful clues; not every brainstem lesion has them.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE  ·  ORIGINAL SCHEMATIC  ·  NOT TO SCALE</text><text x="692" y="547" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 05</text></g></svg>