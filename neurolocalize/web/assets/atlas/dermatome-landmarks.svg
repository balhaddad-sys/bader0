t="700">L1</text><text x="440" y="385" font-size="14" fill="#173e39" text-anchor="start">Groin (inguinal region)</text><rect x="372" y="402" width="318" height="32" rx="8" fill="#ffffff"/><rect x="380" y="407" width="46" height="22" rx="11" fill="#b17b30"/><text x="403" y="423" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">L2</text><text x="440" y="423" font-size="14" fill="#173e39" text-anchor="start">Front of the mid-thigh</text><rect x="372" y="440" width="318" height="32" rx="8" fill="#e5ece0"/><rect x="380" y="445" width="46" height="22" rx="11" fill="#b17b30"/><text x="403" y="461" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">L3</text><text x="440" y="461" font-size="14" fill="#173e39" text-anchor="start">Medial knee</text><rect x="372" y="478" width="318" height="32" rx="8" fill="#ffffff"/><rect x="380" y="483" width="46" height="22" rx="11" fill="#b17b30"/><text x="403" y="499" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">L4</text><text x="440" y="499" font-size="14" fill="#173e39" text-anchor="start">Medial ankle (malleolus)</text><rect x="372" y="516" width="318" height="32" rx="8" fill="#e5ece0"/><rect x="380" y="521" width="46" height="22" rx="11" fill="#b17b30"/><text x="403" y="537" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">L5</text><text x="440" y="537" font-size="14" fill="#173e39" text-anchor="start">Top of the foot</text><rect x="372" y="554" width="318" height="32" rx="8" fill="#ffffff"/><rect x="380" y="559" width="46" height="22" rx="11" fill="#b17b30"/><text x="403" y="575" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">S1</text><text x="440" y="575" font-size="14" fill="#173e39" text-anchor="start">Outer heel</text><text x="372" y="612" font-size="13" fill="#b17b30" text-anchor="start">Neighboring dermatomes overlap a lot.</text><path d="M28 644L692 644" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="667" font