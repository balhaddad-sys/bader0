<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>Six eye muscles, three nerves</title><desc>The right eye as you face the patient: abduction points to your left. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow-527da2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#527da2" stroke-width="1.3"/></marker><marker id="arrow-278278" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker><marker id="arrow-b17b30" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b17b30" stroke-width="1.3"/></marker></defs><rect width="720" height="620" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Six eye muscles, three nerves</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">The right eye as you face the patient: abduction points to your left.</text><circle cx="210" cy="300" r="66" fill="#ffffff" stroke="#173e39" stroke-width="2.5"/><circle cx="210" cy="300" r="24" fill="#173e39"/><path d="M130 300L94 300" fill="none" stroke="#527da2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-527da2)"/><text x="84" y="322" font-size="15" fill="#527da2" text-anchor="end" font-weight="700">LR (VI)</text><path d="M290 300L326 300" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="336" y="322" font-size="15" fill="#278278" text-anchor="start" font-weight="700">MR (III)</text><path d="M130 300L94 300L94 170" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="80" y="174" font-size="15" fill="#278278" text-anchor="end" font-weight="700">SR (III)</text><path d="M130 300L94 300L94 430" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="80" y="436" font-size="15" fill="#278278" text-anchor="end" font-weight="700">IR (III)</text><path d="M290 300L326 300L326 170" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="340" y="174" font-size="15" fill="#278278" text-anchor="start" font-weight="700">IO (III)</text><path d="M290 300L326 300L326 430" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><text x="340" y="436" font-size="15" fill="#b17b30" text-anchor="start" font-weight="700">SO (IV)</text><text x="94" y="460" font-size="12" fill="#64736c" text-anchor="middle">abduction</text><text x="326" y="460" font-size="12" fill="#64736c" text-anchor="middle">adduction</text><text x="210" y="128" font-size="15" fill="#173e39" text-anchor="middle">LR6 · SO4 · the rest III</text><rect x="426" y="96" width="264" height="116" rx="12" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="440" y="122" font-size="17" fill="#278278" text-anchor="start">Third nerve (III)</text><text x="440" y="147" font-size="14" fill="#64736c" text-anchor="start">Eye down and out, ptosis;</text><text x="440" y="166" font-size="14" fill="#64736c" text-anchor="start">pupil may be large</text><rect x="426" y="228" width="264" height="116" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="440" y="254" font-size="17" fill="#b17b30" text-anchor="start">Fourth nerve (IV)</text><text x="440" y="279" font-size="14" fill="#64736c" text-anchor="start">Vertical diplopia worse looking</text><text x="440" y="298" font-size="14" fill="#64736c" text-anchor="start">down and away; head tilts away</text><rect x="426" y="360" width="264" height="116" rx="12" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="440" y="386" font-size="17" fill="#527da2" text-anchor="start">Sixth nerve (VI)</text><text x="440" y="411" font-size="14" fill="#64736c" text-anchor="start">Horizontal diplopia worse</text><text x="440" y="430" font-size="14" fill="#64736c" text-anchor="start">looking toward the weak side</text><rect x="30" y="500" width="660" height="86" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="44" y="526" font-size="18" fill="#b17b30" text-anchor="start">Test each vertical muscle where it works best.</text><text x="44" y="552" font-size="15" fill="#64736c" text-anchor="start">Elevation and depression in abduction test SR and IR;</text><text x="44" y="572" font-size="15" fill="#64736c" text-anchor="start">in adduction they test IO and SO.</text><path d="M28 584L692 584" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="607" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>