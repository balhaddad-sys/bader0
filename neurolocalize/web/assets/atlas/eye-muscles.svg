troke-width="1"/><path d="M228.0 292.6L244.4 285.7" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><circle cx="210" cy="300" r="17.0" fill="#10231f"/><circle cx="197.0" cy="287.0" r="6.5" fill="#ffffff" opacity=".9"/></g><path d="M136 300Q210 242.8 284 300Q210 357.2 136 300Z" fill="none" stroke="#173e39" stroke-width="2" stroke-linejoin="round"/><path d="M150.8 258.2Q210 223.0 269.2 258.2" fill="none" stroke="#64736c" stroke-width="1.4" stroke-opacity=".55" stroke-linecap="round"/><path d="M130 300L94 300" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 300L94 300" fill="none" stroke="#527da2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-527da2)"/><text x="84" y="322" font-size="15" fill="#527da2" text-anchor="end" font-weight="700">LR (VI)</text><path d="M290 300L326 300" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 300L326 300" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="336" y="322" font-size="15" fill="#278278" text-anchor="start" font-weight="700">MR (III)</text><path d="M130 300L94 300L94 170" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 300L94 300L94 170" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="80" y="174" font-size="15" fill="#278278" text-anchor="end" font-weight="700">SR (III)</text><path d="M130 300L94 300L94 430" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 300L94 300L94 430" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="80" y="436" font-size="15" fill="#278278" text-anchor="end" font-weight="700">IR (III)</text><path d="M290 300L326 300L326 170" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 300L326 300L326 170" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="340" y="174" font-size="15" fill="#278278" text-anchor="start" font-weight="700">IO (III)</text><path d="M290 300L326 300L326 430" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 300L326 300L326 430" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><text x="340" y="436" font-size="15" fill="#b17b30" text-anchor="start" font-weight="700">SO (IV)</text><text x="94" y="460" font-size="12" fill="#64736c" text-anchor="middle">abduction</text><text x="326" y="460" font-size="12" fill="#64736c" text-anchor="middle">adduction</text><text x="210" y="128" font-size="15" fill="#173e39" text-anchor="middle">LR6 · SO4 · the rest III</text><rect x="426" y="96" width="264" height="116" rx="8" fill="#ffffff" stroke="#9ec7c2" stroke-width="1"/><path d="M434 96.6L682 96.6" stroke="#278278" stroke-width="2.4" stroke-linecap="round"/><text x="440" y="120" font-size="12" fill="#278278" font-weight="700" letter-spacing="1.1">THIRD NERVE (III)</text><text x="440" y="145" font-size="14" fill="#3b4c46" text-anchor="start">Eye down and out, ptosis;</text><text x="440" y="164" font-size="14" fill="#3b4c46" text-anchor="start">pupil may be large</text><rect x="426" y="228" width="264" height="116" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M434 228.6L682 228.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="440" y="252" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">FOURTH NERVE (IV)</text><text x="440" y="277" font-size="14" fill="#3b4c46" text-anchor="start">Vertical diplopia worse looking</text><text x="440" y="296" font-size="14" fill="#3b4c46" text-anchor="start">down and away; head tilts away</text><rect x="426" y="360" width="264" height="116" rx="8" fill="#ffffff" stroke="#b1c4d5" stroke-width="1"/><path d="M434 360.6L682 360.6" stroke="#527da2" stroke-width="2.4" stroke-linecap="round"/><text x="440" y="384" font-size="12" fill="#527da2" font-weight="700" letter-spacing="1.1">SIXTH NERVE (VI)</text><text x="440" y="409" font-size="14" fill="#3b4c46" text-anchor="start">Horizontal diplopia worse</text><text x="440" y="428" font-size="14" fill="#3b4c46" text-anchor="start">looking toward the weak side</text><rect x="30" y="500" width="660" height="86" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M38 500.6L682 500.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="524" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">TEST EACH VERTICAL MUSCLE WHERE IT WORKS BEST.</text><text x="44" y="550" font-size="14" fill="#3b4c46" text-anchor="start">Elevation and depression in abduction test SR and IR;</text><text x="44" y="569" font-size="14" fill="#3b4c46" text-anchor="start">in adduction they test IO and SO.</text><path d="M28 584L692 584" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="607" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="607" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 29</text></g></svg>