64736c" text-anchor="middle">other side</text><text x="190" y="390" font-size="15" fill="#173e39" text-anchor="middle">Lower face weak; forehead</text><text x="190" y="410" font-size="15" fill="#173e39" text-anchor="middle">wrinkles and eye closure</text><text x="190" y="430" font-size="15" fill="#173e39" text-anchor="middle">largely preserved.</text><text x="530" y="390" font-size="15" fill="#173e39" text-anchor="middle">Forehead, eye closure and</text><text x="530" y="410" font-size="15" fill="#173e39" text-anchor="middle">mouth weak on the side</text><text x="530" y="430" font-size="15" fill="#173e39" text-anchor="middle">of the lesion.</text><rect x="30" y="446" width="660" height="106" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M38 446.6L682 446.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="470" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">WHY THE FOREHEAD DIFFERS</text><text x="44" y="496" font-size="14" fill="#3b4c46" text-anchor="start">Forehead motor neurons receive input from both hemispheres. Sparing</text><text x="44" y="515" font-size="14" fill="#3b4c46" text-anchor="start">favors a central lesion but is not absolute: check limbs, speech and</text><text x="44" y="534" font-size="14" fill="#3b4c46" text-anchor="start">other cranial nerves. Faces are drawn facing you.</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="587" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 19</text></g></svg>