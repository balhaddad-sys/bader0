<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>Which part of the face is weak?</title><desc>Forehead involvement separates a central from a peripheral pattern. Original simplified teaching diagram; not to scale.</desc><defs><clipPath id="clip1"><ellipse cx="190" cy="222" rx="104" ry="110"/></clipPath><clipPath id="clip2"><ellipse cx="530" cy="222" rx="104" ry="110"/></clipPath></defs><rect width="720" height="600" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Which part of the face is weak?</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Forehead involvement separates a central from a peripheral pattern.</text><text x="190" y="96" font-size="13" fill="#278278" text-anchor="middle" font-weight="700">CENTRAL (ABOVE THE NUCLEUS)</text><ellipse cx="190" cy="222" rx="104" ry="110" fill="#ffffff"/><rect x="80" y="230" width="110" height="130" fill="#e3cfb1" opacity=".85" clip-path="url(#clip1)"/><ellipse cx="190" cy="222" rx="104" ry="110" fill="none" stroke="#173e39" stroke-width="3"/><path d="M190 112L190 332" fill="none" stroke="#d6dfd3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M208 140Q235 134 262 140" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 140Q145 134 172 140" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M208 153Q235 147 262 153" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 153Q145 147 172 153" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M208 166Q235 160 262 166" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 166Q145 160 172 166" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="230" cy="200" rx="19" ry="10" fill="#ffffff" stroke="#173e39" stroke-width="2"/><circle cx="230" cy="200" r="5" fill="#173e39"/><ellipse cx="150" cy="200" rx="19" ry="10" fill="#ffffff" stroke="#173e39" stroke-width="2"/><circle cx="150" cy="200" r="5" fill="#173e39"/><path d="M190 216L182 252L196 254" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M232 284Q190 300 150 300" fill="none" stroke="#173e39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="138" y="360" font-size="13" fill="#b17b30" text-anchor="middle">affected side</text><text x="242" y="360" font-size="13" fill="#64736c" text-anchor="middle">other side</text><text x="530" y="96" font-size="13" fill="#b17b30" text-anchor="middle" font-weight="700">PERIPHERAL (NUCLEUS OR NERVE)</text><ellipse cx="530" cy="222" rx="104" ry="110" fill="#ffffff"/><rect x="420" y="92" width="110" height="260" fill="#e3cfb1" opacity=".85" clip-path="url(#clip2)"/><ellipse cx="530" cy="222" rx="104" ry="110" fill="none" stroke="#173e39" stroke-width="3"/><path d="M530 112L530 332" fill="none" stroke="#d6dfd3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M548 140Q575 134 602 140" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M548 153Q575 147 602 153" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M548 166Q575 160 602 166" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="570" cy="200" rx="19" ry="10" fill="#ffffff" stroke="#173e39" stroke-width="2"/><circle cx="570" cy="200" r="5" fill="#173e39"/><ellipse cx="490" cy="201" rx="19" ry="13" fill="#ffffff" stroke="#173e39" stroke-width="2"/><circle cx="490" cy="201" r="5" fill="#173e39"/><path d="M530 216L522 252L536 254" fill="none" stroke="#64736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M572 284Q530 300 490 300" fill="none" stroke="#173e39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="478" y="360" font-size="13" fill="#b17b30" text-anchor="middle">affected side</text><text x="582" y="360" font-size="13" fill="#64736c" text-anchor="middle">other side</text><text x="190" y="386" font-size="15" fill="#173e39" text-anchor="middle">Lower face weak; forehead</text><text x="190" y="406" font-size="15" fill="#173e39" text-anchor="middle">wrinkles and eye closure</text><text x="190" y="426" font-size="15" fill="#173e39" text-anchor="middle">largely preserved.</text><text x="530" y="386" font-size="15" fill="#173e39" text-anchor="middle">Forehead, eye closure and</text><text x="530" y="406" font-size="15" fill="#173e39" text-anchor="middle">mouth weak on the side</text><text x="530" y="426" font-size="15" fill="#173e39" text-anchor="middle">of the lesion.</text><rect x="30" y="442" width="660" height="110" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="44" y="468" font-size="18" fill="#b17b30" text-anchor="start">Why the forehead differs</text><text x="44" y="494" font-size="15" fill="#64736c" text-anchor="start">Forehead motor neurons receive input from both hemispheres. Sparing</text><text x="44" y="514" font-size="15" fill="#64736c" text-anchor="start">favors a central lesion but is not absolute: check limbs, speech and</text><text x="44" y="534" font-size="15" fill="#64736c" text-anchor="start">other cranial nerves. Faces are drawn facing you.</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>