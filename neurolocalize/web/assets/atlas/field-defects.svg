<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img"><title>Where the visual pathway is cut</title><desc>Six classic lesion sites and the fields they remove. Original simplified teaching diagram; not to scale.</desc><defs></defs><rect width="720" height="640" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Where the visual pathway is cut</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Six classic lesion sites and the fields they remove.</text><text x="40" y="98" font-size="12" fill="#64736c" text-anchor="start">Viewed from above · patient's left on the left</text><circle cx="110" cy="140" r="32" fill="#ffffff" stroke="#173e39" stroke-width="2.5"/><circle cx="110" cy="122" r="10" fill="#173e39"/><text x="110" y="144" font-size="11" fill="#64736c" text-anchor="middle">Left eye</text><circle cx="250" cy="140" r="32" fill="#ffffff" stroke="#173e39" stroke-width="2.5"/><circle cx="250" cy="122" r="10" fill="#173e39"/><text x="250" y="144" font-size="11" fill="#64736c" text-anchor="middle">Right eye</text><path d="M110 172L180 228" fill="none" stroke="#527da2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 172L180 228" fill="none" stroke="#b17b30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 228L110 300" fill="none" stroke="#527da2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 228L250 300" fill="none" stroke="#b17b30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="110" cy="304" rx="14" ry="9" fill="#b3c5b5"/><ellipse cx="250" cy="304" rx="14" ry="9" fill="#b3c5b5"/><text x="180" y="309" font-size="12" fill="#64736c" text-anchor="middle">LGN</text><path d="M110 313L120 495" fill="none" stroke="#527da2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 313C302 330 310 400 235 495" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 313L230 495" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 0"/><text x="284" y="300" font-size="12" fill="#b17b30" text-anchor="start">Meyer</text><text x="284" y="316" font-size="12" fill="#b17b30" text-anchor="start">loop</text><rect x="70" y="495" width="220" height="42" rx="10" fill="#e5ece0" stroke="#b3c5b5" stroke-width="2"/><path d="M180 495L180 537" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="180" y="521" font-size="14" fill="#173e39" text-anchor="middle">Occipital cortex</text><text x="180" y="566" font-size="12" fill="#64736c" text-anchor="middle">Gold = right pathway, which carries</text><text x="180" y="582" font-size="12" fill="#64736c" text-anchor="middle">the LEFT visual hemifield</text><circle cx="223" cy="186" r="12" fill="#a34040"/><text x="223" y="190.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><circle cx="180" cy="228" r="12" fill="#a34040"/><text x="180" y="232.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><circle cx="222" cy="266" r="12" fill="#a34040"/><text x="222" y="270.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><circle cx="296" cy="352" r="12" fill="#a34040"/><text x="296" y="356.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><circle cx="238" cy="400" r="12" fill="#a34040"/><text x="238" y="404.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><circle cx="262" cy="516" r="12" fill="#a34040"/><text x="262" y="520.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><text x="612" y="102" font-size="12" fill="#64736c" text-anchor="middle">L eye</text><text x="664" y="102" font-size="12" fill="#64736c" text-anchor="middle">R eye</text><rect x="338" y="112" width="352" height="70" rx="10" fill="#ffffff"/><circle cx="360" cy="147" r="12" fill="#a34040"/><text x="360" y="151.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="382" y="141" font-size="15" fill="#173e39" text-anchor="start">Optic nerve</text><text x="382" y="162" font-size="13" fill="#b17b30" text-anchor="start">Right eye only</text><circle cx="612" cy="147" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><circle cx="612" cy="147" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="147" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="147" r="21" fill="#173e39"/><circle cx="664" cy="147" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><rect x="338" y="192" width="352" height="70" rx="10" fill="#ffffff"/><circle cx="360" cy="227" r="12" fill="#a34040"/><text x="360" y="231.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="382" y="221" font-size="15" fill="#173e39" text-anchor="start">Chiasm (crossing fibers)</text><text x="382" y="242" font-size="13" fill="#b17b30" text-anchor="start">Bitemporal hemianopia</text><circle cx="612" cy="227" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M612 206A21 21 0 0 0 612 248Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="612" cy="227" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="227" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M664 206A21 21 0 0 1 664 248Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="664" cy="227" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><rect x="338" y="272" width="352" height="70" rx="10" fill="#ffffff"/><circle cx="360" cy="307" r="12" fill="#a34040"/><text x="360" y="311.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="382" y="301" font-size="15" fill="#173e39" text-anchor="start">Optic tract</text><text x="382" y="322" font-size="13" fill="#b17b30" text-anchor="start">Left homonymous hemianopia</text><circle cx="612" cy="307" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M612 286A21 21 0 0 0 612 328Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="612" cy="307" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="307" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M664 286A21 21 0 0 0 664 328Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="664" cy="307" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><rect x="338" y="352" width="352" height="70" rx="10" fill="#ffffff"/><circle cx="360" cy="387" r="12" fill="#a34040"/><text x="360" y="391.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="382" y="381" font-size="15" fill="#173e39" text-anchor="start">Temporal (Meyer loop)</text><text x="382" y="402" font-size="13" fill="#b17b30" text-anchor="start">Left upper quadrant</text><circle cx="612" cy="387" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M612 387L612 366A21 21 0 0 0 591 387Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="612" cy="387" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="387" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M664 387L664 366A21 21 0 0 0 643 387Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="664" cy="387" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><rect x="338" y="432" width="352" height="70" rx="10" fill="#ffffff"/><circle cx="360" cy="467" r="12" fill="#a34040"/><text x="360" y="471.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="382" y="461" font-size="15" fill="#173e39" text-anchor="start">Parietal radiation</text><text x="382" y="482" font-size="13" fill="#b17b30" text-anchor="start">Left lower quadrant</text><circle cx="612" cy="467" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M612 467L591 467A21 21 0 0 0 612 488Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="612" cy="467" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="467" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M664 467L643 467A21 21 0 0 0 664 488Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="664" cy="467" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><rect x="338" y="512" width="352" height="70" rx="10" fill="#ffffff"/><circle cx="360" cy="547" r="12" fill="#a34040"/><text x="360" y="551.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><text x="382" y="541" font-size="15" fill="#173e39" text-anchor="start">Occipital cortex</text><text x="382" y="559" font-size="12" fill="#b17b30" text-anchor="start">Left hemianopia;</text><text x="382" y="575" font-size="12" fill="#b17b30" text-anchor="start">macula may be spared</text><circle cx="612" cy="547" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M612 526A21 21 0 0 0 612 568Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="612" cy="547" r="6" fill="#ffffff"/><circle cx="612" cy="547" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="547" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M664 526A21 21 0 0 0 664 568Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="664" cy="547" r="6" fill="#ffffff"/><circle cx="664" cy="547" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><path d="M28 604L692 604" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="627" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>