t-size="15" fill="#173e39" text-anchor="start">Optic nerve</text><text x="382" y="162" font-size="13" fill="#b17b30" text-anchor="start">Right eye only</text><circle cx="612" cy="147" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><circle cx="612" cy="147" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="147" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="147" r="21" fill="url(#g173e39)" filter="url(#lift)"/><circle cx="664" cy="147" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><rect x="338" y="192" width="352" height="70" rx="10" fill="#ffffff"/><circle cx="360" cy="227" r="12" fill="url(#ga34040)" stroke="#ffffff" stroke-width="2" filter="url(#lift)"/><text x="360" y="231.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="382" y="221" font-size="15" fill="#173e39" text-anchor="start">Chiasm (crossing fibers)</text><text x="382" y="242" font-size="13" fill="#b17b30" text-anchor="start">Bitemporal hemianopia</text><circle cx="612" cy="227" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M612 206A21 21 0 0 0 612 248Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="612" cy="227" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="227" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M664 206A21 21 0 0 1 664 248Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="664" cy="227" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><rect x="338" y="272" width="352" height="70" rx="10" fill="#ffffff"/><circle cx="360" cy="307" r="12" fill="url(#ga34040)" stroke="#ffffff" stroke-width="2" filter="url(#lift)"/><text x="360" y="311.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="382" y="301" font-size="15" fill="#173e39" text-anchor="start">Optic tract</text><text x="382" y="322" font-size="13" fill="#b17b30" text-anchor="start">Left homonymous hemianopia</text><circle cx="612" cy="307" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M612 286A21 21 0 0 0 612 328Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="612" cy="307" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="307" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M664 286A21 21 0 0 0 664 328Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="664" cy="307" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><rect x="338" y="352" width="352" height="70" rx="10" fill="#ffffff"/><circle cx="360" cy="387" r="12" fill="url(#ga34040)" stroke="#ffffff" stroke-width="2" filter="url(#lift)"/><text x="360" y="391.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="382" y="381" font-size="15" fill="#173e39" text-anchor="start">Temporal (Meyer loop)</text><text x="382" y="402" font-size="13" fill="#b17b30" text-anchor="start">Left upper quadrant</text><circle cx="612" cy="387" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M612 387L612 366A21 21 0 0 0 591 387Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="612" cy="387" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="387" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M664 387L664 366A21 21 0 0 0 643 387Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="664" cy="387" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><rect x="338" y="432" width="352" height="70" rx="10" fill="#ffffff"/><circle cx="360" cy="467" r="12" fill="url(#ga34040)" stroke="#ffffff" stroke-width="2" filter="url(#lift)"/><text x="360" y="471.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="382" y="461" font-size="15" fill="#173e39" text-anchor="start">Parietal radiation</text><text x="382" y="482" font-size="13" fill="#b17b30" text-anchor="start">Left lower quadrant</text><circle cx="612" cy="467" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M612 467L591 467A21 21 0 0 0 612 488Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="612" cy="467" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="467" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M664 467L643 467A21 21 0 0 0 664 488Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="664" cy="467" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><rect x="338" y="512" width="352" height="70" rx="10" fill="#ffffff"/><circle cx="360" cy="547" r="12" fill="url(#ga34040)" stroke="#ffffff" stroke-width="2" filter="url(#lift)"/><text x="360" y="551.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><text x="382" y="541" font-size="15" fill="#173e39" text-anchor="start">Occipital cortex</text><text x="382" y="559" font-size="12" fill="#b17b30" text-anchor="start">Left hemianopia;</text><text x="382" y="575" font-size="12" fill="#b17b30" text-anchor="start">macula may be spared</text><circle cx="612" cy="547" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M612 526A21 21 0 0 0 612 568Z" fill="#173e39" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="612" cy="547" r="6" fill="#ffffff"/><circle cx="612" cy="547" r="21" fill="none" stroke="#173e39" stroke-width="1.5"/><circle cx="664" cy="547" r="21" fill="#ffffff" stroke="#173e39" stroke-width="1.5"/><path d="M664 526A21 21 0 0 0 664 568Z" fill="#173e39" stroke="none" strok