<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>The horizontal gaze circuit</title><desc>Looking to the right starts in the right pons and reaches both eyes. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow-278278" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker><marker id="arrow-173e39" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#173e39" stroke-width="1.3"/></marker><marker id="arrow-b17b30" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b17b30" stroke-width="1.3"/></marker></defs><rect width="720" height="600" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">The horizontal gaze circuit</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Looking to the right starts in the right pons and reaches both eyes.</text><path d="M360 84L360 462" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="348" y="200" font-size="11" fill="#64736c" text-anchor="end">LEFT</text><text x="372" y="200" font-size="11" fill="#64736c" text-anchor="start">RIGHT</text><ellipse cx="220" cy="146" rx="56" ry="32" fill="#ffffff" stroke="#173e39" stroke-width="2.5"/><circle cx="246" cy="146" r="14" fill="#173e39"/><text x="128" y="151" font-size="12" fill="#64736c" text-anchor="middle">Left eye</text><ellipse cx="490" cy="146" rx="56" ry="32" fill="#ffffff" stroke="#173e39" stroke-width="2.5"/><circle cx="516" cy="146" r="14" fill="#173e39"/><text x="582" y="151" font-size="12" fill="#64736c" text-anchor="middle">Right eye</text><path d="M196 102L246 102" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><path d="M466 102L516 102" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="221" y="92" font-size="11" fill="#64736c" text-anchor="middle">gaze right</text><text x="491" y="92" font-size="11" fill="#64736c" text-anchor="middle">gaze right</text><text x="292" y="132" font-size="13" fill="#278278" text-anchor="start" font-weight="700">MR</text><text x="552" y="132" font-size="13" fill="#b17b30" text-anchor="start" font-weight="700">LR</text><rect x="130" y="216" width="460" height="64" rx="10" fill="#e5ece0"/><text x="140" y="236" font-size="11" fill="#64736c" text-anchor="start" font-weight="700">MIDBRAIN</text><rect x="130" y="298" width="460" height="150" rx="10" fill="#e5ece0"/><text x="140" y="318" font-size="11" fill="#64736c" text-anchor="start" font-weight="700">PONS</text><circle cx="316" cy="250" r="16" fill="#278278"/><text x="316" y="255" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">III</text><circle cx="430" cy="350" r="16" fill="#b17b30"/><text x="430" y="355" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">VI</text><rect x="440" y="398" width="90" height="34" rx="8" fill="#ffffff" stroke="#173e39" stroke-width="2"/><text x="485" y="420" font-size="13" fill="#173e39" text-anchor="middle">PPRF</text><path d="M470 398L442 366" fill="none" stroke="#173e39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-173e39)"/><path d="M446 350L540 350L540 186" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><text x="550" y="270" font-size="12" fill="#b17b30" text-anchor="start">VI</text><text x="550" y="286" font-size="12" fill="#b17b30" text-anchor="start">nerve</text><path d="M420 362L316 372L316 274" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="326" y="400" font-size="12" fill="#278278" text-anchor="start">crosses → left MLF</text><path d="M304 238L268 186" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="232" y="214" font-size="12" fill="#278278" text-anchor="end">III nerve</text><circle cx="316" cy="318" r="13" fill="#a34040"/><text x="316" y="323.76" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">×</text><text x="334" y="323" font-size="12" fill="#a34040" text-anchor="start">MLF lesion</text><rect x="30" y="470" width="214" height="94" rx="12" fill="#ffffff" stroke="#a34040" stroke-width="2"/><text x="44" y="496" font-size="15" fill="#a34040" text-anchor="start">MLF (INO)</text><text x="44" y="518" font-size="13" fill="#64736c" text-anchor="start">Same side cannot</text><text x="44" y="536" font-size="13" fill="#64736c" text-anchor="start">adduct; other eye jerks</text><rect x="253" y="470" width="214" height="94" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="267" y="496" font-size="15" fill="#b17b30" text-anchor="start">VI nucleus</text><text x="267" y="518" font-size="13" fill="#64736c" text-anchor="start">Gaze palsy toward the</text><text x="267" y="536" font-size="13" fill="#64736c" text-anchor="start">lesion, both eyes</text><rect x="476" y="470" width="214" height="94" rx="12" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="490" y="496" font-size="15" fill="#527da2" text-anchor="start">VI nerve</text><text x="490" y="518" font-size="13" fill="#64736c" text-anchor="start">Abduction fails in the</text><text x="490" y="536" font-size="13" fill="#64736c" text-anchor="start">same-side eye only</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>