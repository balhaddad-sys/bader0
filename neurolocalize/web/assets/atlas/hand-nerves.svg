<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img"><title>Sensory nerves of the hand</title><desc>Right hand. Median (teal), ulnar (gold) and radial (blue) territories. Original simplified teaching diagram; not to scale.</desc><defs><clipPath id="clip1"><rect x="110" y="250" width="132" height="150" rx="22"/></clipPath><clipPath id="clip2"><rect x="178" y="138" width="28" height="126" rx="13"/></clipPath><clipPath id="clip3"><rect x="470" y="250" width="132" height="150" rx="22"/></clipPath><clipPath id="clip4"><rect x="570" y="140" width="28" height="124" rx="13"/></clipPath><clipPath id="clip5"><rect x="538" y="128" width="28" height="136" rx="13"/></clipPath><clipPath id="clip6"><rect x="506" y="138" width="28" height="126" rx="13"/></clipPath></defs><rect width="720" height="640" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Sensory nerves of the hand</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Right hand. Median (teal), ulnar (gold) and radial (blue) territories.</text><text x="176" y="106" font-size="13" fill="#64736c" text-anchor="middle" font-weight="700">PALM</text><g clip-path="url(#clip1)"><rect x="110" y="250" width="82" height="150" fill="#a9d1c9"/><rect x="192" y="250" width="50" height="150" fill="#e6cfa6"/></g><rect fill="#a9d1c9" x="80" y="280" width="30" height="88" rx="14" transform="rotate(-28 95 362)"/><rect x="114" y="140" width="28" height="124" rx="13" fill="#a9d1c9"/><rect x="146" y="128" width="28" height="136" rx="13" fill="#a9d1c9"/><g clip-path="url(#clip2)"><rect x="178" y="138" width="14" height="126" fill="#a9d1c9"/><rect x="192" y="138" width="14" height="126" fill="#e6cfa6"/></g><rect x="210" y="158" width="28" height="106" rx="13" fill="#e6cfa6"/><g fill="none" stroke="#173e39" stroke-width="2"><rect x="114" y="140" width="28" height="124" rx="13"/><rect x="146" y="128" width="28" height="136" rx="13"/><rect x="178" y="138" width="28" height="126" rx="13"/><rect x="210" y="158" width="28" height="106" rx="13"/><rect x="110" y="250" width="132" height="150" rx="22"/><rect x="80" y="280" width="30" height="88" rx="14" transform="rotate(-28 95 362)"/></g><text x="176" y="432" font-size="12" fill="#64736c" text-anchor="middle">thumb ←</text><text x="536" y="106" font-size="13" fill="#64736c" text-anchor="middle" font-weight="700">BACK OF HAND</text><g clip-path="url(#clip3)"><rect x="520" y="250" width="82" height="150" fill="#b4c8db"/><rect x="470" y="250" width="50" height="150" fill="#e6cfa6"/></g><rect fill="#b4c8db" x="602" y="280" width="30" height="88" rx="14" transform="rotate(28 617 362)"/><rect x="570" y="140" width="28" height="124" rx="13" fill="#b4c8db"/><rect x="570" y="140" width="28" height="38" fill="#a9d1c9" clip-path="url(#clip4)"/><rect x="538" y="128" width="28" height="136" rx="13" fill="#b4c8db"/><rect x="538" y="128" width="28" height="38" fill="#a9d1c9" clip-path="url(#clip5)"/><g clip-path="url(#clip6)"><rect x="520" y="138" width="14" height="126" fill="#b4c8db"/><rect x="520" y="138" width="14" height="38" fill="#a9d1c9"/><rect x="506" y="138" width="14" height="126" fill="#e6cfa6"/></g><rect x="474" y="158" width="28" height="106" rx="13" fill="#e6cfa6"/><g fill="none" stroke="#173e39" stroke-width="2"><rect x="570" y="140" width="28" height="124" rx="13"/><rect x="538" y="128" width="28" height="136" rx="13"/><rect x="506" y="138" width="28" height="126" rx="13"/><rect x="474" y="158" width="28" height="106" rx="13"/><rect x="470" y="250" width="132" height="150" rx="22"/><rect x="602" y="280" width="30" height="88" rx="14" transform="rotate(28 617 362)"/></g><text x="536" y="432" font-size="12" fill="#64736c" text-anchor="middle">thumb →</text><rect x="40" y="462" width="22" height="22" rx="5" fill="#a9d1c9" stroke="#278278" stroke-width="1.5"/><text x="74" y="478" font-size="15" fill="#173e39" text-anchor="start">Median</text><text x="150" y="478" font-size="13" fill="#64736c" text-anchor="start">palm side of thumb to radial ring finger; dorsal fingertips</text><rect x="40" y="496" width="22" height="22" rx="5" fill="#e6cfa6" stroke="#b17b30" stroke-width="1.5"/><text x="74" y="512" font-size="15" fill="#173e39" text-anchor="start">Ulnar</text><text x="150" y="512" font-size="13" fill="#64736c" text-anchor="start">little finger and ulnar half of ring finger, both sides</text><rect x="40" y="530" width="22" height="22" rx="5" fill="#b4c8db" stroke="#527da2" stroke-width="1.5"/><text x="74" y="546" font-size="15" fill="#173e39" text-anchor="start">Radial</text><text x="150" y="546" font-size="13" fill="#64736c" text-anchor="start">back of the radial hand, especially the first web space</text><text x="40" y="586" font-size="13" fill="#b17b30" text-anchor="start">A split ring finger points to a nerve, not a C8 root. Borders vary.</text><path d="M28 604L692 604" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="627" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>