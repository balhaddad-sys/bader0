<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img"><title>Sensory nerves of the hand</title><desc>Right hand. Median (teal), ulnar (gold) and radial (blue) territories. Original simplified teaching diagram; not to scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><clipPath id="clip1"><rect x="110" y="250" width="132" height="150" rx="22"/></clipPath><clipPath id="clip2"><rect x="178" y="138" width="28" height="126" rx="13"/></clipPath><clipPath id="clip3"><rect x="470" y="250" width="132" height="150" rx="22"/></clipPath><clipPath id="clip4"><rect x="570" y="140" width="28" height="124" rx="13"/></clipPath><clipPath id="clip5"><rect x="538" y="128" width="28" height="136" rx="13"/></clipPath><clipPath id="clip6"><rect x="506" y="138" width="28" height="126" rx="13"/></clipPath></defs><rect width="720" height="640" rx="18" fill="url(#bg)"/><rect width="720" height="640" rx="18" fill="url(#dots)" opacity=".55"/><rect x=".5" y=".5" width="719" height="639" rx="17.5" fill="none" stroke="#dfe5da"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="26" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.4">Sensory nerves of the hand</text><text x="28" y="68" font-size="15