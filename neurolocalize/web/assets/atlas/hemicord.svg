markerHeight="16" refX="11" refY="8" orient="auto"><path d="M2 2.5L13 8L2 13.5L5 8Z" fill="#278278"/></marker></defs><rect width="720" height="560" rx="18" fill="url(#bg)"/><rect width="720" height="560" rx="18" fill="url(#dots)" opacity=".55"/><rect x=".5" y=".5" width="719" height="559" rx="17.5" fill="none" stroke="#dfe5da"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="26" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.4">Why a hemicord splits modalities</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Axial cord schematic viewed from above: dorsal is at the top.</text><text x="277" y="105" font-size="15" fill="#64736c" text-anchor="start">DORSAL</text><ellipse cx="327" cy="264" rx="150" ry="135" fill="url(#tissue)" stroke="#173e39" stroke-width="3"/><path d="M327 132A150 135 0 0 0 327 396Z" fill="#e3cfb1" opacity=".65"/><path d="M288 203C278 224 297 242 312 249C289 271 272 305 287 326L322 290L337 290L370 326C382 306 365 273 344 249C359 237 375 222 366 203L337 235L320 235Z" fill="#b3c5b5"/><circle cx="305" cy="181" r="18" fill="url(#gb17b30)" filter="url(#lift)"/><circle cx="220" cy="259" r="18" fill="url(#g278278)" filter="url(#lift)"/><circle cx="229" cy="326" r="18" fill="url(#g527da2)" filter="url(#lift)"/><path d="M306 180L448 138" fill="none" stroke="#b17b30" stroke-width="2" /><text x="465" y="132" font-size="17" fill="#b17b30" text-anchor="start">Dorsal column</text><text x="465" y="157" font-size="17" fill="#b17b30" text-anchor="start">Vibration / position</text><text x="465" y="182" font-size="17" fill="#b17b30" text-anchor="start">same-side body</text><path d="M222 258L71 216" fill="none" stroke="#278278" stroke-width="2" /><text x="29" y="158" font-size="17" fill="#278278" text-anchor="start">Corticospinal</text><text x="29" y="183" font-size="17" fill="#278278" text-anchor="start">Same-side</text><text x="29" y="208" font-size="17" fill="#278278" text-anchor="start">limb weakness</text><path d="M229 326L449 373" fill="none" stroke="#527da2" stroke-width="2" /><text x="465" y="368" font-size="17" fill="#527da2" text-anchor="start">Anterolateral tract</text><text x="465" y="393" font-size="17" fill="#527da2" text-anchor="start">Pain / temperature</text><text x="465" y="418" font-size="17" fill="#527da2" text-anchor="start">opposite-side body</text><text x="266" y="431" font-size="15" fill="#64736c" text-anchor="start">VENTRAL</text><text x="30" y="475" font-size="16" fill="#64736c" text-anchor="start">Shading marks an illustrative hemicord lesion, not a radiology image.</text><text x="30" y="500" font-size="16" fill="#64736c" text-anchor="start">Pain loss can begin below the lesion because fibers travel before crossing.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE  ·  ORIGINAL SCHEMATIC  ·  NOT TO SCALE</text><text x="692" y="547" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 07</text></g></svg>