<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>Why a hemicord splits modalities</title><desc>Axial cord at one level, dorsal up; the left half is damaged. Original simplified teaching diagram; not to scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><radialGradient id="rf7f9f4d9e4d4" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f7f9f4"/><stop offset="1" stop-color="#d9e4d4"/></radialGradient><radialGradient id="rc6d4c894aa9c" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#c6d4c8"/><stop offset="1" stop-color="#94aa9c"/></radialGradient><clipPath id="clip1"><ellipse cx="300" cy="290" rx="170" ry="140"/></clipPath></defs><rect width="720" height="620" rx="14" fill="#fcfcf9"/><rect x=".5" y=".5" width="719" height="619" rx="13.5" fill="none" stroke="#dde3d8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="25" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.3">Why a hemicord splits modalities</text><text x="28" y="66" font-size="14" fill="#64736c" text-anchor="start">Axial cord at one level, dorsal up; the left half is damaged.</text><path d="M215.0 178.0C147.0 143.0 113.0 157.0 82.4 164.0" fill="none" stroke="#c8a36e" stroke-width="17.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M232.0 404.8C164.0 437.0 121.5 430.0 87.5 418.8" fill="none" stroke="#68a8a0" stroke-width="17.0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="126.6" cy="151.4" rx="22.1" ry="14.0" fill="#e3cfb1" stroke="#b17b30" stroke-width="1"/><path d="M385.0 178.0C453.0 143.0 487.0 157.0 517.6 164.0" fill="none" stroke="#c8a36e" stroke-width="17.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M368.0 404.8C436.0 437.0 478.5 430.0 512.5 418.8" fill="none" stroke="#68a8a0" stroke-width="17.0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="473.4" cy="151.4" rx="22.1" ry="14.0" fill="#e3cfb1" stroke="#b17b30" stroke-width="1"/><ellipse cx="300" cy="290" rx="170" ry="140" fill="url(#rf7f9f4d9e4d4)"/><path d="M288 203C278 224 297 242 312 249C289 271 272 305 287 326L322 290L337 290L370 326C382 306 365 273 344 249C359 237 375 222 366 203L337 235L320 235Z" fill="url(#rc6d4c894aa9c)" transform="translate(300 290) scale(1.1333 1.0370) translate(-327 -264)"/><ellipse cx="300" cy="290" rx="170" ry="140" fill="none" stroke="#173e39" stroke-width="2.4"/><path d="M288.1 431.0L300 388.0L311.9 431.0" fill="#f4f5ee" stroke="#173e39" stroke-width="1.6" stroke-linejoin="round"/><path d="M300 150L300 203.2" fill="none" stroke="#173e39" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="292.8" r="5.95" fill="#173e39"/><g clip-path="url(#clip1)"><path d="M296 150L242 158L278 250L296 254Z" fill="#e6cfa6"/><ellipse cx="182" cy="284" rx="32" ry="40" fill="#a9d1c9"/><path d="M150 324C150 370 200 410 240 418L248 386C212 376 184 350 182 320Z" fill="#b4c8db"/><path d="M304 150L358 158L322 250L304 254Z" fill="#e6cfa6"/><ellipse cx="418" cy="284" rx="32" ry="40" fill="#a9d1c9"/><path d="M450 324C450 370 400 410 360 418L352 386C388 376 416 350 418 320Z" fill="#b4c8db"/></g><path d="M288 203C278 224 297 242 312 249C289 271 272 305 287 326L322 290L337 290L370 326C382 306 365 273 344 249C359 237 375 222 366 203L337 235L320 235Z" fill="url(#rc6d4c894aa9c)" transform="translate(300 290) scale(1.1333 1.0370) translate(-327 -264)"/><g clip-path="url(#clip1)"><g fill="#a34040" opacity=".16"><rect x="125" y="145" width="175" height="290"/></g><path d="M300 150L300 430" stroke="#a34040" stroke-width="2" stroke-dasharray="6 4"/></g><ellipse cx="300" cy="290" rx="170" ry="140" fill="none" stroke="#173e39" stroke-width="2.4"/><text x="300" y="120" font-size="11" fill="#64736c" text-anchor="middle" font-weight="700" letter-spacing=".9">DORSAL</text><text x="150" y="456" font-size="12" fill="#a34040" text-anchor="start" font-weight="700" letter-spacing=".9">damaged half</text><circle cx="270" cy="180" r="2.6" fill="#173e39"/><path d="M270 180L530 116" stroke="#173e39" stroke-width=".9" fill="none"/><text x="535" y="120" font-size="13" fill="#b17b30" text-anchor="start" font-weight="700" letter-spacing=".9">Dorsal column</text><text x="535" y="134" font-size="12" fill="#3b4c46" text-anchor="start">vibration and position;</text><text x="535" y="150" font-size="12" fill="#3b4c46" text-anchor="start">loss on the SAME side</text><circle cx="182" cy="284" r="2.6" fill="#173e39"/><path d="M182 284L530 230" stroke="#173e39" stroke-width=".9" fill="none"/><text x="535" y="234" font-size="13" fill="#278278" text-anchor="start" font-weight="700" letter-spacing=".9">Lateral corticospinal</text><text x="535" y="248" font-size="12" fill="#3b4c46" text-anchor="start">already crossed; weakness</text><text x="535" y="264" font-size="12" fill="#3b4c46" text-anchor="start">on the SAME side</text><circle cx="180" cy="370" r="2.6" fill="#173e39"/><path d="M180 370L530 350" stroke="#173e39" stroke-width=".9" fill="none"/><text x="535" y="354" font-size="13" fill="#527da2" text-anchor="start" font-weight="700" letter-spacing=".9">Anterolateral tract</text><text x="535" y="368" font-size="12" fill="#3b4c46" text-anchor="start">pain and temperature from the</text><text x="535" y="384" font-size="12" fill="#3b4c46" text-anchor="start">OTHER side, from a level or</text><text x="535" y="400" font-size="12" fill="#3b4c46" text-anchor="start">two below</text><rect x="30" y="474" width="660" height="88" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M38 474.6L682 474.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="498" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">DIFFERENT CROSSINGS, DIFFERENT SIDES</text><text x="44" y="524" font-size="14" fill="#3b4c46" text-anchor="start">Dorsal column fibres cross in the medulla and motor fibres crossed above the cord,</text><text x="44" y="543" font-size="14" fill="#3b4c46" text-anchor="start">while pain fibres cross near entry. Shading illustrates a pattern, not a scan.</text><path d="M28 584L692 584" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="607" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="607" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 07</text></g></svg>