<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>The sympathetic path to the eye</title><desc>Three neurons: hypothalamus → C8–T2 → superior cervical ganglion → eye. Original simplified teaching diagram; not to scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><radialGradient id="rfffbf5efe5d6" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#fffbf5"/><stop offset="1" stop-color="#efe5d6"/></radialGradient><clipPath id="clip1"><path d="M227 134Q240 126.2 253 134Q240 141.8 227 134Z"/></clipPath><radialGradient id="rffffffe7ece4" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7ece4"/></radialGradient><radialGradient id="ra0b8cc216a62" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#a0b8cc"/><stop offset="1" stop-color="#216a62"/></radialGradient><linearGradient id="g278278" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#579e96"/><stop offset="1" stop-color="#257a70"/></linearGradient><marker id="arrow-278278" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto"><path d="M2 2.5L13 8L2 13.5L5 8Z" fill="#278278"/></marker><linearGradient id="gb17b30" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2985e"/><stop offset="1" stop-color="#9f7431"/></linearGradient><marker id="arrow-b17b30" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto"><path d="M2 2.5L13 8L2 13.5L5 8Z" fill="#b17b30"/></marker><linearGradient id="g527da2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#789ab6"/><stop offset="1" stop-color="#4b7595"/></linearGradient><marker id="arrow-527da2" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto"><path d="M2 2.5L13 8L2 13.5L5 8Z" fill="#527da2"/></marker></defs><rect width="720" height="600" rx="18" fill="url(#bg)"/><rect width="720" height="600" rx="18" fill="url(#dots)" opacity=".55"/><rect x=".5" y=".5" width="719" height="599" rx="17.5" fill="none" stroke="#dfe5da"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="26" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.4">The sympathetic path to the eye</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Three neurons: hypothalamus → C8–T2 → superior cervical ganglion → eye.</text><path d="M150 300C128 250 116 170 142 118C164 76 230 70 256 110C262 120 263 128 262 136L284 166C286 170 282 174 276 174L270 176C272 182 268 188 268 192C270 198 266 204 262 206C264 214 258 222 246 224L228 230L230 292C270 300 320 316 340 340L340 520L110 520L110 340C120 320 134 308 150 300Z" fill="url(#rfffbf5efe5d6)" stroke="#173e39" stroke-width="2.2" stroke-linejoin="round"/><path d="M176 150L176 400" fill="none" stroke="#9ec7c2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".45"/><text x="170" y="470" font-size="11" fill="#64736c" text-anchor="middle">cord</text><ellipse cx="258" cy="412" rx="52" ry="70" fill="#e3eaf0" stroke="#b3c5b5" stroke-width="1.5"/><text x="258" y="420" font-size="12" fill="#527da2" text-anchor="middle">lung</text><text x="258" y="436" font-size="12" fill="#527da2" text-anchor="middle">apex</text><path d="M227 134Q240 126.2 253 134Q240 141.8 227 134Z" fill="url(#rffffffe7ece4)"/><g clip-path="url(#clip1)"><circle cx="245" cy="134" r="5.5" fill="url(#ra0b8cc216a62)"/><path d="M247.6 134.0L250.1 134.0" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M247.4 135.0L249.7 135.9" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M246.9 135.9L248.6 137.6" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M246.0 136.4L246.9 138.7" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M245.0 136.6L245.0 139.1" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M244.0 136.4L243.1 138.7" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M243.1 135.9L241.4 137.6" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M242.6 135.0L240.3 135.9" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M242.4 134.0L239.9 134.0" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M242.6 133.0L240.3 132.1" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M243.1 132.1L241.4 130.4" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M244.0 131.6L243.1 129.3" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M245.0 131.4L245.0 128.9" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M246.0 131.6L246.9 129.3" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M246.9 132.1L248.6 130.4" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><path d="M247.4 133.0L249.7 132.1" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/><circle cx="245" cy="134" r="2.3" fill="#10231f"/><circle cx="243.2" cy="132.2" r="1.5" fill="#ffffff" opacity=".9"/></g><path d="M227 134Q240 126.2 253 134Q240 141.8 227 134Z" fill="none" stroke="#173e39" stroke-width="2" stroke-linejoin="round"/><circle cx="192" cy="118" r="9" fill="url(#g278278)" filter="url(#lift)"/><path d="M192 128L184 210L176 300L172 372" fill="none" stroke="#278278" stroke-width="12" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M192 128L184 210L176 300L172 372" fill="none" stroke="#278278" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><circle cx="172" cy="380" r="8" fill="url(#gb17b30)" filter="url(#lift)"/><path d="M178 382C214 384 222 342 226 300L228 256" fill="none" stroke="#b17b30" stroke-width="12" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M178 382C214 384 222 342 226 300L228 256" fill="none" stroke="#b17b30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><circle cx="228" cy="248" r="8" fill="url(#g527da2)" filter="url(#lift)"/><path d="M230 240C238 210 246 180 240 144" fill="none" stroke="#527da2" stroke-width="12" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 240C238 210 246 180 240 144" fill="none" stroke="#527da2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-527da2)"/><rect x="372" y="96" width="318" height="124" rx="12" fill="url(#card)" stroke="#5da19a" stroke-width="1.6" filter="url(#shadow)"/><rect x="373" y="106" width="3.5" height="30" rx="1.75" fill="#278278"/><text x="386" y="122" font-size="17" fill="#278278" text-anchor="start">1st order</text><text x="386" y="147" font-size="14" fill="#64736c" text-anchor="start">Hypothalamus → brainstem</text><text x="386" y="166" font-size="14" fill="#64736c" text-anchor="start">→ cervical cord (C8–T2)</text><text x="386" y="185" font-size="14" fill="#64736c" text-anchor="start">e.g. lateral medulla, cord</text><rect x="372" y="236" width="318" height="124" rx="12" fill="url(#card)" stroke="#c49c64" stroke-width="1.6" filter="url(#shadow)"/><rect x="373" y="246" width="3.5" height="30" rx="1.75" fill="#b17b30"/><text x="386" y="262" font-size="17" fill="#b17b30" text-anchor="start">2nd order</text><text x="386" y="287" font-size="14" fill="#64736c" text-anchor="start">Cord → over lung apex</text><text x="386" y="306" font-size="14" fill="#64736c" text-anchor="start">→ superior cervical ganglion</text><text x="386" y="325" font-size="14" fill="#64736c" text-anchor="start">e.g. lung apex, neck</text><rect x="372" y="376" width="318" height="124" rx="12" fill="url(#card)" stroke="#7d9eb9" stroke-width="1.6" filter="url(#shadow)"/><rect x="373" y="386" width="3.5" height="30" rx="1.75" fill="#527da2"/><text x="386" y="402" font-size="17" fill="#527da2" text-anchor="start">3rd order</text><text x="386" y="427" font-size="14" fill="#64736c" text-anchor="start">Along the internal carotid</text><text x="386" y="446" font-size="14" fill="#64736c" text-anchor="start">→ pupil dilator, eyelid</text><text x="386" y="465" font-size="14" fill="#64736c" text-anchor="start">e.g. carotid wall, skull base</text><text x="40" y="556" font-size="14" fill="#173e39" text-anchor="start">Same side: mild ptosis, smaller pupil; sweating loss depends on the site.</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE  ·  ORIGINAL SCHEMATIC  ·  NOT TO SCALE</text><text x="692" y="587" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 20</text></g></svg>