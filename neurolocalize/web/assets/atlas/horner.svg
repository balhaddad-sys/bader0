<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>The sympathetic path to the eye</title><desc>Three neurons: hypothalamus → C8–T2 → superior cervical ganglion → eye. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow-278278" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker><marker id="arrow-b17b30" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b17b30" stroke-width="1.3"/></marker><marker id="arrow-527da2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#527da2" stroke-width="1.3"/></marker></defs><rect width="720" height="600" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">The sympathetic path to the eye</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Three neurons: hypothalamus → C8–T2 → superior cervical ganglion → eye.</text><path d="M140 120C140 80 220 72 250 104C268 124 262 160 250 180L246 214L210 220L206 290L150 290L150 210C128 190 140 150 140 120Z" fill="#ffffff" stroke="#b3c5b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 290L120 340L120 520L330 520L330 340L206 290" fill="#ffffff" stroke="#b3c5b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="258" cy="412" rx="52" ry="70" fill="#e3eaf0" stroke="#b3c5b5" stroke-width="1.5"/><text x="258" y="420" font-size="12" fill="#527da2" text-anchor="middle">lung</text><text x="258" y="436" font-size="12" fill="#527da2" text-anchor="middle">apex</text><ellipse cx="236" cy="132" rx="14" ry="8" fill="#ffffff" stroke="#173e39" stroke-width="2"/><circle cx="236" cy="132" r="3" fill="#173e39"/><circle cx="192" cy="118" r="9" fill="#278278"/><path d="M192 128L184 210L176 300L172 372" fill="none" stroke="#278278" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><circle cx="172" cy="380" r="8" fill="#b17b30"/><path d="M178 382C214 384 222 342 226 300L228 256" fill="none" stroke="#b17b30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><circle cx="228" cy="248" r="8" fill="#527da2"/><path d="M230 240C238 210 246 180 240 144" fill="none" stroke="#527da2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-527da2)"/><rect x="372" y="96" width="318" height="124" rx="12" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="386" y="122" font-size="17" fill="#278278" text-anchor="start">1st order</text><text x="386" y="147" font-size="14" fill="#64736c" text-anchor="start">Hypothalamus → brainstem</text><text x="386" y="166" font-size="14" fill="#64736c" text-anchor="start">→ cervical cord (C8–T2)</text><text x="386" y="185" font-size="14" fill="#64736c" text-anchor="start">e.g. lateral medulla, cord</text><rect x="372" y="236" width="318" height="124" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="386" y="262" font-size="17" fill="#b17b30" text-anchor="start">2nd order</text><text x="386" y="287" font-size="14" fill="#64736c" text-anchor="start">Cord → over lung apex</text><text x="386" y="306" font-size="14" fill="#64736c" text-anchor="start">→ superior cervical ganglion</text><text x="386" y="325" font-size="14" fill="#64736c" text-anchor="start">e.g. lung apex, neck</text><rect x="372" y="376" width="318" height="124" rx="12" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="386" y="402" font-size="17" fill="#527da2" text-anchor="start">3rd order</text><text x="386" y="427" font-size="14" fill="#64736c" text-anchor="start">Along the internal carotid</text><text x="386" y="446" font-size="14" fill="#64736c" text-anchor="start">→ pupil dilator, eyelid</text><text x="386" y="465" font-size="14" fill="#64736c" text-anchor="start">e.g. carotid wall, skull base</text><text x="40" y="556" font-size="14" fill="#173e39" text-anchor="start">Same side: mild ptosis, smaller pupil; sweating loss depends on the site.</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>