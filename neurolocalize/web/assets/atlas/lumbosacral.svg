xt><path d="M300 322C360 322 380 300 432 300" fill="none" stroke="#173e39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="440" cy="300" r="8" fill="#173e39"/><text x="456" y="305" font-size="15" fill="#173e39" text-anchor="start">Tibial</text><text x="456" y="323" font-size="12" fill="#64736c" text-anchor="start">plantar flexion, inversion, sole</text><path d="M300 322C360 322 380 376 432 376" fill="none" stroke="#173e39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="440" cy="376" r="8" fill="#173e39"/><text x="456" y="381" font-size="15" fill="#173e39" text-anchor="start">Common fibular</text><text x="456" y="399" font-size="12" fill="#64736c" text-anchor="start">dorsiflexion, eversion, dorsum</text><text x="238" y="346" font-size="12" fill="#64736c" text-anchor="start">L4–S3</text><rect x="30" y="420" width="660" height="182" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="1.2"/><text x="46" y="448" font-size="17" fill="#b17b30" text-anchor="start">Foot drop: L5 root or common fibular nerve?</text><text x="380" y="476" font-size="12" fill="#278278" text-anchor="start" font-weight="700" letter-spacing=".9">L5 ROOT</text><text x="530" y="476" font-size="12" fill="#527da2" text-anchor="start" font-weight="700" letter-spacing=".9">FIBULAR NERVE</text><text x="46" y="504" font-size="14" fill="#173e39" text-anchor="start">Ankle dorsiflexion</text><text x="380" y="504" font-size="14" fill="#278278" text-anchor="start">Weak</text><text x="530" y="504" font-size="14" fill="#527da2" text-anchor="start">Weak</text><text x="46" y="530" font-size="14" fill="#173e39" text-anchor="start">Foot inversion (tibial nerve)</text><text x="380" y="530" font-size="14" fill="#278278" text-anchor="start">Often weak</text><text x="530" y="530" font-size="14" fill="#527da2" text-anchor="start">Spared</text><text x="46" y="556" font-size="14" fill="#173e39" text-anchor="start">Hip abduction (superior gluteal)</text><text x="380" y="556" font-size="14" fill="#278278" text-anchor="start">Often weak</text><text x="530" y="556" font-size="14" fill="#527da2" text-anchor="start">Spared</text><text x="46" y="582" font-size="14" fill="#173e39" text-anchor="start">Back or radiating leg pain</text><text x="380" y="582" font-size="14" fill="#278278" text-anchor="start">Common</text><text x="530" y="582" font-size="14" fill="#527da2" text-anchor="start">Uncommon</text><path d="M28 624L692 624" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="647" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="647" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 34</text></g></svg>