<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>The final link: nerve → junction → muscle</title><desc>Transmission failure and muscle disease can both spare sensation.. Original simplified teaching diagram; not to scale.</desc><defs><radialGradient id="tissue" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f7f9f4"/><stop offset="1" stop-color="#d9e4d4"/></radialGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><linearGradient id="g173e39" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6865"/><stop offset="1" stop-color="#173e39"/></linearGradient><linearGradient id="g278278" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#579e96"/><stop offset="1" stop-color="#257a70"/></linearGradient><linearGradient id="g527da2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#789ab6"/><stop offset="1" stop-color="#4b7595"/></linearGradient><linearGradient id="ga34040" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b76a6a"/><stop offset="1" stop-color="#92403f"/></linearGradient><linearGradient id="gb17b30" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2985e"/><stop offset="1" stop-color="#9f7431"/></linearGradient><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto"><path d="M2 2.5L13 8L2 13.5L5 8Z" fill="#278278"/></marker></defs><rect width="720" height="560" rx="18" fill="url(#bg)"/><rect width="720" height="560" rx="18" fill="url(#dots)" opacity=".55"/><rect x=".5" y=".5" width="719" height="559" rx="17.5" fill="none" stroke="#dfe5da"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="26" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.4">The final link: nerve → junction → muscle</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Transmission failure and muscle disease can both spare sensation.</text><path d="M55 119H203V204C253 210 273 251 252 289H98C75 253 104 215 143 204V119" fill="#dfead9" stroke="#278278" stroke-width="3"/><text x="285" y="166" font-size="21" fill="#278278" text-anchor="start">Motor nerve terminal</text><path d="M248 232L681 232" fill="none" stroke="#c9d5c7" stroke-width="2" /><circle cx="122" cy="252" r="6" fill="url(#gb17b30)" filter="url(#lift)"/><circle cx="161" cy="266" r="6" fill="url(#gb17b30)" filter="url(#lift)"/><circle cx="201" cy="252" r="6" fill="url(#gb17b30)" filter="url(#lift)"/><circle cx="228" cy="266" r="6" fill="url(#gb17b30)" filter="url(#lift)"/><circle cx="116" cy="305" r="4" fill="url(#gb17b30)" filter="url(#lift)"/><circle cx="150" cy="318" r="4" fill="url(#gb17b30)" filter="url(#lift)"/><circle cx="184" cy="305" r="4" fill="url(#gb17b30)" filter="url(#lift)"/><circle cx="218" cy="318" r="4" fill="url(#gb17b30)" filter="url(#lift)"/><circle cx="247" cy="305" r="4" fill="url(#gb17b30)" filter="url(#lift)"/><text x="286" y="314" font-size="20" fill="#b17b30" text-anchor="start">Acetylcholine in the cleft</text><path d="M65 376V348H115V376H139V348H183V376H208V348H252V376H679V474H65Z" fill="#e3eaf0" stroke="#527da2" stroke-width="3"/><text x="286" y="403" font-size="20" fill="#527da2" text-anchor="start">Muscle membrane &amp; receptors</text><text x="286" y="441" font-size="19" fill="#527da2" text-anchor="start">Muscle fiber</text><path d="M264 289L279 295" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="500" font-size="16" fill="#64736c" text-anchor="start">MG: postsynaptic receptors. LEMS: presynaptic transmitter release.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE  ·  ORIGINAL SCHEMATIC  ·  NOT TO SCALE</text><text x="692" y="547" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 09</text></g></svg>