<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Where the motor pathway crosses</title><desc>Representative lateral corticospinal route for the RIGHT limbs.. Original simplified teaching diagram; not to scale.</desc><defs><radialGradient id="tissue" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f7f9f4"/><stop offset="1" stop-color="#d9e4d4"/></radialGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><linearGradient id="g173e39" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6865"/><stop offset="1" stop-color="#173e39"/></linearGradient><linearGradient id="g278278" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#579e96"/><stop offset="1" stop-color="#257a70"/></linearGradient><linearGradient id="g527da2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#789ab6"/><stop offset="1" stop-color="#4b7595"/></linearGradient><linearGradient id="ga34040" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b76a6a"/><stop offset="1" stop-color="#92403f"/></linearGradient><linearGradient id="gb17b30" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2985e"/><stop offset="1" stop-color="#9f7431"/></linearGradient><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto"><path d="M2 2.5L13 8L2 13.5L5 8Z" fill="#278278"/></marker></defs><rect width="720" height="560" rx="18" fill="url(#bg)"/><rect width="720" height="560" rx="18" fill="url(#dots)" opacity=".55"/><rect x=".5" y=".5" width="719" height="559" rx="17.5" fill="none" stroke="#dfe5da"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="26" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.4">Where the motor pathway crosses</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Representative lateral corticospinal route for the RIGHT limbs.</text><text x="97" y="104" font-size="15" fill="#64736c" text-anchor="start">LEFT</text><text x="357" y="104" font-size="15" fill="#64736c" text-anchor="start">RIGHT</text><path d="M264 118L264 466" fill="none" stroke="#c5cfc5" stroke-width="2" /><rect x="39" y="120" width="192" height="74" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="55" y="150" font-size="20" fill="#278278" text-anchor="start">Motor cortex</text><rect x="39" y="213" width="192" height="70" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="55" y="243" font-size="20" fill="#278278" text-anchor="start">Brainstem</text><rect x="297" y="352" width="189" height="69" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="313" y="382" font-size="20" fill="#278278" text-anchor="start">Spinal cord</text><rect x="510" y="352" width="181" height="69" rx="13" fill="url(#card)" stroke="#b17b30" stroke-width="2" filter="url(#shadow)"/><text x="526" y="382" font-size="20" fill="#b17b30" text-anchor="start">Motor unit</text><path d="M135 194V210" fill="none" stroke="#278278" stroke-width="12" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 194V210" fill="none" stroke="#278278" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 286C135 316 393 311 393 344" fill="none" stroke="#278278" stroke-width="12" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 286C135 316 393 311 393 344" fill="none" stroke="#278278" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M486 386L505 386" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13"/><path d="M486 386L505 386" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><text x="307" y="158" font-size="19" fill="#173e39" text-anchor="start">Above the crossing:</text><text x="307" y="183" font-size="19" fill="#173e39" text-anchor="start">opposite-side limb</text><text x="307" y="208" font-size="19" fill="#173e39" text-anchor="start">weakness</text><text x="42" y="377" font-size="18" fill="#173e39" text-anchor="start">Below the crossing:</text><text x="42" y="402" font-size="18" fill="#173e39" text-anchor="start">same-side limb</text><text x="42" y="427" font-size="18" fill="#173e39" text-anchor="start">weakness</text><text x="324" y="266" font-size="17" fill="#278278" text-anchor="start">Most fibers cross</text><text x="324" y="291" font-size="17" fill="#278278" text-anchor="start">in the caudal medulla</text><text x="42" y="475" font-size="17" fill="#64736c" text-anchor="start">UMN signs may evolve over time; acute lesions can be flaccid.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE  ·  ORIGINAL SCHEMATIC  ·  NOT TO SCALE</text><text x="692" y="547" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 02</text></g></svg>