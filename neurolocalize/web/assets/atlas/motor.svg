<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Where the motor pathway crosses</title><desc>Representative lateral corticospinal route for the RIGHT limbs.. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker></defs><rect width="720" height="560" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Where the motor pathway crosses</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Representative lateral corticospinal route for the RIGHT limbs.</text><text x="97" y="104" font-size="15" fill="#64736c" text-anchor="start">LEFT</text><text x="357" y="104" font-size="15" fill="#64736c" text-anchor="start">RIGHT</text><path d="M264 118L264 466" fill="none" stroke="#c5cfc5" stroke-width="2" /><rect x="39" y="120" width="192" height="74" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="55" y="150" font-size="20" fill="#278278" text-anchor="start">Motor cortex</text><rect x="39" y="213" width="192" height="70" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="55" y="243" font-size="20" fill="#278278" text-anchor="start">Brainstem</text><rect x="297" y="352" width="189" height="69" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="313" y="382" font-size="20" fill="#278278" text-anchor="start">Spinal cord</text><rect x="510" y="352" width="181" height="69" rx="13" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="526" y="382" font-size="20" fill="#b17b30" text-anchor="start">Motor unit</text><path d="M135 194V210" fill="none" stroke="#278278" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 286C135 316 393 311 393 344" fill="none" stroke="#278278" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M486 386L505 386" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><text x="307" y="158" font-size="19" fill="#173e39" text-anchor="start">Above the crossing:</text><text x="307" y="183" font-size="19" fill="#173e39" text-anchor="start">opposite-side limb</text><text x="307" y="208" font-size="19" fill="#173e39" text-anchor="start">weakness</text><text x="42" y="377" font-size="18" fill="#173e39" text-anchor="start">Below the crossing:</text><text x="42" y="402" font-size="18" fill="#173e39" text-anchor="start">same-side limb</text><text x="42" y="427" font-size="18" fill="#173e39" text-anchor="start">weakness</text><text x="324" y="266" font-size="17" fill="#278278" text-anchor="start">Most fibers cross</text><text x="324" y="291" font-size="17" fill="#278278" text-anchor="start">in the caudal medulla</text><text x="42" y="475" font-size="17" fill="#64736c" text-anchor="start">UMN signs may evolve over time; acute lesions can be flaccid.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>