<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>A map from brain to muscle</title><desc>Start with distribution; then look for the finding that separates levels.. Original simplified teaching diagram; not to scale.</desc><defs><radialGradient id="tissue" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f7f9f4"/><stop offset="1" stop-color="#d9e4d4"/></radialGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><linearGradient id="g173e39" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6865"/><stop offset="1" stop-color="#173e39"/></linearGradient><linearGradient id="g278278" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#579e96"/><stop offset="1" stop-color="#257a70"/></linearGradient><linearGradient id="g527da2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#789ab6"/><stop offset="1" stop-color="#4b7595"/></linearGradient><linearGradient id="ga34040" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b76a6a"/><stop offset="1" stop-color="#92403f"/></linearGradient><linearGradient id="gb17b30" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2985e"/><stop offset="1" stop-color="#9f7431"/></linearGradient><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="8" orient="auto"><path d="M2 2.5L13 8L2 13.5L5 8Z" fill="#278278"/></marker></defs><rect width="720" height="560" rx="18" fill="url(#bg)"/><rect width="720" height="560" rx="18" fill="url(#dots)" opacity=".55"/><rect x=".5" y=".5" width="719" height="559" rx="17.5" fill="none" stroke="#dfe5da"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="26" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.4">A map from brain to muscle</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Start with distribution; then look for the finding that separates levels.</text><rect x="30" y="94" width="278" height="76" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="46" y="124" font-size="20" fill="#278278" text-anchor="start">Cerebral cortex</text><text x="46" y="150" font-size="16" fill="#64736c" text-anchor="start">Language · attention · fields</text><rect x="30" y="194" width="278" height="76" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="46" y="224" font-size="20" fill="#278278" text-anchor="start">Deep brain / brainstem</text><text x="46" y="250" font-size="16" fill="#64736c" text-anchor="start">Compact tracts · cranial signs</text><rect x="30" y="294" width="278" height="76" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="46" y="324" font-size="20" fill="#278278" text-anchor="start">Spinal cord</text><text x="46" y="350" font-size="16" fill="#64736c" text-anchor="start">Sensory level · long tracts</text><rect x="412" y="94" width="278" height="76" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="428" y="124" font-size="20" fill="#278278" text-anchor="start">Root / plexus</text><text x="428" y="150" font-size="16" fill="#64736c" text-anchor="start">Myotome · several nerves</text><rect x="412" y="194" width="278" height="76" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="428" y="224" font-size="20" fill="#278278" text-anchor="start">Peripheral nerve</text><text x="428" y="250" font-size="16" fill="#64736c" text-anchor="start">A named nerve distribution</text><rect x="412" y="294" width="278" height="76" rx="13" fill="url(#card)" stroke="#278278" stroke-width="2" filter="url(#shadow)"/><text x="428" y="324" font-size="20" fill="#278278" text-anchor="start">Junction / muscle</text><text x="428" y="350" font-size="16" fill="#64736c" text-anchor="start">Motor pattern; sensation spared</text><path d="M169 170L169 190" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13"/><path d="M169 170L169 190" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><path d="M169 270L169 290" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13"/><path d="M169 270L169 290" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><path d="M308 332H353V132H408" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M308 332H353V132H408" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M551 170L551 190" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13"/><path d="M551 170L551 190" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><path d="M551 270L551 290" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13"/><path d="M551 270L551 290" fill="none" stroke="#278278" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="404" width="660" height="92" rx="13" fill="url(#card)" stroke="#b17b30" stroke-width="2" filter="url(#shadow)"/><text x="46" y="434" font-size="20" fill="#b17b30" text-anchor="start">One clue rarely fixes one location.</text><text x="46" y="460" font-size="16" fill="#64736c" text-anchor="start">Combine motor, sensory, reflex, cranial and higher cortical findings.</text><text x="46" y="485" font-size="16" fill="#64736c" text-anchor="start">A pattern can narrow the level without proving a specific disease.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE  ·  ORIGINAL SCHEMATIC  ·  NOT TO SCALE</text><text x="692" y="547" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 01</text></g></svg>