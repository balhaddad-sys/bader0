8Q257 528 254 548" fill="none" stroke="#ffffff" stroke-opacity=".4"/><path d="M262 508Q265 528 262 548" fill="none" stroke="#ffffff" stroke-opacity=".4"/><path d="M270 508Q273 528 270 548" fill="none" stroke="#ffffff" stroke-opacity=".4"/><path d="M278 508Q281 528 278 548" fill="none" stroke="#ffffff" stroke-opacity=".4"/><path d="M286 508Q289 528 286 548" fill="none" stroke="#ffffff" stroke-opacity=".4"/><path d="M294 508Q297 528 294 548" fill="none" stroke="#ffffff" stroke-opacity=".4"/><path d="M302 508Q305 528 302 548" fill="none" stroke="#ffffff" stroke-opacity=".4"/><circle cx="262" cy="506" r="4" fill="#b17b30"/><circle cx="108" cy="128" r="10" fill="#278278" stroke="#ffffff" stroke-width="2"/><text x="108" y="131.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><circle cx="150" cy="178" r="10" fill="#278278" stroke="#ffffff" stroke-width="2"/><text x="150" y="181.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><circle cx="182" cy="244" r="10" fill="#278278" stroke="#ffffff" stroke-width="2"/><text x="182" y="247.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><circle cx="180" cy="330" r="10" fill="#278278" stroke="#ffffff" stroke-width="2"/><text x="180" y="333.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><circle cx="204" cy="360" r="10" fill="#b17b30" stroke="#ffffff" stroke-width="2"/><text x="204" y="363.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><circle cx="252" cy="400" r="10" fill="#b17b30" stroke="#ffffff" stroke-width="2"/><text x="252" y="403.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><circle cx="276" cy="462" r="10" fill="#b17b30" stroke="#ffffff" stroke-width="2"/><text x="276" y="465.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">7</text><circle cx="300" cy="512" r="10" fill="#b17b30" stroke="#ffffff" stroke-width="2"/><text x="300" y="515.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">8</text><text x="352" y="98" font-size="11" fill="#278278" text-anchor="start" font-weight="700" letter-spacing=".9">CENTRAL NERVOUS SYSTEM</text><text x="352" y="344" font-size="11" fill="#b17b30" text-anchor="start" font-weight="700" letter-spacing=".9">PERIPHERAL NERVOUS SYSTEM</text><path d="M340 156L690 156" stroke="#d6dfd3" stroke-width="1"/><circle cx="352" cy="130" r="10" fill="#278278" stroke="#ffffff" stroke-width="2"/><text x="352" y="133.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="372" y="128" font-size="15" fill="#173e39" text-anchor="start" font-weight="700">Cerebral cortex</text><text x="372" y="147" font-size="13" fill="#3b4c46" text-anchor="start">Language, neglect, field cut, cortical sensory loss</text><path d="M340 210L690 210" stroke="#d6dfd3" stroke-width="1"/><circle cx="352" cy="184" r="10" fill="#278278" stroke="#ffffff" stroke-width="2"/><text x="352" y="187.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="372" y="182" font-size="15" fill="#173e39" text-anchor="start" font-weight="700">Deep hemisphere</text><text x="372" y="201" font-size="13" fill="#3b4c46" text-anchor="start">Dense face–arm–leg weakness, no cortical signs</text><path d="M340 264L690 264" stroke="#d6dfd3" stroke-width="1"/><circle cx="352" cy="238" r="10" fill="#278278" stroke="#ffffff" stroke-width="2"/><text x="352" y="241.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="372" y="236" font-size="15" fill="#173e39" text-anchor="start" font-weight="700">Brainstem</text><text x="372" y="255" font-size="13" fill="#3b4c46" text-anchor="start">Cranial nerve signs with crossed limb findings</text><path d="M340 318L690 318" stroke="#d6dfd3" stroke-width="1"/><circle cx="352" cy="292" r="10" fill="#278278" stroke="#ffffff" stroke-width="2"/><text x="352" y="295.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="372" y="290" font-size="15" fill="#173e39" text-anchor="start" font-weight="700">Spinal cord</text><text x="372" y="309" font-size="13" fill="#3b4c46" text-anchor="start">Sensory level, both sides, sphincter change</text><path d="M340 402L690 402" stroke="#d6dfd3" stroke-width="1"/><circle cx="352" cy="376" r="10" fill="#b17b30" stroke="#ffffff" stroke-width="2"/><text x="352" y="379.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="372" y="374" font-size="15" fill="#173e39" text-anchor="start" font-weight="700">Nerve root</text><text x="372" y="393" font-size="13" fill="#3b4c46" text-anchor="start">Pain and deficit in one root territory</text><path d="M340 456L690 456" stroke="#d6dfd3" stroke-width="1"/><circle cx="352" cy="430" r="10" fill="#b17b30" stroke="#ffffff" stroke-width="2"/><text x="352" y="433.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><text x="372" y="428" font-size="15" fill="#173e39" text-anchor="start" font-weight="700">Plexus</text><text x="372" y="447" font-size="13" fill="#3b4c46" text-anchor="start">Several nerves and roots in one limb</text><path d="M340 510L690 510" stroke="#d6dfd3" stroke-width="1"/><circle cx="352" cy="484" r="10" fill="#b17b30" stroke="#ffffff" stroke-width="2"/><text x="352" y="487.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">7</text><text x="372" y="482" font-size="15" fill="#173e39" text-anchor="start" font-weight="700">Peripheral nerve</text><text x="372" y="501" font-size="13" fill="#3b4c46" text-anchor="start">Deficit confined to one named nerve</text><path d="M340 564L690 564" stroke="#d6dfd3" stroke-width="1"/><circle cx="352" cy="538" r="10" fill="#b17b30" stroke="#ffffff" stroke-width="2"/><text x="352" y="541.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">8</text><text x="372" y="536" font-size="15" fill="#173e39" text-anchor="start" font-weight="700">Junction or muscle</text><text x="372" y="555" font-size="13" fill="#3b4c46" text-anchor="start">Weakness without any sensory loss</text><text x="40" y="604" font-size="13" fill="#b17b30" text-anchor="start">One clue rarely fixes a level: combine motor, sensory, reflex, cranial and cortical findings.</text><path d="M28 614L692 614" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="637" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="637" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 01</text></g></svg>