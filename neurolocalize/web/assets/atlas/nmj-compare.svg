<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img"><title>Two junction disorders, two sides of the cleft</title><desc>Postsynaptic myasthenia compared with presynaptic Lambert–Eaton. Original simplified teaching diagram; not to scale.</desc><defs></defs><rect width="720" height="640" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Two junction disorders, two sides of the cleft</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Postsynaptic myasthenia compared with presynaptic Lambert–Eaton.</text><text x="190" y="102" font-size="14" fill="#278278" text-anchor="middle" font-weight="700">MYASTHENIA GRAVIS</text><path d="M160 116L160 150Q110 158 100 196L280 196Q270 158 220 150L220 116" fill="#ffffff" stroke="#173e39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="140" cy="176" r="7" fill="#e3cfb1" stroke="#b17b30" stroke-width="1.5"/><circle cx="172" cy="176" r="7" fill="#e3cfb1" stroke="#b17b30" stroke-width="1.5"/><circle cx="204" cy="176" r="7" fill="#e3cfb1" stroke="#b17b30" stroke-width="1.5"/><circle cx="236" cy="176" r="7" fill="#e3cfb1" stroke="#b17b30" stroke-width="1.5"/><rect x="122" y="188" width="12" height="14" rx="3" fill="#527da2"/><rect x="246" y="188" width="12" height="14" rx="3" fill="#527da2"/><path d="M70 222L80 222L85 240L90 222L110 222L115 240L120 222L140 222L145 240L150 222L170 222L175 240L180 222L200 222L205 240L210 222L230 222L235 240L240 222L260 222L265 240L270 222L290 222L295 240L300 222L310 222L310 272L70 272Z" fill="#e5ece0" stroke="#173e39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="78" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="108" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="138" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="168" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="198" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="228" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="258" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="288" y="216" width="9" height="9" rx="2" fill="#278278"/><path d="M105 204L119 218M119 204L105 218" fill="none" stroke="#a34040" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M165 204L179 218M179 204L165 218" fill="none" stroke="#a34040" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 204L239 218M239 204L225 218" fill="none" stroke="#a34040" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="296" font-size="13" fill="#64736c" text-anchor="middle">Antibodies reduce ACh receptors</text><text x="530" y="102" font-size="14" fill="#527da2" text-anchor="middle" font-weight="700">LAMBERT–EATON</text><path d="M500 116L500 150Q450 158 440 196L620 196Q610 158 560 150L560 116" fill="#ffffff" stroke="#173e39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="480" cy="176" r="7" fill="#e3cfb1" stroke="#b17b30" stroke-width="1.5"/><circle cx="512" cy="176" r="7" fill="#e3cfb1" stroke="#b17b30" stroke-width="1.5"/><circle cx="544" cy="176" r="7" fill="#e3cfb1" stroke="#b17b30" stroke-width="1.5"/><circle cx="576" cy="176" r="7" fill="#e3cfb1" stroke="#b17b30" stroke-width="1.5"/><rect x="462" y="188" width="12" height="14" rx="3" fill="#527da2"/><rect x="586" y="188" width="12" height="14" rx="3" fill="#527da2"/><path d="M410 222L420 222L425 240L430 222L450 222L455 240L460 222L480 222L485 240L490 222L510 222L515 240L520 222L540 222L545 240L550 222L570 222L575 240L580 222L600 222L605 240L610 222L630 222L635 240L640 222L650 222L650 272L410 272Z" fill="#e5ece0" stroke="#173e39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="418" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="448" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="478" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="508" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="538" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="568" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="598" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="628" y="216" width="9" height="9" rx="2" fill="#278278"/><path d="M460 186L476 202M476 186L460 202" fill="none" stroke="#a34040" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 186L600 202M600 186L584 202" fill="none" stroke="#a34040" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="296" font-size="13" fill="#64736c" text-anchor="middle">Antibodies impair Ca²⁺ channels</text><path d="M360 92L360 300" fill="none" stroke="#d6dfd3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="324" width="660" height="1.5" rx="0" fill="#d6dfd3"/><text x="40" y="348" font-size="13" fill="#173e39" text-anchor="start" font-weight="700">First weakness</text><text x="196" y="348" font-size="14" fill="#278278" text-anchor="start">Eyelids, eye movements,</text><text x="440" y="348" font-size="14" fill="#527da2" text-anchor="start">Proximal legs; eye signs</text><text x="196" y="374" font-size="14" fill="#278278" text-anchor="start">bulbar muscles common</text><text x="440" y="374" font-size="14" fill="#527da2" text-anchor="start">usually milder</text><rect x="30" y="386" width="660" height="1.5" rx="0" fill="#d6dfd3"/><text x="40" y="410" font-size="13" fill="#173e39" text-anchor="start" font-weight="700">Reflexes</text><text x="196" y="410" font-size="14" fill="#278278" text-anchor="start">Usually normal</text><text x="440" y="410" font-size="14" fill="#527da2" text-anchor="start">Reduced; may return after</text><text x="196" y="436" font-size="14" fill="#278278" text-anchor="start"></text><text x="440" y="436" font-size="14" fill="#527da2" text-anchor="start">brief maximal effort</text><rect x="30" y="448" width="660" height="1.5" rx="0" fill="#d6dfd3"/><text x="40" y="472" font-size="13" fill="#173e39" text-anchor="start" font-weight="700">Repeated effort</text><text x="196" y="472" font-size="14" fill="#278278" text-anchor="start">Fatigable weakness</text><text x="440" y="472" font-size="14" fill="#527da2" text-anchor="start">Strength may improve briefly</text><rect x="30" y="484" width="660" height="1.5" rx="0" fill="#d6dfd3"/><text x="40" y="508" font-size="13" fill="#173e39" text-anchor="start" font-weight="700">Autonomic</text><text x="196" y="508" font-size="14" fill="#278278" text-anchor="start">Not typical</text><text x="440" y="508" font-size="14" fill="#527da2" text-anchor="start">Dry mouth, other symptoms</text><rect x="30" y="520" width="660" height="1.5" rx="0" fill="#d6dfd3"/><text x="40" y="544" font-size="13" fill="#173e39" text-anchor="start" font-weight="700">Nerve stimulation</text><text x="196" y="544" font-size="14" fill="#278278" text-anchor="start">Decrement at slow rates</text><text x="440" y="544" font-size="14" fill="#527da2" text-anchor="start">Increment after exercise</text><text x="40" y="590" font-size="13" fill="#b17b30" text-anchor="start">Sensation is spared in both. Patterns overlap; confirm with appropriate testing.</text><path d="M28 604L692 604" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="627" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>