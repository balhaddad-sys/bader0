ight="9" rx="2" fill="#278278"/><rect x="508" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="538" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="568" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="598" y="216" width="9" height="9" rx="2" fill="#278278"/><rect x="628" y="216" width="9" height="9" rx="2" fill="#278278"/><path d="M460 186L476 202M476 186L460 202" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M460 186L476 202M476 186L460 202" fill="none" stroke="#a34040" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 186L600 202M600 186L584 202" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 186L600 202M600 186L584 202" fill="none" stroke="#a34040" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="296" font-size="13" fill="#64736c" text-anchor="middle">Antibodies impair Ca²⁺ channels</text><path d="M360 92L360 300" fill="none" stroke="#d6dfd3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="324" width="660" height="1.5" rx="0" fill="#d6dfd3"/><text x="40" y="348" font-size="13" fill="#173e39" text-anchor="start" font-weight="700" letter-spacing=".9">First weakness</text><text x="196" y="348" font-size="14" fill="#278278" text-anchor="start">Eyelids, eye movements,</text><text x="440" y="348" font-size="14" fill="#527da2" text-anchor="start">Proximal legs; eye signs</text><text x="196" y="374" font-size="14" fill="#278278" text-anchor="start">bulbar muscles common</text><text x="440" y="374" font-size="14" fill="#527da2" text-anchor="start">usually milder</text><rect x="30" y="386" width="660" height="1.5" rx="0" fill="#d6dfd3"/><text x="40" y="410" font-size="13" fill="#173e39" text-anchor="start" font-weight="700" letter-spacing=".9">Reflexes</text><text x="196" y="410" font-size="14" fill="#278278" text-anchor="start">Usually normal</text><text x="440" y="410" font-size="14" fill="#527da2" text-anchor="start">Reduced; may return after</text><text x="196" y="436" font-size="14" fill="#278278" text-anchor="start"></text><text x="440" y="436" font-size="14" fill="#527da2" text-anchor="start">brief maximal effort</text><rect x="30" y="448" width="660" height="1.5" rx="0" fill="#d6dfd3"/><text x="40" y="472" font-size="13" fill="#173e39" text-anchor="start" font-weight="700" letter-spacing=".9">Repeated effort</text><text x="196" y="472" font-size="14" fill="#278278" text-anchor="start">Fatigable weakness</text><text x="440" y="472" font-size="14" fill="#527da2" text-anchor="start">Strength may improve briefly</text><rect x="30" y="484" width="660" height="1.5" rx="0" fill="#d6dfd3"/><text x="40" y="508" font-size="13" fill="#173e39" text-anchor="start" font-weight="700" letter-spacing=".9">Autonomic</text><text x="196" y="508" font-size="14" fill="#278278" text-anchor="start">Not typical</text><text x="440" y="508" font-size="14" fill="#527da2" text-anchor="start">Dry mouth, other symptoms</text><rect x="30" y="520" width="660" height="1.5" rx="0" fill="#d6dfd3"/><text x="40" y="544" font-size="13" fill="#173e39" text-anchor="start" font-weight="700" letter-spacing=".9">Nerve stimulation</text><text x="196" y="544" font-size="14" fill="#278278" text-anchor="start">Decrement at slow rates</text><text x="440" y="544" font-size="14" fill="#527da2" text-anchor="start">Increment after exercise</text><text x="40" y="590" font-size="13" fill="#b17b30" text-anchor="start">Sensation is spared in both. Patterns overlap; confirm with appropriate testing.</text><path d="M28 604L692 604" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="627" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="627" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 25</text></g></svg>