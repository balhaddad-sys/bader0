">Fibers mix,</text><text x="292" y="234" font-size="16" fill="#64736c" text-anchor="start">divide and</text><text x="292" y="259" font-size="16" fill="#64736c" text-anchor="start">recombine</text><rect x="556" y="123" width="137" height="65" rx="13" fill="url(#card)" stroke="#527da2" stroke-width="2" filter="url(#shadow)"/><text x="572" y="153" font-size="20" fill="#527da2" text-anchor="start">Nerve A</text><rect x="556" y="236" width="137" height="65" rx="13" fill="url(#card)" stroke="#527da2" stroke-width="2" filter="url(#shadow)"/><text x="572" y="266" font-size="20" fill="#527da2" text-anchor="start">Nerve B</text><rect x="556" y="349" width="137" height="65" rx="13" fill="url(#card)" stroke="#527da2" stroke-width="2" filter="url(#shadow)"/><text x="572" y="379" font-size="20" fill="#527da2" text-anchor="start">Nerve C</text><path d="M118 125L276 178" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 125L276 178" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 195L276 213" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 195L276 213" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 265L276 256" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 265L276 256" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 335L276 300" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 335L276 300" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 405L276 337" fill="none" stroke="#278278" stroke-width="10" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 405L276 337" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M443 185L552 155" fill="none" stroke="#527da2" stroke-width="10" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M443 185L552 155" fill="none" stroke="#527da2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M443 247L552 268" fill="none" stroke="#527da2" stroke-width="10" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M443 247L552 268" fill="none" stroke="#527da2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M443 321L552 381" fill="none" stroke="#527da2" stroke-width="10" stroke-opacity=".13" stroke-linecap="round" stroke-linejoin="round"/><path d="M443 321L552 381" fill="none" stroke="#527da2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="469" font-size="17" fill="#64736c" text-anchor="start">Root: test the same myotome through different nerves.</text><text x="28" y="494" font-size="17" fill="#64736c" text-anchor="start">Nerve: test its muscles and cutaneous territory; branches matter.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE  ·  ORIGINAL SCHEMATIC  ·  NOT TO SCALE</text><text x="692" y="547" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 08</text></g></svg>