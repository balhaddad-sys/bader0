<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Root, plexus or named nerve?</title><desc>A conceptual wiring map: each nerve contains fibers from several roots.. Original simplified teaching diagram; not to scale.</desc><defs><radialGradient id="tissue" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f7f9f4"/><stop offset="1" stop-color="#d9e4d4"/></radialGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><linearGradient id="g173e39" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6865"/><stop offset="1" stop-color="#173e39"/></linearGradient><linearGradient id="g278278" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#579e96"/><stop offset="1" stop-color="#257a70"/></linearGradient><linearGradient id="g527da2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#789ab6"/><stop offset="1" stop-color="#4b7595"/></linearGradient><linearGradient id="ga34040" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b76a6a"/><stop offset="1" stop-color="#92403f"/></linearGradient><linearGradient id="gb17b30" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2985e"/><stop offset="1" stop-color="#9f7431"/></linearGradient><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth