<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"><title>Root, plexus or named nerve?</title><desc>A conceptual wiring map: each nerve contains fibers from several roots.. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker></defs><rect width="720" height="560" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Root, plexus or named nerve?</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">A conceptual wiring map: each nerve contains fibers from several roots.</text><rect x="28" y="101" width="90" height="51" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="44" y="131" font-size="20" fill="#278278" text-anchor="start">C5</text><rect x="28" y="171" width="90" height="51" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="44" y="201" font-size="20" fill="#278278" text-anchor="start">C6</text><rect x="28" y="241" width="90" height="51" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="44" y="271" font-size="20" fill="#278278" text-anchor="start">C7</text><rect x="28" y="311" width="90" height="51" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="44" y="341" font-size="20" fill="#278278" text-anchor="start">C8</text><rect x="28" y="381" width="90" height="51" rx="13" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="44" y="411" font-size="20" fill="#278278" text-anchor="start">T1</text><rect x="276" y="153" width="167" height="207" rx="13" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="292" y="183" font-size="20" fill="#b17b30" text-anchor="start">Plexus</text><text x="292" y="209" font-size="16" fill="#64736c" text-anchor="start">Fibers mix,</text><text x="292" y="234" font-size="16" fill="#64736c" text-anchor="start">divide and</text><text x="292" y="259" font-size="16" fill="#64736c" text-anchor="start">recombine</text><rect x="556" y="123" width="137" height="65" rx="13" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="572" y="153" font-size="20" fill="#527da2" text-anchor="start">Nerve A</text><rect x="556" y="236" width="137" height="65" rx="13" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="572" y="266" font-size="20" fill="#527da2" text-anchor="start">Nerve B</text><rect x="556" y="349" width="137" height="65" rx="13" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="572" y="379" font-size="20" fill="#527da2" text-anchor="start">Nerve C</text><path d="M118 125L276 178" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 195L276 213" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 265L276 256" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 335L276 300" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 405L276 337" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M443 185L552 155" fill="none" stroke="#527da2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M443 247L552 268" fill="none" stroke="#527da2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M443 321L552 381" fill="none" stroke="#527da2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="469" font-size="17" fill="#64736c" text-anchor="start">Root: test the same myotome through different nerves.</text><text x="28" y="494" font-size="17" fill="#64736c" text-anchor="start">Nerve: test its muscles and cutaneous territory; branches matter.</text><path d="M28 524L692 524" fill="none" stroke="#d6dfd3" stroke-width="1" /><text x="28" y="547" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>