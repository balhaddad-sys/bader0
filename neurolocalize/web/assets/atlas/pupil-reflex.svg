<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img"><title>The pupillary light reflex</title><desc>Light in one eye constricts both pupils through a bilateral relay. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow-b17b30" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b17b30" stroke-width="1.3"/></marker><marker id="arrow-278278" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker></defs><rect width="720" height="640" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">The pupillary light reflex</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Light in one eye constricts both pupils through a bilateral relay.</text><rect x="130" y="282" width="460" height="112" rx="12" fill="#e5ece0"/><text x="146" y="302" font-size="11" fill="#64736c" text-anchor="start" font-weight="700">MIDBRAIN</text><circle cx="230" cy="130" r="32" fill="#ffffff" stroke="#173e39" stroke-width="2.5"/><circle cx="230" cy="112" r="9" fill="#173e39"/><text x="230" y="84" font-size="12" fill="#64736c" text-anchor="middle">Left eye</text><circle cx="490" cy="130" r="32" fill="#ffffff" stroke="#173e39" stroke-width="2.5"/><circle cx="490" cy="112" r="9" fill="#173e39"/><text x="490" y="84" font-size="12" fill="#64736c" text-anchor="middle">Right eye</text><path d="M230 162L360 216" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 162L360 216" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 216L300 262L330 312" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><path d="M360 216L420 262L390 312" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><text x="400" y="222" font-size="11" fill="#64736c" text-anchor="start">chiasm</text><circle cx="330" cy="320" r="10" fill="#b3c5b5"/><circle cx="390" cy="320" r="10" fill="#b3c5b5"/><text x="316" y="324" font-size="11" fill="#173e39" text-anchor="end">pretectal nuclei</text><path d="M330 330L336 368" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 330L384 368" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 330L336 368" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 330L384 368" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="336" cy="374" r="9" fill="#278278"/><circle cx="384" cy="374" r="9" fill="#278278"/><text x="360" y="412" font-size="11" fill="#278278" text-anchor="middle">Edinger–Westphal nuclei</text><path d="M328 378C250 400 168 330 172 200" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M392 378C470 400 552 330 548 200" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="172" cy="196" r="7" fill="#278278"/><circle cx="548" cy="196" r="7" fill="#278278"/><path d="M174 188L210 150" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><path d="M546 188L510 150" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="150" y="218" font-size="11" fill="#278278" text-anchor="end">ciliary</text><text x="150" y="233" font-size="11" fill="#278278" text-anchor="end">ganglion</text><text x="570" y="218" font-size="11" fill="#278278" text-anchor="start">ciliary</text><text x="570" y="233" font-size="11" fill="#278278" text-anchor="start">ganglion</text><text x="108" y="300" font-size="11" fill="#278278" text-anchor="middle">III nerve</text><text x="108" y="315" font-size="11" fill="#278278" text-anchor="middle">(parasym-</text><text x="108" y="330" font-size="11" fill="#278278" text-anchor="middle">pathetic)</text><path d="M40 440L70 440" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="445" font-size="13" fill="#64736c" text-anchor="start">afferent: optic nerve and tract</text><path d="M340 440L370 440" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="378" y="445" font-size="13" fill="#64736c" text-anchor="start">efferent: III nerve to the pupil</text><rect x="30" y="466" width="322" height="120" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="44" y="492" font-size="17" fill="#b17b30" text-anchor="start">Afferent defect</text><text x="44" y="517" font-size="14" fill="#64736c" text-anchor="start">e.g. optic nerve: pupils equal at</text><text x="44" y="536" font-size="14" fill="#64736c" text-anchor="start">rest; swinging light makes the</text><text x="44" y="555" font-size="14" fill="#64736c" text-anchor="start">affected side seem to dilate</text><rect x="368" y="466" width="322" height="120" rx="12" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="382" y="492" font-size="17" fill="#278278" text-anchor="start">Efferent defect</text><text x="382" y="517" font-size="14" fill="#64736c" text-anchor="start">e.g. third nerve: affected pupil</text><text x="382" y="536" font-size="14" fill="#64736c" text-anchor="start">larger and sluggish whichever</text><text x="382" y="555" font-size="14" fill="#64736c" text-anchor="start">eye is lit</text><path d="M28 604L692 604" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="627" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>