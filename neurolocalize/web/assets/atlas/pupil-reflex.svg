<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img"><title>The pupillary light reflex</title><desc>Light in one eye constricts both pupils through a bilateral relay. Original simplified teaching diagram; not to scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><radialGradient id="reef3eadce6d7" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#eef3ea"/><stop offset="1" stop-color="#dce6d7"/></radialGradient><radialGradient id="rffffffdde5db" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dde5db"/></radialGradient><marker id="arrow-b17b30" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M1.5 2.5L12 7L1.5 11.5L4 7Z" fill="#b17b30"/></marker><radialGradient id="rcad6cb8ca396" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#cad6cb"/><stop offset="1" stop-color="#8ca396"/></radialGradient><marker id="arrow-278278" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M1.5 2.5L12 7L1.5 11.5L4 7Z" fill="#278278"/></marker></defs><rect width="720" height="640" rx="14" fill="#fcfcf9"/><rect x=".5" y=".5" width="719" height="639" rx="13.5" fill="none" stroke="#dde3d8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="25" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.3">The pupillary light reflex</text><text x="28" y="66" font-size="14" fill="#64736c" text-anchor="start">Light in one eye constricts both pupils through a bilateral relay.</text><rect x="130" y="282" width="460" height="112" rx="40" fill="url(#reef3eadce6d7)"/><text x="574" y="302" font-size="11" fill="#64736c" text-anchor="end" font-weight="700" letter-spacing=".9">MIDBRAIN</text><circle cx="230" cy="130" r="32" fill="url(#rffffffdde5db)" stroke="#173e39" stroke-width="2.2"/><path d="M212.4 103.4Q230 84.6 247.6 103.4" fill="#e3eaf0" stroke="#173e39" stroke-width="1.6"/><ellipse cx="230" cy="110.8" rx="12.8" ry="5.44" fill="#f4efe0" stroke="#b3c5b5" stroke-width="1.2"/><path d="M203.8 146.0A30.4 30.4 0 0 0 256.2 146.0" fill="none" stroke="#c38383" stroke-width="2.4" stroke-opacity=".7"/><text x="274" y="134" font-size="12" fill="#64736c" text-anchor="start">Left eye</text><circle cx="490" cy="130" r="32" fill="url(#rffffffdde5db)" stroke="#173e39" stroke-width="2.2"/><path d="M472.4 103.4Q490 84.6 507.6 103.4" fill="#e3eaf0" stroke="#173e39" stroke-width="1.6"/><ellipse cx="490" cy="110.8" rx="12.8" ry="5.44" fill="#f4efe0" stroke="#b3c5b5" stroke-width="1.2"/><path d="M463.8 146.0A30.4 30.4 0 0 0 516.2 146.0" fill="none" stroke="#c38383" stroke-width="2.4" stroke-opacity=".7"/><text x="534" y="134" font-size="12" fill="#64736c" text-anchor="start">Right eye</text><path d="M230 162L360 216" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 162L360 216" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 162L360 216" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 162L360 216" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 216L300 262L330 312" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 216L300 262L330 312" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><path d="M360 216L420 262L390 312" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 216L420 262L390 312" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><text x="400" y="222" font-size="11" fill="#64736c" text-anchor="start">chiasm</text><circle cx="330" cy="320" r="10" fill="url(#rcad6cb8ca396)" stroke="#173e39" stroke-width="1"/><circle cx="390" cy="320" r="10" fill="url(#rcad6cb8ca396)" stroke="#173e39" stroke-width="1"/><text x="316" y="324" font-size="11" fill="#173e39" text-anchor="end">pretectal nuclei</text><path d="M330 330L336 368" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 330L384 368" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 330L336 368" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 330L384 368" fill="none" stroke="#b17b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="336" cy="374" r="9" fill="#278278"/><circle cx="384" cy="374" r="9" fill="#278278"/><text x="360" y="412" font-size="11" fill="#278278" text-anchor="middle">Edinger–Westphal nuclei</text><path d="M328 378C250 400 168 330 172 200" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M328 378C250 400 168 330 172 200" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M392 378C470 400 552 330 548 200" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M392 378C470 400 552 330 548 200" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="172" cy="196" r="7" fill="#278278"/><circle cx="548" cy="196" r="7" fill="#278278"/><path d="M174 188L210 150" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M174 188L210 150" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><path d="M546 188L510 150" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M546 188L510 150" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="150" y="218" font-size="11" fill="#278278" text-anchor="end">ciliary</text><text x="150" y="233" font-size="11" fill="#278278" text-anchor="end">ganglion</text><text x="570" y="218" font-size="11" fill="#278278" text-anchor="start">ciliary</text><text x="570" y="233" font-size="11" fill="#278278" text-anchor="start">ganglion</text><text x="108" y="300" font-size="11" fill="#278278" text-anchor="middle">III nerve</text><text x="108" y="315" font-size="11" fill="#278278" text-anchor="middle">(parasym-</text><text x="108" y="330" font-size="11" fill="#278278" text-anchor="middle">pathetic)</text><path d="M40 440L70 440" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 440L70 440" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="445" font-size="13" fill="#64736c" text-anchor="start">afferent: optic nerve and tract</text><path d="M340 440L370 440" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 440L370 440" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="378" y="445" font-size="13" fill="#64736c" text-anchor="start">efferent: III nerve to the pupil</text><rect x="30" y="466" width="322" height="120" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M38 466.6L344 466.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="490" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">AFFERENT DEFECT</text><text x="44" y="515" font-size="14" fill="#3b4c46" text-anchor="start">e.g. optic nerve: pupils equal at</text><text x="44" y="534" font-size="14" fill="#3b4c46" text-anchor="start">rest; swinging light makes the</text><text x="44" y="553" font-size="14" fill="#3b4c46" text-anchor="start">affected side seem to dilate</text><rect x="368" y="466" width="322" height="120" rx="8" fill="#ffffff" stroke="#9ec7c2" stroke-width="1"/><path d="M376 466.6L682 466.6" stroke="#278278" stroke-width="2.4" stroke-linecap="round"/><text x="382" y="490" font-size="12" fill="#278278" font-weight="700" letter-spacing="1.1">EFFERENT DEFECT</text><text x="382" y="515" font-size="14" fill="#3b4c46" text-anchor="start">e.g. third nerve: affected pupil</text><text x="382" y="534" font-size="14" fill="#3b4c46" text-anchor="start">larger and sluggish whichever</text><text x="382" y="553" font-size="14" fill="#3b4c46" text-anchor="start">eye is lit</text><path d="M28 604L692 604" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="627" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="627" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 30</text></g></svg>