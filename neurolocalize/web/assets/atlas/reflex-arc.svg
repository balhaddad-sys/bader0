<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>The stretch reflex arc</title><desc>Where a lesion sits decides whether reflexes fall or rise. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow-b17b30" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b17b30" stroke-width="1.3"/></marker><marker id="arrow-278278" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker><marker id="arrow-527da2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#527da2" stroke-width="1.3"/></marker></defs><rect width="720" height="620" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">The stretch reflex arc</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Where a lesion sits decides whether reflexes fall or rise.</text><ellipse cx="480" cy="210" rx="90" ry="76" fill="#e5ece0" stroke="#173e39" stroke-width="2.5"/><path d="M288 203C278 224 297 242 312 249C289 271 272 305 287 326L322 290L337 290L370 326C382 306 365 273 344 249C359 237 375 222 366 203L337 235L320 235Z" fill="#b3c5b5" transform="translate(480 210) scale(0.6000) translate(-327 -264)"/><text x="460" y="124" font-size="11" fill="#64736c" text-anchor="end">spinal cord (dorsal up)</text><ellipse cx="372" cy="168" rx="16" ry="11" fill="#e3cfb1" stroke="#b17b30" stroke-width="2"/><text x="372" y="146" font-size="11" fill="#b17b30" text-anchor="middle">dorsal root ganglion</text><rect x="50" y="266" width="180" height="62" rx="28" fill="#e3cfb1"/><ellipse cx="140" cy="297" rx="34" ry="10" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="140" y="350" font-size="12" fill="#173e39" text-anchor="middle">muscle with spindle</text><path d="M166 292C230 220 300 172 356 168" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M388 168C440 166 458 196 460 230" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><circle cx="462" cy="238" r="8" fill="#278278"/><path d="M454 244C400 290 310 300 236 300" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><path d="M500 92L500 140L470 228" fill="none" stroke="#527da2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-527da2)"/><text x="580" y="150" font-size="12" fill="#527da2" text-anchor="start">descending</text><text x="580" y="166" font-size="12" fill="#527da2" text-anchor="start">(upper motor</text><text x="580" y="182" font-size="12" fill="#527da2" text-anchor="start">neuron) control</text><text x="250" y="200" font-size="12" fill="#b17b30" text-anchor="start">sensory fiber</text><text x="300" y="318" font-size="12" fill="#278278" text-anchor="start">motor fiber</text><circle cx="290" cy="178" r="11" fill="#a34040"/><text x="290" y="182.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><circle cx="462" cy="262" r="11" fill="#a34040"/><text x="462" y="266.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><circle cx="270" cy="298" r="11" fill="#a34040"/><text x="270" y="302.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><circle cx="494" cy="150" r="11" fill="#a34040"/><text x="494" y="154.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><circle cx="46" cy="378" r="11" fill="#a34040"/><text x="46" y="382.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="66" y="383" font-size="15" fill="#173e39" text-anchor="start">Sensory fiber or ganglion</text><text x="330" y="383" font-size="14" fill="#b17b30" text-anchor="start">reflex reduced or lost</text><circle cx="46" cy="412" r="11" fill="#a34040"/><text x="46" y="416.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="66" y="417" font-size="15" fill="#173e39" text-anchor="start">Anterior horn or motor root</text><text x="330" y="417" font-size="14" fill="#b17b30" text-anchor="start">reduced, with wasting</text><circle cx="46" cy="446" r="11" fill="#a34040"/><text x="46" y="450.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="66" y="451" font-size="15" fill="#173e39" text-anchor="start">Peripheral nerve</text><text x="330" y="451" font-size="14" fill="#b17b30" text-anchor="start">reduced in its territory</text><circle cx="46" cy="480" r="11" fill="#a34040"/><text x="46" y="484.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="66" y="485" font-size="15" fill="#173e39" text-anchor="start">Descending pathway</text><text x="330" y="485" font-size="14" fill="#527da2" text-anchor="start">brisk, may spread</text><rect x="30" y="528" width="105.19999999999999" height="30" rx="15" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="82.6" y="548" font-size="13" fill="#278278" text-anchor="middle">Biceps C5–C6</text><rect x="143.2" y="528" width="150.79999999999998" height="30" rx="15" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="218.59999999999997" y="548" font-size="13" fill="#278278" text-anchor="middle">Brachioradialis C6</text><rect x="302.0" y="528" width="90.0" height="30" rx="15" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="347.0" y="548" font-size="13" fill="#278278" text-anchor="middle">Triceps C7</text><rect x="400.0" y="528" width="90.0" height="30" rx="15" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="445.0" y="548" font-size="13" fill="#278278" text-anchor="middle">Knee L3–L4</text><rect x="498.0" y="528" width="74.8" height="30" rx="15" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="535.4" y="548" font-size="13" fill="#278278" text-anchor="middle">Ankle S1</text><path d="M28 584L692 584" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="607" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>