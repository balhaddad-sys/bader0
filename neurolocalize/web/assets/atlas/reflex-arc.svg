 250Q66 297 60 344"/><path d="M69 250Q75 297 69 344"/><path d="M78 250Q84 297 78 344"/><path d="M87 250Q93 297 87 344"/><path d="M96 250Q102 297 96 344"/><path d="M105 250Q111 297 105 344"/><path d="M114 250Q120 297 114 344"/><path d="M123 250Q129 297 123 344"/><path d="M132 250Q138 297 132 344"/><path d="M141 250Q147 297 141 344"/><path d="M150 250Q156 297 150 344"/><path d="M159 250Q165 297 159 344"/><path d="M168 250Q174 297 168 344"/><path d="M177 250Q183 297 177 344"/><path d="M186 250Q192 297 186 344"/><path d="M195 250Q201 297 195 344"/><path d="M204 250Q210 297 204 344"/><path d="M213 250Q219 297 213 344"/><path d="M222 250Q228 297 222 344"/><path d="M231 250Q237 297 231 344"/></g><ellipse cx="140" cy="297" rx="36" ry="10" fill="#fff7ee" stroke="#b17b30" stroke-width="2"/><path d="M110 297C116 289 122 305 128 297C134 289 140 305 146 297C152 289 158 305 164 297C168 292 170 297 172 297" fill="none" stroke="#b17b30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="350" font-size="12" fill="#173e39" text-anchor="middle">muscle with spindle</text><path d="M166 292C230 220 300 172 356 168" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M166 292C230 220 300 172 356 168" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M388 168C440 166 458 196 460 230" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M388 168C440 166 458 196 460 230" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><circle cx="462" cy="238" r="8" fill="#278278"/><path d="M454 244C400 290 310 300 236 300" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M454 244C400 290 310 300 236 300" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><path d="M500 92L500 140L470 228" fill="none" stroke="#527da2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-527da2)"/><text x="580" y="150" font-size="12" fill="#527da2" text-anchor="start">descending</text><text x="580" y="166" font-size="12" fill="#527da2" text-anchor="start">(upper motor</text><text x="580" y="182" font-size="12" fill="#527da2" text-anchor="start">neuron) control</text><text x="250" y="200" font-size="12" fill="#b17b30" text-anchor="start">sensory fiber</text><text x="300" y="318" font-size="12" fill="#278278" text-anchor="start">motor fiber</text><circle cx="290" cy="178" r="11" fill="#a34040" stroke="#ffffff" stroke-width="2"/><text x="290" y="182.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><circle cx="462" cy="262" r="11" fill="#a34040" stroke="#ffffff" stroke-width="2"/><text x="462" y="266.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><circle cx="270" cy="298" r="11" fill="#a34040" stroke="#ffffff" stroke-width="2"/><text x="270" y="302.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><circle cx="494" cy="150" r="11" fill="#a34040" stroke="#ffffff" stroke-width="2"/><text x="494" y="154.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><circle cx="46" cy="378" r="11" fill="#a34040" stroke="#ffffff" stroke-width="2"/><text x="46" y="382.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="66" y="383" font-size="15" fill="#173e39" text-anchor="start">Sensory fiber or ganglion</text><text x="330" y="383" font-size="14" fill="#b17b30" text-anchor="start">reflex reduced or lost</text><circle cx="46" cy="412" r="11" fill="#a34040" stroke="#ffffff" stroke-width="2"/><text x="46" y="416.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="66" y="417" font-size="15" fill="#173e39" text-anchor="start">Anterior horn or motor root</text><text x="330" y="417" font-size="14" fill="#b17b30" text-anchor="start">reduced, with wasting</text><circle cx="46" cy="446" r="11" fill="#a34040" stroke="#ffffff" stroke-width="2"/><text x="46" y="450.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="66" y="451" font-size="15" fill="#173e39" text-anchor="start">Peripheral nerve</text><text x="330" y="451" font-size="14" fill="#b17b30" text-anchor="start">reduced in its territory</text><circle cx="46" cy="480" r="11" fill="#a34040" stroke="#ffffff" stroke-width="2"/><text x="46" y="484.32" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="66" y="485" font-size="15" fill="#173e39" text-anchor="start">Descending pathway</text><text x="330" y="485" font-size="14" fill="#527da2" text-anchor="start">brisk, may spread</text><rect x="30" y="528" width="105.19999999999999" height="30" rx="15" fill="#ffffff" stroke="#278278" stroke-width="1.2"/><text x="82.6" y="548" font-size="13" fill="#278278" text-anchor="middle">Biceps C5–C6</text><rect x="143.2" y="528" width="150.79999999999998" height="30" rx="15" fill="#ffffff" stroke="#278278" stroke-width="1.2"/><text x="218.59999999999997" y="548" font-size="13" fill="#278278" text-anchor="middle">Brachioradialis C6</text><rect x="302.0" y="528" width="90.0" height="30" rx="15" fill="#ffffff" stroke="#278278" stroke-width="1.2"/><text x="347.0" y="548" font-size="13" fill="#278278" text-anchor="middle">Triceps C7</text><rect x="400.0" y="528" width="90.0" height="30" rx="15" fill="#ffffff" stroke="#278278" stroke-width="1.2"/><text x="445.0" y="548" font-size="13" fill="#278278" text-anchor="middle">Knee L3–L4</text><rect x="498.0" y="528" width="74.8" height="30" rx="15" fill="#ffffff" stroke="#278278" stroke-width="1.2"/><text x="535.4" y="548" font-size="13" fill="#278278" text-anchor="middle">Ankle S1</text>