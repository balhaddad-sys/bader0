<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img"><title>Key root signatures</title><desc>Movement, reflex and sensory clues for commonly tested roots. Original simplified teaching diagram; not to scale.</desc><defs></defs><rect width="720" height="660" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Key root signatures</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Movement, reflex and sensory clues for commonly tested roots.</text><text x="44" y="104" font-size="12" fill="#64736c" text-anchor="start" font-weight="700">ROOT</text><text x="110" y="104" font-size="12" fill="#64736c" text-anchor="start" font-weight="700">MAIN MOVEMENT</text><text x="366" y="104" font-size="12" fill="#64736c" text-anchor="start" font-weight="700">REFLEX</text><text x="516" y="104" font-size="12" fill="#64736c" text-anchor="start" font-weight="700">SENSORY AREA</text><rect x="30" y="116" width="660" height="52" rx="8" fill="#ffffff"/><rect x="38" y="125" width="50" height="34" rx="17" fill="#278278"/><text x="63" y="148" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">C5</text><text x="110" y="138" font-size="14" fill="#173e39" text-anchor="start">Shoulder abduction,</text><text x="110" y="157" font-size="14" fill="#173e39" text-anchor="start">elbow flexion</text><text x="366" y="147" font-size="14" fill="#173e39" text-anchor="start">Biceps</text><text x="516" y="138" font-size="14" fill="#173e39" text-anchor="start">Lateral shoulder</text><text x="516" y="157" font-size="14" fill="#173e39" text-anchor="start">and upper arm</text><rect x="30" y="174" width="660" height="52" rx="8" fill="#e5ece0"/><rect x="38" y="183" width="50" height="34" rx="17" fill="#278278"/><text x="63" y="206" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">C6</text><text x="110" y="196" font-size="14" fill="#173e39" text-anchor="start">Wrist extension,</text><text x="110" y="215" font-size="14" fill="#173e39" text-anchor="start">elbow flexion</text><text x="366" y="196" font-size="14" fill="#173e39" text-anchor="start">Brachioradialis,</text><text x="366" y="215" font-size="14" fill="#173e39" text-anchor="start">biceps</text><text x="516" y="196" font-size="14" fill="#173e39" text-anchor="start">Thumb, lateral</text><text x="516" y="215" font-size="14" fill="#173e39" text-anchor="start">forearm</text><rect x="30" y="232" width="660" height="52" rx="8" fill="#ffffff"/><rect x="38" y="241" width="50" height="34" rx="17" fill="#278278"/><text x="63" y="264" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">C7</text><text x="110" y="254" font-size="14" fill="#173e39" text-anchor="start">Elbow, wrist and</text><text x="110" y="273" font-size="14" fill="#173e39" text-anchor="start">finger extension</text><text x="366" y="263" font-size="14" fill="#173e39" text-anchor="start">Triceps</text><text x="516" y="263" font-size="14" fill="#173e39" text-anchor="start">Middle finger</text><rect x="30" y="290" width="660" height="52" rx="8" fill="#e5ece0"/><rect x="38" y="299" width="50" height="34" rx="17" fill="#278278"/><text x="63" y="322" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">C8</text><text x="110" y="312" font-size="14" fill="#173e39" text-anchor="start">Finger flexion; hand</text><text x="110" y="331" font-size="14" fill="#173e39" text-anchor="start">muscles (with T1)</text><text x="366" y="321" font-size="14" fill="#173e39" text-anchor="start">None reliable</text><text x="516" y="312" font-size="14" fill="#173e39" text-anchor="start">Little finger,</text><text x="516" y="331" font-size="14" fill="#173e39" text-anchor="start">medial hand</text><rect x="30" y="348" width="660" height="52" rx="8" fill="#ffffff"/><rect x="38" y="357" width="50" height="34" rx="17" fill="#527da2"/><text x="63" y="380" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">L4</text><text x="110" y="370" font-size="14" fill="#173e39" text-anchor="start">Knee extension;</text><text x="110" y="389" font-size="14" fill="#173e39" text-anchor="start">ankle dorsiflexion</text><text x="366" y="379" font-size="14" fill="#173e39" text-anchor="start">Knee (L3–L4)</text><text x="516" y="379" font-size="14" fill="#173e39" text-anchor="start">Medial lower leg</text><rect x="30" y="406" width="660" height="52" rx="8" fill="#e5ece0"/><rect x="38" y="415" width="50" height="34" rx="17" fill="#527da2"/><text x="63" y="438" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">L5</text><text x="110" y="428" font-size="14" fill="#173e39" text-anchor="start">Great-toe extension,</text><text x="110" y="447" font-size="14" fill="#173e39" text-anchor="start">foot dorsiflexion, hip abd.</text><text x="366" y="437" font-size="14" fill="#173e39" text-anchor="start">None reliable</text><text x="516" y="428" font-size="14" fill="#173e39" text-anchor="start">Dorsum of foot,</text><text x="516" y="447" font-size="14" fill="#173e39" text-anchor="start">great toe</text><rect x="30" y="464" width="660" height="52" rx="8" fill="#ffffff"/><rect x="38" y="473" width="50" height="34" rx="17" fill="#527da2"/><text x="63" y="496" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">S1</text><text x="110" y="486" font-size="14" fill="#173e39" text-anchor="start">Ankle plantar flexion,</text><text x="110" y="505" font-size="14" fill="#173e39" text-anchor="start">foot eversion</text><text x="366" y="495" font-size="14" fill="#173e39" text-anchor="start">Ankle (Achilles)</text><text x="516" y="486" font-size="14" fill="#173e39" text-anchor="start">Lateral foot</text><text x="516" y="505" font-size="14" fill="#173e39" text-anchor="start">and sole</text><rect x="30" y="522" width="660" height="88" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="44" y="548" font-size="18" fill="#b17b30" text-anchor="start">Overlap is the rule.</text><text x="44" y="574" font-size="15" fill="#64736c" text-anchor="start">Territories vary between people. Compare muscles that share a root but</text><text x="44" y="594" font-size="15" fill="#64736c" text-anchor="start">use different nerves to separate a root from a nerve lesion.</text><path d="M28 624L692 624" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="647" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>