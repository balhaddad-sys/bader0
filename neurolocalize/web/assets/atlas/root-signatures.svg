<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img"><title>Key root signatures</title><desc>Movement, reflex and sensory clues for commonly tested roots. Original simplified teaching diagram; not to scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter></defs><rect width="720" height="660" rx="14" fill="#fcfcf9"/><rect x=".5" y=".5" width="719" height="659" rx="13.5" fill="none" stroke="#dde3d8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="25" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.3">Key root signatures</text><text x="28" y="66" font-size="14" fill="#64736c" text-anchor="start">Movement, reflex and sensory clues for commonly tested roots.</text><text x="44" y="104" font-size="12" fill="#64736c" text-anchor="start" font-weight="700" letter-spacing=".9">ROOT</text><text x="110" y="104" font-size="12" fill="#64736c" text-anchor="start" font-weight="700" letter-spacing=".9">MAIN MOVEMENT</text><text x="366" y="104" font-size="12" fill="#64736c" text-anchor="start" font-weight="700" letter-spacing=".9">REFLEX</text><text x="516" y="104" font-size="12" fill="#64736c" text-anchor="start" font-weight="700" letter-spacing=".9">SENSORY AREA</text><rect x="30" y="116" width="660" height="52" rx="8" fill="#ffffff"/><rect x="38" y="125" width="50" height="34" rx="17" fill="#278278"/><text x="63" y="148" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">C5</text><text x="110" y="138" font-size="14" fill="#173e39" text-anchor="start">Shoulder abduction,</text><text x="110" y="157" font-size="14" fill="#173e39" text-anchor="start">elbow flexion</text><text x="366" y="147" font-size="14" fill="#173e39" text-anchor="start">Biceps</text><text x="516" y="138" font-size="14" fill="#173e39" text-anchor="start">Lateral shoulder</text><text x="516" y="157" font-size="14" fill="#173e39" text-anchor="start">and upper arm</text><rect x="30" y="174" width="660" height="52" rx="8" fill="#e5ece0"/><rect x="38" y="183" width="50" height="34" rx="17" fill="#278278"/><text x="63" y="206" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">C6</text><text x="110" y="196" font-size="14" fill="#173e39" text-anchor="start">Wrist extension,</text><text x="110" y="215" font-size="14" fill="#173e39" text-anchor="start">elbow flexion</text><text x="366" y="196" font-size="14" fill="#173e39" text-anchor="start">Brachioradialis,</text><text x="366" y="215" font-size="14" fill="#173e39" text-anchor="start">biceps</text><text x="516" y="196" font-size="14" fill="#173e39" text-anchor="start">Thumb, lateral</text><text x="516" y="215" font-size="14" fill="#173e39" text-anchor="start">forearm</text><rect x="30" y="232" width="660" height="52" rx="8" fill="#ffffff"/><rect x="38" y="241" width="50" height="34" rx="17" fill="#278278"/><text x="63" y="264" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">C7</text><text x="110" y="254" font-size="14" fill="#173e39" text-anchor="start">Elbow, wrist and</text><text x="110" y="273" font-size="14" fill="#173e39" text-anchor="start">finger extension</text><text x="366" y="263" font-size="14" fill="#173e39" text-anchor="start">Triceps</text><text x="516" y="263" font-size="14" fill="#173e39" text-anchor="start">Middle finger</text><rect x="30" y="290" width="660" height="52" rx="8" fill="#e5ece0"/><rect x="38" y="299" width="50" height="34" rx="17" fill="#278278"/><text x="63" y="322" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">C8</text><text x="110" y="312" font-size="14" fill="#173e39" text-anchor="start">Finger flexion; hand</text><text x="110" y="331" font-size="14" fill="#173e39" text-anchor="start">muscles (with T1)</text><text x="366" y="321" font-size="14" fill="#173e39" text-anchor="start">None reliable</text><text x="516" y="312" font-size="14" fill="#173e39" text-anchor="start">Little finger,</text><text x="516" y="331" font-size="14" fill="#173e39" text-anchor="start">medial hand</text><rect x="30" y="348" width="660" height="52" rx="8" fill="#ffffff"/><rect x="38" y="357" width="50" height="34" rx="17" fill="#527da2"/><text x="63" y="380" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">L4</text><text x="110" y="370" font-size="14" fill="#173e39" text-anchor="start">Knee extension;</text><text x="110" y="389" font-size="14" fill="#173e39" text-anchor="start">ankle dorsiflexion</text><text x="366" y="379" font-size="14" fill="#173e39" text-anchor="start">Knee (L3–L4)</text><text x="516" y="379" font-size="14" fill="#173e39" text-anchor="start">Medial lower leg</text><rect x="30" y="406" width="660" height="52" rx="8" fill="#e5ece0"/><rect x="38" y="415" width="50" height="34" rx="17" fill="#527da2"/><text x="63" y="438" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">L5</text><text x="110" y="428" font-size="14" fill="#173e39" text-anchor="start">Great-toe extension,</text><text x="110" y="447" font-size="14" fill="#173e39" text-anchor="start">foot dorsiflexion, hip abd.</text><text x="366" y="437" font-size="14" fill="#173e39" text-anchor="start">None reliable</text><text x="516" y="428" font-size="14" fill="#173e39" text-anchor="start">Dorsum of foot,</text><text x="516" y="447" font-size="14" fill="#173e39" text-anchor="start">great toe</text><rect x="30" y="464" width="660" height="52" rx="8" fill="#ffffff"/><rect x="38" y="473" width="50" height="34" rx="17" fill="#527da2"/><text x="63" y="496" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">S1</text><text x="110" y="486" font-size="14" fill="#173e39" text-anchor="start">Ankle plantar flexion,</text><text x="110" y="505" font-size="14" fill="#173e39" text-anchor="start">foot eversion</text><text x="366" y="495" font-size="14" fill="#173e39" text-anchor="start">Ankle (Achilles)</text><text x="516" y="486" font-size="14" fill="#173e39" text-anchor="start">Lateral foot</text><text x="516" y="505" font-size="14" fill="#173e39" text-anchor="start">and sole</text><rect x="30" y="522" width="660" height="88" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M38 522.6L682 522.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="546" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">OVERLAP IS THE RULE.</text><text x="44" y="572" font-size="14" fill="#3b4c46" text-anchor="start">Territories vary between people. Compare muscles that share a root but</text><text x="44" y="591" font-size="14" fill="#3b4c46" text-anchor="start">use different nerves to separate a root from a nerve lesion.</text><path d="M28 624L692 624" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="647" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="647" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 23</text></g></svg>