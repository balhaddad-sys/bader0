<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>Two sensory systems, two crossings</title><desc>Both routes carry the right body to the left hemisphere. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow-b17b30" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b17b30" stroke-width="1.3"/></marker><marker id="arrow-527da2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#527da2" stroke-width="1.3"/></marker></defs><rect width="720" height="620" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Two sensory systems, two crossings</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Both routes carry the right body to the left hemisphere.</text><rect x="30" y="92" width="380" height="40" rx="8" fill="#ffffff"/><text x="40" y="117.0" font-size="13" fill="#64736c" text-anchor="start">Cortex (S1)</text><rect x="30" y="156" width="380" height="50" rx="8" fill="#ffffff"/><text x="40" y="186.0" font-size="13" fill="#64736c" text-anchor="start">Thalamus</text><rect x="30" y="236" width="380" height="60" rx="8" fill="#ffffff"/><text x="40" y="271.0" font-size="13" fill="#64736c" text-anchor="start">Medulla</text><rect x="30" y="322" width="380" height="156" rx="8" fill="#e5ece0"/><text x="40" y="405.0" font-size="13" fill="#64736c" text-anchor="start">Spinal cord</text><rect x="30" y="490" width="380" height="38" rx="8" fill="#ffffff"/><text x="40" y="514.0" font-size="13" fill="#64736c" text-anchor="start">Right body</text><path d="M260 86L260 534" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="214" y="548" font-size="11" fill="#64736c" text-anchor="middle">LEFT</text><text x="306" y="548" font-size="11" fill="#64736c" text-anchor="middle">RIGHT</text><path d="M340 510L340 262L215 248L215 182L222 118" fill="none" stroke="#b17b30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><path d="M385 510L385 462L180 446L180 182L198 118" fill="none" stroke="#527da2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-527da2)"/><circle cx="340" cy="262" r="7" fill="#b17b30"/><circle cx="385" cy="462" r="7" fill="#527da2"/><ellipse cx="205" cy="182" rx="28" ry="14" fill="#b3c5b5"/><text x="205" y="187" font-size="11" fill="#173e39" text-anchor="middle">VPL</text><rect x="430" y="100" width="260" height="160" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="444" y="126" font-size="17" fill="#b17b30" text-anchor="start">Dorsal columns</text><text x="444" y="151" font-size="14" fill="#64736c" text-anchor="start">(medial lemniscus)</text><text x="444" y="170" font-size="14" fill="#64736c" text-anchor="start">Vibration, joint position,</text><text x="444" y="189" font-size="14" fill="#64736c" text-anchor="start">discriminative touch.</text><text x="444" y="208" font-size="14" fill="#64736c" text-anchor="start">Crosses in the medulla.</text><rect x="430" y="276" width="260" height="160" rx="12" fill="#ffffff" stroke="#527da2" stroke-width="2"/><text x="444" y="302" font-size="17" fill="#527da2" text-anchor="start">Spinothalamic</text><text x="444" y="327" font-size="14" fill="#64736c" text-anchor="start">(anterolateral) tract</text><text x="444" y="346" font-size="14" fill="#64736c" text-anchor="start">Pain and temperature.</text><text x="444" y="365" font-size="14" fill="#64736c" text-anchor="start">Crosses within a few</text><text x="444" y="384" font-size="14" fill="#64736c" text-anchor="start">segments of entry.</text><rect x="430" y="452" width="260" height="78" rx="12" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="444" y="476" font-size="14" fill="#278278" text-anchor="start">A one-sided cord lesion</text><text x="444" y="495" font-size="14" fill="#278278" text-anchor="start">splits the modalities; above</text><text x="444" y="514" font-size="14" fill="#278278" text-anchor="start">the medulla both are crossed.</text><text x="40" y="568" font-size="13" fill="#64736c" text-anchor="start">Dots mark where each pathway crosses the midline.</text><path d="M28 584L692 584" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="607" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>