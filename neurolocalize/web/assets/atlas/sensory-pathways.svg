<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>Two sensory systems, two crossings</title><desc>Both routes carry the right body to the left hemisphere. Original simplified teaching diagram; not to scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><marker id="arrow-b17b30" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M1.5 2.5L12 7L1.5 11.5L4 7Z" fill="#b17b30"/></marker><marker id="arrow-527da2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M1.5 2.5L12 7L1.5 11.5L4 7Z" fill="#527da2"/></marker></defs><rect width="720" height="620" rx="14" fill="#fcfcf9"/><rect x=".5" y=".5" width="719" height="619" rx="13.5" fill="none" stroke="#dde3d8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="25" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.3">Two sensory systems, two crossings</text><text x="28" y="66" font-size="14" fill="#64736c" text-anchor="start">Both routes carry the right body to the left hemisphere.</text><rect x="30" y="92" width="380" height="40" rx="8" fill="#ffffff"/><text x="40" y="117.0" font-size="13" fill="#64736c" text-anchor="start">Cortex (S1)</text><rect x="30" y="156" width="380" height="50" rx="8" fill="#ffffff"/><text x="40" y="186.0" font-size="13" fill="#64736c" text-anchor="start">Thalamus</text><rect x="30" y="236" width="380" height="60" rx="8" fill="#ffffff"/><text x="40" y="271.0" font-size="13" fill="#64736c" text-anchor="start">Medulla</text><rect x="30" y="322" width="380" height="156" rx="8" fill="#e5ece0"/><text x="40" y="405.0" font-size="13" fill="#64736c" text-anchor="start">Spinal cord</text><rect x="30" y="490" width="380" height="38" rx="8" fill="#ffffff"/><text x="40" y="514.0" font-size="13" fill="#64736c" text-anchor="start">Right body</text><path d="M260 86L260 534" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="214" y="548" font-size="11" fill="#64736c" text-anchor="middle">LEFT</text><text x="306" y="548" font-size="11" fill="#64736c" text-anchor="middle">RIGHT</text><path d="M340 510L340 262L215 248L215 182L222 118" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 510L340 262L215 248L215 182L222 118" fill="none" stroke="#b17b30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><path d="M385 510L385 462L180 446L180 182L198 118" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M385 510L385 462L180 446L180 182L198 118" fill="none" stroke="#527da2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-527da2)"/><circle cx="340" cy="262" r="7" fill="#b17b30"/><circle cx="385" cy="462" r="7" fill="#527da2"/><ellipse cx="205" cy="182" rx="28" ry="14" fill="#b3c5b5"/><text x="205" y="187" font-size="11" fill="#173e39" text-anchor="middle">VPL</text><rect x="430" y="100" width="260" height="160" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M438 100.6L682 100.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="444" y="124" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">DORSAL COLUMNS</text><text x="444" y="149" font-size="14" fill="#3b4c46" text-anchor="start">(medial lemniscus)</text><text x="444" y="168" font-size="14" fill="#3b4c46" text-anchor="start">Vibration, joint position,</text><text x="444" y="187" font-size="14" fill="#3b4c46" text-anchor="start">discriminative touch.</text><text x="444" y="206" font-size="14" fill="#3b4c46" text-anchor="start">Crosses in the medulla.</text><rect x="430" y="276" width="260" height="160" rx="8" fill="#ffffff" stroke="#b1c4d5" stroke-width="1"/><path d="M438 276.6L682 276.6" stroke="#527da2" stroke-width="2.4" stroke-linecap="round"/><text x="444" y="300" font-size="12" fill="#527da2" font-weight="700" letter-spacing="1.1">SPINOTHALAMIC</text><text x="444" y="325" font-size="14" fill="#3b4c46" text-anchor="start">(anterolateral) tract</text><text x="444" y="344" font-size="14" fill="#3b4c46" text-anchor="start">Pain and temperature.</text><text x="444" y="363" font-size="14" fill="#3b4c46" text-anchor="start">Crosses within a few</text><text x="444" y="382" font-size="14" fill="#3b4c46" text-anchor="start">segments of entry.</text><rect x="430" y="452" width="260" height="78" rx="12" fill="#ffffff" stroke="#278278" stroke-width="1.2"/><text x="444" y="476" font-size="14" fill="#278278" text-anchor="start">A one-sided cord lesion</text><text x="444" y="495" font-size="14" fill="#278278" text-anchor="start">splits the modalities; above</text><text x="444" y="514" font-size="14" fill="#278278" text-anchor="start">the medulla both are crossed.</text><text x="40" y="568" font-size="13" fill="#64736c" text-anchor="start">Dots mark where each pathway crosses the midline.</text><path d="M28 584L692 584" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="607" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="607" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 22</text></g></svg>