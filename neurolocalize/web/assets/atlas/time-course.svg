<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>The time course hints at mechanism</title><desc>How a deficit evolves suggests a process; location still comes first. Original simplified teaching diagram; not to scale.</desc><defs></defs><rect width="720" height="600" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">The time course hints at mechanism</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">How a deficit evolves suggests a process; location still comes first.</text><rect x="30" y="92" width="322" height="210" rx="12" fill="#ffffff" stroke="#d6dfd3" stroke-width="2"/><text x="46" y="120" font-size="17" fill="#a34040" text-anchor="start">Sudden</text><text x="46" y="140" font-size="12" fill="#64736c" text-anchor="start">seconds to minutes</text><path d="M46 154L46 232L336 232" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 230L106 230L112 162L336 166" fill="none" stroke="#a34040" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="336" y="246" font-size="11" fill="#64736c" text-anchor="end">time →</text><text x="46" y="268" font-size="14" fill="#173e39" text-anchor="start">Vascular events, seizures,</text><text x="46" y="287" font-size="14" fill="#173e39" text-anchor="start">trauma</text><rect x="368" y="92" width="322" height="210" rx="12" fill="#ffffff" stroke="#d6dfd3" stroke-width="2"/><text x="384" y="120" font-size="17" fill="#b17b30" text-anchor="start">Acute to subacute</text><text x="384" y="140" font-size="12" fill="#64736c" text-anchor="start">hours to weeks</text><path d="M384 154L384 232L674 232" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M384 230L424 230C494 228 524 164 584 164L674 168" fill="none" stroke="#b17b30" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="674" y="246" font-size="11" fill="#64736c" text-anchor="end">time →</text><text x="384" y="268" font-size="14" fill="#173e39" text-anchor="start">Inflammatory, infectious,</text><text x="384" y="287" font-size="14" fill="#173e39" text-anchor="start">toxic-metabolic, demyelinating</text><rect x="30" y="316" width="322" height="210" rx="12" fill="#ffffff" stroke="#d6dfd3" stroke-width="2"/><text x="46" y="344" font-size="17" fill="#527da2" text-anchor="start">Chronic progressive</text><text x="46" y="364" font-size="12" fill="#64736c" text-anchor="start">months to years</text><path d="M46 378L46 456L336 456" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 454C166 448 266 418 336 386" fill="none" stroke="#527da2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="336" y="470" font-size="11" fill="#64736c" text-anchor="end">time →</text><text x="46" y="492" font-size="14" fill="#173e39" text-anchor="start">Degenerative, neoplastic,</text><text x="46" y="511" font-size="14" fill="#173e39" text-anchor="start">genetic</text><rect x="368" y="316" width="322" height="210" rx="12" fill="#ffffff" stroke="#d6dfd3" stroke-width="2"/><text x="384" y="344" font-size="17" fill="#278278" text-anchor="start">Episodic or relapsing</text><text x="384" y="364" font-size="12" fill="#64736c" text-anchor="start">attacks with recovery</text><path d="M384 378L384 456L674 456" fill="none" stroke="#b3c5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M384 454L414 454L424 392L454 452L504 454L514 384L549 448L594 450L604 388L644 442L674 444" fill="none" stroke="#278278" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="674" y="470" font-size="11" fill="#64736c" text-anchor="end">time →</text><text x="384" y="492" font-size="14" fill="#173e39" text-anchor="start">Migraine, seizures, transient</text><text x="384" y="511" font-size="14" fill="#173e39" text-anchor="start">ischemia, relapsing inflammation</text><text x="40" y="556" font-size="14" fill="#b17b30" text-anchor="start">Typical tendencies only: many conditions break these rules.</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>