<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>Upper or lower motor neuron?</title><desc>The pattern of signs points to one half of the motor pathway. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow-278278" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker><marker id="arrow-b17b30" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b17b30" stroke-width="1.3"/></marker></defs><rect width="720" height="600" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Upper or lower motor neuron?</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">The pattern of signs points to one half of the motor pathway.</text><rect x="40" y="100" width="150" height="54" rx="12" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="115" y="133" font-size="16" fill="#278278" text-anchor="middle">Motor cortex</text><path d="M115 154L115 196" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="127" y="180" font-size="13" fill="#64736c" text-anchor="start">tract</text><rect x="52" y="196" width="126" height="38" rx="12" fill="#e5ece0" stroke="#278278" stroke-width="2"/><text x="115" y="221" font-size="14" fill="#278278" text-anchor="middle">Brainstem / cord</text><path d="M115 234L115 266" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><circle cx="115" cy="288" r="18" fill="#b17b30"/><text x="141" y="284" font-size="13" fill="#b17b30" text-anchor="start">Anterior</text><text x="141" y="300" font-size="13" fill="#b17b30" text-anchor="start">horn cell</text><path d="M115 306L115 348" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="127" y="334" font-size="13" fill="#b17b30" text-anchor="start">root / nerve</text><path d="M115 348L115 362" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><rect x="60" y="368" width="110" height="34" rx="17" fill="#e3cfb1"/><text x="115" y="390" font-size="15" fill="#173e39" text-anchor="middle">Muscle</text><path d="M34 104L26 104L26 262L34 262" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="183" font-size="14" fill="#278278" text-anchor="middle" transform="rotate(-90 18 183)">UPPER</text><path d="M34 272L26 272L26 400L34 400" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="336" font-size="14" fill="#b17b30" text-anchor="middle" transform="rotate(-90 18 336)">LOWER</text><text x="228" y="114" font-size="12" fill="#64736c" text-anchor="start" font-weight="700">SIGN</text><text x="370" y="114" font-size="12" fill="#278278" text-anchor="start" font-weight="700">UPPER MOTOR NEURON</text><text x="532" y="114" font-size="12" fill="#b17b30" text-anchor="start" font-weight="700">LOWER MOTOR NEURON</text><rect x="220" y="130" width="470" height="44" rx="8" fill="#ffffff"/><text x="232" y="158" font-size="15" fill="#173e39" text-anchor="start">Tone</text><text x="370" y="158" font-size="15" fill="#278278" text-anchor="start">Increased, spastic</text><text x="532" y="158" font-size="15" fill="#b17b30" text-anchor="start">Reduced, flaccid</text><rect x="220" y="180" width="470" height="44" rx="8" fill="#e5ece0"/><text x="232" y="208" font-size="15" fill="#173e39" text-anchor="start">Reflexes</text><text x="370" y="208" font-size="15" fill="#278278" text-anchor="start">Brisk, may spread</text><text x="532" y="208" font-size="15" fill="#b17b30" text-anchor="start">Reduced or absent</text><rect x="220" y="230" width="470" height="44" rx="8" fill="#ffffff"/><text x="232" y="258" font-size="15" fill="#173e39" text-anchor="start">Plantar</text><text x="370" y="258" font-size="15" fill="#278278" text-anchor="start">Extensor</text><text x="532" y="258" font-size="15" fill="#b17b30" text-anchor="start">Flexor</text><rect x="220" y="280" width="470" height="44" rx="8" fill="#e5ece0"/><text x="232" y="308" font-size="15" fill="#173e39" text-anchor="start">Wasting</text><text x="370" y="308" font-size="15" fill="#278278" text-anchor="start">Mild and late</text><text x="532" y="308" font-size="15" fill="#b17b30" text-anchor="start">Often prominent</text><rect x="220" y="330" width="470" height="44" rx="8" fill="#ffffff"/><text x="232" y="358" font-size="15" fill="#173e39" text-anchor="start">Fasciculation</text><text x="370" y="358" font-size="15" fill="#278278" text-anchor="start">Absent</text><text x="532" y="358" font-size="15" fill="#b17b30" text-anchor="start">May be present</text><rect x="220" y="380" width="470" height="44" rx="8" fill="#e5ece0"/><text x="232" y="408" font-size="15" fill="#173e39" text-anchor="start">Weak groups</text><text x="370" y="408" font-size="15" fill="#278278" text-anchor="start">Pyramidal pattern</text><text x="532" y="408" font-size="15" fill="#b17b30" text-anchor="start">Root or nerve pattern</text><rect x="30" y="440" width="660" height="110" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="44" y="466" font-size="18" fill="#b17b30" text-anchor="start">Read the signs together.</text><text x="44" y="492" font-size="15" fill="#64736c" text-anchor="start">An acute central lesion can be flaccid with low reflexes at first.</text><text x="44" y="512" font-size="15" fill="#64736c" text-anchor="start">UMN signs below a level plus LMN signs at it suggest the cord;</text><text x="44" y="532" font-size="15" fill="#64736c" text-anchor="start">widespread mixed signs raise motor neuron disease.</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>