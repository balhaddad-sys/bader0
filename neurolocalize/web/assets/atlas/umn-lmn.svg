<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img"><title>Upper or lower motor neuron?</title><desc>The pattern of signs points to one half of the motor pathway. Original simplified teaching diagram; not to scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9f9f4"/><stop offset="1" stop-color="#eef1e8"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f9faf6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#d3dbcf"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173e39" flood-opacity=".09"/></filter><filter id="lift" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#173e39" flood-opacity=".22"/></filter><marker id="arrow-278278" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M1.5 2.5L12 7L1.5 11.5L4 7Z" fill="#278278"/></marker><marker id="arrow-b17b30" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M1.5 2.5L12 7L1.5 11.5L4 7Z" fill="#b17b30"/></marker></defs><rect width="720" height="600" rx="14" fill="#fcfcf9"/><rect x=".5" y=".5" width="719" height="599" rx="13.5" fill="none" stroke="#dde3d8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="40" font-size="25" fill="#173e39" font-family="Georgia,'Times New Roman',serif" letter-spacing="-.3">Upper or lower motor neuron?</text><text x="28" y="66" font-size="14" fill="#64736c" text-anchor="start">The pattern of signs points to one half of the motor pathway.</text><rect x="40" y="100" width="150" height="54" rx="12" fill="#ffffff" stroke="#278278" stroke-width="1.2"/><text x="115" y="133" font-size="16" fill="#278278" text-anchor="middle">Motor cortex</text><path d="M115 154L115 196" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 154L115 196" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="127" y="180" font-size="13" fill="#64736c" text-anchor="start">tract</text><rect x="52" y="196" width="126" height="38" rx="12" fill="#e5ece0" stroke="#278278" stroke-width="1.2"/><text x="115" y="221" font-size="14" fill="#278278" text-anchor="middle">Brainstem / cord</text><path d="M115 234L115 266" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 234L115 266" fill="none" stroke="#278278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><circle cx="115" cy="288" r="18" fill="#b17b30"/><text x="141" y="284" font-size="13" fill="#b17b30" text-anchor="start">Anterior</text><text x="141" y="300" font-size="13" fill="#b17b30" text-anchor="start">horn cell</text><path d="M115 306L115 348" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 306L115 348" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="127" y="334" font-size="13" fill="#b17b30" text-anchor="start">root / nerve</text><path d="M115 348L115 362" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 348L115 362" fill="none" stroke="#b17b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><rect x="60" y="368" width="110" height="34" rx="17" fill="#e3cfb1"/><text x="115" y="390" font-size="15" fill="#173e39" text-anchor="middle">Muscle</text><path d="M34 104L26 104L26 262L34 262" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 104L26 104L26 262L34 262" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="183" font-size="14" fill="#278278" text-anchor="middle" transform="rotate(-90 18 183)">UPPER</text><path d="M34 272L26 272L26 400L34 400" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 272L26 272L26 400L34 400" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="336" font-size="14" fill="#b17b30" text-anchor="middle" transform="rotate(-90 18 336)">LOWER</text><text x="228" y="114" font-size="12" fill="#64736c" text-anchor="start" font-weight="700" letter-spacing=".9">SIGN</text><text x="362" y="114" font-size="11" fill="#278278" text-anchor="start" font-weight="700" letter-spacing=".9">UPPER MOTOR NEURON</text><text x="526" y="114" font-size="11" fill="#b17b30" text-anchor="start" font-weight="700" letter-spacing=".9">LOWER MOTOR NEURON</text><rect x="220" y="130" width="470" height="44" rx="8" fill="#ffffff"/><text x="232" y="158" font-size="15" fill="#173e39" text-anchor="start">Tone</text><text x="362" y="158" font-size="15" fill="#278278" text-anchor="start">Increased, spastic</text><text x="526" y="158" font-size="15" fill="#b17b30" text-anchor="start">Reduced, flaccid</text><rect x="220" y="180" width="470" height="44" rx="8" fill="#e5ece0"/><text x="232" y="208" font-size="15" fill="#173e39" text-anchor="start">Reflexes</text><text x="362" y="208" font-size="15" fill="#278278" text-anchor="start">Brisk, may spread</text><text x="526" y="208" font-size="15" fill="#b17b30" text-anchor="start">Reduced or absent</text><rect x="220" y="230" width="470" height="44" rx="8" fill="#ffffff"/><text x="232" y="258" font-size="15" fill="#173e39" text-anchor="start">Plantar</text><text x="362" y="258" font-size="15" fill="#278278" text-anchor="start">Extensor</text><text x="526" y="258" font-size="15" fill="#b17b30" text-anchor="start">Flexor</text><rect x="220" y="280" width="470" height="44" rx="8" fill="#e5ece0"/><text x="232" y="308" font-size="15" fill="#173e39" text-anchor="start">Wasting</text><text x="362" y="308" font-size="15" fill="#278278" text-anchor="start">Mild and late</text><text x="526" y="308" font-size="15" fill="#b17b30" text-anchor="start">Often prominent</text><rect x="220" y="330" width="470" height="44" rx="8" fill="#ffffff"/><text x="232" y="358" font-size="15" fill="#173e39" text-anchor="start">Fasciculation</text><text x="362" y="358" font-size="15" fill="#278278" text-anchor="start">Absent</text><text x="526" y="358" font-size="15" fill="#b17b30" text-anchor="start">May be present</text><rect x="220" y="380" width="470" height="44" rx="8" fill="#e5ece0"/><text x="232" y="408" font-size="15" fill="#173e39" text-anchor="start">Weak groups</text><text x="362" y="408" font-size="15" fill="#278278" text-anchor="start">Pyramidal pattern</text><text x="526" y="408" font-size="15" fill="#b17b30" text-anchor="start">Root or nerve pattern</text><rect x="30" y="440" width="660" height="110" rx="8" fill="#ffffff" stroke="#dcc4a2" stroke-width="1"/><path d="M38 440.6L682 440.6" stroke="#b17b30" stroke-width="2.4" stroke-linecap="round"/><text x="44" y="464" font-size="12" fill="#b17b30" font-weight="700" letter-spacing="1.1">READ THE SIGNS TOGETHER.</text><text x="44" y="490" font-size="14" fill="#3b4c46" text-anchor="start">An acute central lesion can be flaccid with low reflexes at first.</text><text x="44" y="509" font-size="14" fill="#3b4c46" text-anchor="start">UMN signs below a level plus LMN signs at it suggest the cord;</text><text x="44" y="528" font-size="14" fill="#3b4c46" text-anchor="start">widespread mixed signs raise motor neuron disease.</text><path d="M28 564L692 564" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="587" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE ATLAS  ·  SCHEMATIC, NOT TO SCALE</text><text x="692" y="587" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 12</text></g></svg>