text x="28" y="607" font-size="11" fill="#64736c" letter-spacing="1.2">NEUROLOCALIZE  ·  ORIGINAL SCHEMATIC  ·  NOT TO SCALE</text><text x="692" y="607" font-size="11" fill="#278278" text-anchor="end" letter-spacing="1.2" font-weight="700">FIG. 15</text></g></svg>