<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img"><title>Cortical arterial territories</title><desc>Approximate surface supply of the three cerebral arteries. Original simplified teaching diagram; not to scale.</desc><defs><clipPath id="clip1"><path d="M46 260C46 150 136 132 206 134C296 136 352 190 348 266C346 324 306 346 256 344C206 352 156 370 116 344C76 324 46 310 46 260Z"/></clipPath><clipPath id="clip2"><path d="M380 260C380 150 470 132 540 134C630 136 686 190 682 266C680 324 640 346 590 344C540 352 490 370 450 344C410 324 380 310 380 260Z"/></clipPath></defs><rect width="720" height="620" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">Cortical arterial territories</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Approximate surface supply of the three cerebral arteries.</text><text x="196" y="104" font-size="12" fill="#64736c" text-anchor="middle" font-weight="700">LATERAL SURFACE</text><path d="M46 260C46 150 136 132 206 134C296 136 352 190 348 266C346 324 306 346 256 344C206 352 156 370 116 344C76 324 46 310 46 260Z" fill="#ffffff"/><g fill="#a9d1c9" clip-path="url(#clip1)"><rect x="36" y="120" width="330" height="260"/></g><g fill="#e6cfa6" clip-path="url(#clip1)"><path d="M36 120L286 120L286 164C216 168 136 166 36 190Z"/></g><g fill="#b4c8db" clip-path="url(#clip1)"><path d="M292 120L366 120L366 380L136 380C176 326 256 322 296 290C308 240 300 170 292 120Z"/></g><path d="M46 260C46 150 136 132 206 134C296 136 352 190 348 266C346 324 306 346 256 344C206 352 156 370 116 344C76 324 46 310 46 260Z" fill="none" stroke="#173e39" stroke-width="3"/><text x="46" y="394" font-size="12" fill="#64736c" text-anchor="start">front</text><text x="346" y="394" font-size="12" fill="#64736c" text-anchor="end">back</text><text x="530" y="104" font-size="12" fill="#64736c" text-anchor="middle" font-weight="700">MEDIAL SURFACE</text><path d="M380 260C380 150 470 132 540 134C630 136 686 190 682 266C680 324 640 346 590 344C540 352 490 370 450 344C410 324 380 310 380 260Z" fill="#ffffff"/><g fill="#e6cfa6" clip-path="url(#clip2)"><rect x="370" y="120" width="330" height="260"/></g><g fill="#b4c8db" clip-path="url(#clip2)"><path d="M570 120L700 120L700 380L430 380C490 300 550 280 590 230C594 180 580 150 570 120Z"/></g><path d="M460 264C460 220 580 214 590 260C570 238 480 240 460 264Z" fill="#e5ece0" stroke="#173e39" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="524" y="292" font-size="11" fill="#173e39" text-anchor="middle">corpus callosum</text><path d="M380 260C380 150 470 132 540 134C630 136 686 190 682 266C680 324 640 346 590 344C540 352 490 370 450 344C410 324 380 310 380 260Z" fill="none" stroke="#173e39" stroke-width="3"/><text x="380" y="394" font-size="12" fill="#64736c" text-anchor="start">front</text><text x="680" y="394" font-size="12" fill="#64736c" text-anchor="end">back</text><rect x="40" y="426" width="22" height="22" rx="5" fill="#a9d1c9" stroke="#278278" stroke-width="1.5"/><text x="74" y="442" font-size="15" fill="#173e39" text-anchor="start">Middle cerebral (MCA)</text><text x="300" y="434" font-size="13" fill="#64736c" text-anchor="start">Lateral convexity: opposite face and arm</text><text x="300" y="452" font-size="13" fill="#64736c" text-anchor="start">&gt; leg; language (dominant) or neglect.</text><rect x="40" y="480" width="22" height="22" rx="5" fill="#e6cfa6" stroke="#b17b30" stroke-width="1.5"/><text x="74" y="496" font-size="15" fill="#173e39" text-anchor="start">Anterior cerebral (ACA)</text><text x="300" y="488" font-size="13" fill="#64736c" text-anchor="start">Medial frontal/parietal strip: opposite</text><text x="300" y="506" font-size="13" fill="#64736c" text-anchor="start">leg &gt; arm weakness and sensory loss.</text><rect x="40" y="534" width="22" height="22" rx="5" fill="#b4c8db" stroke="#527da2" stroke-width="1.5"/><text x="74" y="550" font-size="15" fill="#173e39" text-anchor="start">Posterior cerebral (PCA)</text><text x="300" y="542" font-size="13" fill="#64736c" text-anchor="start">Occipital and inferior temporal: opposite</text><text x="300" y="560" font-size="13" fill="#64736c" text-anchor="start">homonymous hemianopia.</text><path d="M28 584L692 584" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="607" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>