<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img"><title>A first pass through weakness</title><desc>Two questions split the neuraxis before you name a region. Original simplified teaching diagram; not to scale.</desc><defs><marker id="arrow-173e39" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#173e39" stroke-width="1.3"/></marker><marker id="arrow-278278" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#278278" stroke-width="1.3"/></marker><marker id="arrow-b17b30" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b17b30" stroke-width="1.3"/></marker></defs><rect width="720" height="640" rx="18" fill="#f4f5ee"/><g font-family="Arial,sans-serif"><text x="28" y="39" font-size="25" fill="#173e39" text-anchor="start">A first pass through weakness</text><text x="28" y="68" font-size="15" fill="#64736c" text-anchor="start">Two questions split the neuraxis before you name a region.</text><rect x="280" y="86" width="160" height="34" rx="17" fill="#173e39"/><text x="360" y="108" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Weakness</text><path d="M360 120L360 140" fill="none" stroke="#173e39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-173e39)"/><rect x="200" y="144" width="320" height="40" rx="20" fill="#ffffff" stroke="#173e39" stroke-width="2"/><text x="360" y="170" font-size="16" fill="#173e39" text-anchor="middle">Upper motor neuron signs?</text><path d="M260 184C240 204 200 206 190 222" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><path d="M460 184C480 204 520 206 530 222" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><text x="206" y="204" font-size="13" fill="#278278" text-anchor="end">yes</text><text x="514" y="204" font-size="13" fill="#b17b30" text-anchor="start">no</text><rect x="65" y="226" width="250" height="38" rx="19" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="190" y="251" font-size="15" fill="#278278" text-anchor="middle">Face weak as well?</text><rect x="405" y="226" width="250" height="38" rx="19" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="530" y="251" font-size="15" fill="#b17b30" text-anchor="middle">Sensory loss too?</text><path d="M190 264L190 290" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="198" y="282" font-size="12" fill="#278278" text-anchor="start">yes</text><rect x="46.0" y="294" width="288" height="82" rx="12" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="60.0" y="318" font-size="16" fill="#278278" text-anchor="start">Brain or brainstem</text><text x="60.0" y="340" font-size="13" fill="#64736c" text-anchor="start">Cortical signs → cortex</text><text x="60.0" y="358" font-size="13" fill="#64736c" text-anchor="start">Crossed cranial signs → brainstem</text><path d="M65 245L36 245L36 438L44 438" fill="none" stroke="#278278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-278278)"/><text x="42" y="236" font-size="12" fill="#278278" text-anchor="start">no</text><rect x="46.0" y="398" width="288" height="82" rx="12" fill="#ffffff" stroke="#278278" stroke-width="2"/><text x="60.0" y="422" font-size="16" fill="#278278" text-anchor="start">Spinal cord most likely</text><text x="60.0" y="444" font-size="13" fill="#64736c" text-anchor="start">Seek a sensory level; leg-only</text><text x="60.0" y="462" font-size="13" fill="#64736c" text-anchor="start">weakness can be parasagittal</text><path d="M530 264L530 290" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><text x="538" y="282" font-size="12" fill="#b17b30" text-anchor="start">yes</text><rect x="386.0" y="294" width="288" height="82" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="400.0" y="318" font-size="16" fill="#b17b30" text-anchor="start">Root, plexus or nerve</text><text x="400.0" y="340" font-size="13" fill="#64736c" text-anchor="start">Strip → root · one nerve → mono-</text><text x="400.0" y="358" font-size="13" fill="#64736c" text-anchor="start">neuropathy · distal → polyneuropathy</text><path d="M655 245L684 245L684 438L676 438" fill="none" stroke="#b17b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b17b30)"/><text x="678" y="236" font-size="12" fill="#b17b30" text-anchor="end">no</text><rect x="386.0" y="398" width="288" height="82" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="400.0" y="422" font-size="16" fill="#b17b30" text-anchor="start">Junction, muscle or motor neuron</text><text x="400.0" y="444" font-size="13" fill="#64736c" text-anchor="start">Fatigable → junction · proximal →</text><text x="400.0" y="462" font-size="13" fill="#64736c" text-anchor="start">muscle · fasciculation → motor neuron</text><rect x="30" y="500" width="660" height="90" rx="12" fill="#ffffff" stroke="#b17b30" stroke-width="2"/><text x="44" y="526" font-size="18" fill="#b17b30" text-anchor="start">Both kinds of sign together?</text><text x="44" y="552" font-size="15" fill="#64736c" text-anchor="start">LMN signs at a level with UMN signs below suggest the cord;</text><text x="44" y="572" font-size="15" fill="#64736c" text-anchor="start">widespread mixed signs raise motor neuron disease.</text><path d="M28 604L692 604" fill="none" stroke="#d6dfd3" stroke-width="1"/><text x="28" y="627" font-size="12" fill="#64736c" text-anchor="start">NEUROLOCALIZE  /  ORIGINAL SCHEMATIC · NOT TO SCALE</text></g></svg>